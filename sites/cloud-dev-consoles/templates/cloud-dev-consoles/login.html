<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CloudCore Console</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#232f3e;color:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .login-box{background:#fff;border-radius:8px;padding:2.5rem;width:380px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
        .login-box h1{text-align:center;font-size:1.5rem;margin-bottom:.3rem;color:#232f3e}
        .login-box .subtitle{text-align:center;font-size:.85rem;color:#64748b;margin-bottom:1.5rem}
        .login-box label{display:block;font-size:.85rem;color:#37475a;margin-bottom:.3rem;font-weight:500}
        .login-box input[type="text"],.login-box input[type="password"]{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:4px;font-size:.95rem;margin-bottom:1rem}
        .login-box input:focus{border-color:#ff9900;outline:none}
        .login-box button{width:100%;padding:.7rem;background:#ff9900;color:#fff;border:none;border-radius:4px;font-size:1rem;font-weight:600;cursor:pointer}
        .login-box button:hover{background:#e88b00}
        .error{background:#f8d7da;color:#721c24;padding:.6rem;border-radius:4px;font-size:.85rem;margin-bottom:1rem}
        .logo-text{text-align:center;margin-bottom:1.5rem}
        .logo-text span{color:#ff9900;font-size:1.8rem;font-weight:700}
        .logo-text span.sub{color:#64748b;font-size:1rem;font-weight:400}
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo-text"><span>CloudCore</span> <span class="sub">Console</span></div>
        <h1>Sign In</h1>
        <p class="subtitle">Access your cloud management console</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('cloud-dev-consoles.login_submit') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
