<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Order {{ order.id }} - Lakeport Events</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1a1a2e; }
        .header { background: linear-gradient(135deg, #d63031, #e17055); padding: .8rem 2rem; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.3rem; font-weight: 700; }
        .header h1 a span { font-weight: 300; opacity: .85; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        h2 { font-size: 1.4rem; margin-bottom: 1.5rem; }
        .cancel-card { background: #fff; border-radius: .6rem; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .order-info { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; }
        .order-info p { font-size: .9rem; color: #666; margin-bottom: .3rem; }
        .order-info strong { color: #1a1a2e; }
        .warning { background: #fff3cd; color: #856404; padding: .8rem 1rem; border-radius: .3rem; font-size: .85rem; margin-bottom: 1.5rem; border: 1px solid #ffc107; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; color: #334155; font-weight: 600; margin-bottom: .4rem; }
        .form-group textarea { width: 100%; padding: .7rem; border: 1.5px solid #d1d5db; border-radius: .4rem; font-size: .9rem; min-height: 80px; resize: vertical; }
        .btn-cancel { padding: .8rem 2rem; background: #dc2626; color: #fff; border: none; border-radius: .4rem; font-size: .95rem; font-weight: 600; cursor: pointer; }
        .btn-cancel:hover { background: #b91c1c; }
        .btn-back { padding: .8rem 2rem; background: #6b7280; color: #fff; border: none; border-radius: .4rem; font-size: .95rem; font-weight: 600; cursor: pointer; text-decoration: none; margin-left: .5rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('ticketing-events.index') }}">Lakeport<span>Events</span></a></h1>
    </div>
    <div class="container">
        <h2>Cancel Order</h2>
        <div class="cancel-card">
            <div class="order-info">
                <p><strong>Order:</strong> {{ order.id }}</p>
                <p><strong>Event:</strong> {{ order.event_name }}</p>
                <p><strong>Tickets:</strong> {{ order.quantity }}</p>
                <p><strong>Total:</strong> ${{ '%.2f'|format(order.total) }}</p>
            </div>
            <div class="warning">
                This action cannot be undone. Your tickets will be cancelled and a refund of ${{ '%.2f'|format(order.total) }} will be processed.
            </div>
            <form method="POST" action="{{ url_for('ticketing-events.cancel_submit', order_id=order.id) }}">
                <div class="form-group">
                    <label for="reason">Reason for cancellation (optional)</label>
                    <textarea id="reason" name="reason" placeholder="Tell us why you're cancelling..."></textarea>
                </div>
                <button type="submit" class="btn-cancel">Confirm Cancellation</button>
                <a href="{{ url_for('ticketing-events.my_tickets') }}" class="btn-back">Go Back</a>
            </form>
        </div>
    </div>
</body>
</html>
