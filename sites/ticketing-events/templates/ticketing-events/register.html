<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Lakeport Events</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; }
        .header { background: linear-gradient(135deg, #d63031, #e17055); padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.3rem; font-weight: 700; }
        .header h1 a span { font-weight: 300; opacity: .85; }
        .register-container { max-width: 460px; margin: 3rem auto; padding: 2.5rem; background: #fff; border-radius: .6rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .register-container h2 { color: #d63031; margin-bottom: .5rem; font-size: 1.5rem; }
        .register-container .subtitle { color: #64748b; font-size: .9rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; color: #334155; font-weight: 600; margin-bottom: .4rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1.5px solid #d1d5db; border-radius: .4rem; font-size: .95rem; }
        .form-group input:focus { border-color: #d63031; outline: none; box-shadow: 0 0 0 3px rgba(214,48,49,.15); }
        .btn-register { width: 100%; padding: .8rem; background: #d63031; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-register:hover { background: #c0392b; }
        .error { background: #fef2f2; color: #dc2626; padding: .7rem 1rem; border-radius: .3rem; font-size: .85rem; margin-bottom: 1rem; border: 1px solid #fee2e2; }
        .login-link { text-align: center; margin-top: 1.5rem; font-size: .9rem; color: #64748b; }
        .login-link a { color: #d63031; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('ticketing-events.index') }}">Lakeport<span>Events</span></a></h1>
    </div>
    <div class="register-container">
        <h2>Create Account</h2>
        <p class="subtitle">Join Lakeport Events to discover and book local events</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('ticketing-events.register_submit') }}">
            <div class="form-group">
                <label for="display_name">Full Name</label>
                <input type="text" id="display_name" name="display_name" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone (optional)</label>
                <input type="text" id="phone" name="phone" placeholder="(555) 000-0000">
            </div>
            <button type="submit" class="btn-register">Create Account</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="{{ url_for('ticketing-events.login_page') }}">Sign in</a>
        </div>
    </div>
</body>
</html>
