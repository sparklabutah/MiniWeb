<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormFlow - Response Submitted</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #202124; }
        .header { background: #673ab7; color: #fff; padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 700; }
        .header-nav { display: flex; gap: 1.2rem; align-items: center; }
        .header-nav a { color: #e1bee7; text-decoration: none; font-size: .9rem; }
        .header-nav a:hover { color: #fff; }
        .container { max-width: 600px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; }
        .success-card { background: #fff; border-radius: 8px; border: 1px solid #dadce0; border-top: 4px solid #4caf50; padding: 2.5rem; }
        .success-card .check { font-size: 3rem; color: #4caf50; margin-bottom: 1rem; }
        .success-card h2 { font-size: 1.3rem; margin-bottom: .5rem; }
        .success-card p { color: #5f6368; font-size: .95rem; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: .6rem 1.5rem; font-size: .9rem; border-radius: 6px; text-decoration: none; font-weight: 500; }
        .btn.primary { background: #673ab7; color: #fff; }
        .btn.primary:hover { background: #5e35b1; }
        .btn.secondary { background: #fff; color: #673ab7; border: 1px solid #673ab7; margin-left: .5rem; }
        .btn.secondary:hover { background: #f3e5f5; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FormFlow</h1>
        <div class="header-nav">
            <a href="{{ url_for('forms-surveys.index') }}">My Forms</a>
        </div>
    </div>
    <div class="container">
        <div class="success-card">
            <div class="check">&#10003;</div>
            <h2>Response Submitted</h2>
            <p>Your response to "{{ form.title }}" has been recorded. Thank you for your feedback!</p>
            <a href="{{ url_for('forms-surveys.index') }}" class="btn primary">Back to My Forms</a>
            <a href="{{ url_for('forms-surveys.respond_form', form_id=form.id) }}" class="btn secondary">Submit Another</a>
        </div>
    </div>
</body>
</html>
