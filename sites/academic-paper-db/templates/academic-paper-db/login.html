<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ScholarBase</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .header { border-bottom: 1px solid #e2e8f0; padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; margin: 0; color: #1e3a5f; }
        .login-form { max-width: 400px; margin: 4rem auto; padding: 2rem; border: 1px solid #e2e8f0; border-radius: .5rem; }
        .login-form h2 { margin: 0 0 1.5rem; font-size: 1.3rem; color: #1e293b; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: #475569; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .6rem .8rem; border: 1px solid #cbd5e1; border-radius: .3rem; font-size: .95rem; }
        .form-group input:focus { border-color: #3b82f6; outline: none; }
        .btn-login { width: 100%; padding: .7rem; background: #1e3a5f; color: #fff; border: none; border-radius: .3rem; cursor: pointer; font-size: 1rem; }
        .btn-login:hover { background: #2d4a6f; }
        .error { color: #dc2626; font-size: .85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('academic-paper-db.index') }}" style="color:inherit;text-decoration:none">ScholarBase</a></h1>
        <a href="/" class="back-link">&larr; MiniWeb</a>
    </div>

    <form class="login-form" method="post" action="{{ url_for('academic-paper-db.login_submit') }}">
        <h2>Sign In</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
</body>
</html>
