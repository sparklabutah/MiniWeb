<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saved Translations - LinguaBridge</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: 'Google Sans', Roboto, -apple-system, sans-serif; background: #f8f9fa; color: #202124; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .container > a:first-child { display: inline-block; font-size: 14px; color: #1a73e8; text-decoration: none; padding: 8px 16px; border-radius: 8px; background: #e8f0fe; margin: 4px 0 20px; }
        .container > a:first-child:hover { background: #d2e3fc; text-decoration: none; }
        h1 { font-size: 24px; font-weight: 500; color: #202124; margin: 0 0 20px; }
        form { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
        select { font-family: inherit; font-size: 14px; color: #1a73e8; font-weight: 500; background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 10px 12px; outline: none; cursor: pointer; }
        select:focus { border-color: #1a73e8; }
        button { font-family: inherit; font-size: 14px; font-weight: 500; color: #fff; background: #1a73e8; border: none; border-radius: 8px; padding: 10px 24px; cursor: pointer; }
        button:hover { background: #1765cc; }
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
        table th, table td { border: 1px solid #dadce0; padding: 10px 12px; text-align: left; vertical-align: top; word-break: break-word; }
        table th { font-size: 13px; font-weight: 500; color: #5f6368; background: #f8f9fa; white-space: nowrap; }
        table tr:hover td { background: #f8f9fa; }
        table td:nth-child(-n+4) { color: #5f6368; white-space: nowrap; }
        .saved-delete-btn { background: #fff; color: #d93025; border: 1px solid #dadce0; padding: 6px 14px; font-size: 13px; }
        .saved-delete-btn:hover { background: #fce8e6; border-color: #d93025; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('translation.index') }}">&larr; Back to Translate</a>
        <h1>Saved Translations</h1>

        <form method="GET">
            <select name="label">
                <option value="">All labels</option>
                {% for l in labels %}
                <option value="{{ l }}" {% if l == selected_label %}selected{% endif %}>{{ l }}</option>
                {% endfor %}
            </select>
            <button type="submit">Filter</button>
        </form>

        <table border="1" cellpadding="5">
            <tr>
                <th>ID</th><th>Label</th><th>From</th><th>To</th><th>Source</th><th>Translation</th><th>Actions</th>
            </tr>
            {% for s in saved %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.label }}</td>
                <td>{{ s.source_lang }}</td>
                <td>{{ s.target_lang }}</td>
                <td>{{ s.source_text }}</td>
                <td>{{ s.translated_text }}</td>
                <td>
                    <button class="saved-delete-btn" data-url="{{ url_for('translation.delete_saved_form', saved_id=s.id) }}">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
    <script>
    document.addEventListener('click', function(e) {
        var btn = e.target.closest('.saved-delete-btn');
        if (!btn) return;
        btn.textContent = 'Deleting...';
        btn.disabled = true;
        fetch(btn.getAttribute('data-url'), {method: 'POST'})
            .then(function(r) { return r.ok ? r : Promise.reject(); })
            .then(function() { btn.textContent = 'Done!'; window.location.reload(); })
            .catch(function() { btn.textContent = 'Error'; setTimeout(function() { btn.textContent = 'Delete'; btn.disabled = false; }, 2000); });
    });
    </script>
</body>
</html>
