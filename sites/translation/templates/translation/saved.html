<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saved Translations - LinguaBridge</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <a href="{{ url_for('translation.index') }}">&larr; Back to Translate</a>
        <h1>Saved Translations</h1>

        <form method="GET">
            <select name="label">
                <option value="">All labels</option>
                {% for l in labels %}
                <option value="{{ l }}" {% if l == selected_label %}selected{% endif %}>{{ l }}</option>
                {% endfor %}
            </select>
            <button type="submit">Filter</button>
        </form>

        <table border="1" cellpadding="5">
            <tr>
                <th>ID</th><th>Label</th><th>From</th><th>To</th><th>Source</th><th>Translation</th><th>Actions</th>
            </tr>
            {% for s in saved %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.label }}</td>
                <td>{{ s.source_lang }}</td>
                <td>{{ s.target_lang }}</td>
                <td>{{ s.source_text }}</td>
                <td>{{ s.translated_text }}</td>
                <td>
                    <form method="POST" action="{{ url_for('translation.delete_saved_form', saved_id=s.id) }}" onsubmit="return confirm('Delete this saved translation?')">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
