<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glossaries - LinguaBridge</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: 'Google Sans', Roboto, -apple-system, sans-serif; background: #f8f9fa; color: #202124; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .container > a:first-child { display: inline-block; font-size: 14px; color: #1a73e8; text-decoration: none; padding: 8px 16px; border-radius: 8px; background: #e8f0fe; margin: 4px 0 20px; }
        .container > a:first-child:hover { background: #d2e3fc; text-decoration: none; }
        h1 { font-size: 24px; font-weight: 500; color: #202124; margin: 0 0 20px; }
        h3 { font-size: 14px; font-weight: 500; color: #5f6368; margin: 28px 0 12px; }
        form { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input[type="text"], select { font-family: inherit; font-size: 14px; color: #202124; background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 10px 12px; outline: none; }
        input[type="text"]:focus, select:focus { border-color: #1a73e8; }
        input[type="text"] { flex: 1; min-width: 180px; }
        select { color: #1a73e8; font-weight: 500; cursor: pointer; }
        button { font-family: inherit; font-size: 14px; font-weight: 500; color: #fff; background: #1a73e8; border: none; border-radius: 8px; padding: 10px 24px; cursor: pointer; }
        button:hover { background: #1765cc; }
        ul { list-style: none; margin: 0; padding: 0; }
        ul li { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; font-size: 13px; color: #9aa0a6; }
        ul li:hover { background: #f8f9fa; }
        ul li a { font-size: 14px; font-weight: 500; color: #1a73e8; text-decoration: none; margin-right: 8px; }
        ul li a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('translation.index') }}">&larr; Back to Translate</a>
        <h1>Custom Glossaries</h1>

        {% if logged_in %}
        <h3>Create New Glossary</h3>
        <form method="POST" action="{{ url_for('translation.create_glossary_form') }}">
            <input type="text" name="name" placeholder="Glossary name" required>
            <select name="source_lang">
                {% for lang in languages %}
                <option value="{{ lang.code }}">{{ lang.name }}</option>
                {% endfor %}
            </select>
            <select name="target_lang">
                {% for lang in languages %}
                <option value="{{ lang.code }}" {% if loop.index == 2 %}selected{% endif %}>{{ lang.name }}</option>
                {% endfor %}
            </select>
            <button type="submit">Create</button>
        </form>
        {% endif %}

        <h3>Your Glossaries</h3>
        <ul>
            {% for g in glossaries %}
            <li>
                <a href="{{ url_for('translation.glossary_detail', glossary_id=g.id) }}">{{ g.name }}</a>
                ({{ g.source_lang }} &rarr; {{ g.target_lang }}, {{ g.entries|length }} entries)
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
