<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Playlist - SoundWave</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        a { color: #1db954; text-decoration: none; }
        a:hover { color: #1ed760; }
        .create-box { background: #181818; border-radius: .5rem; padding: 2.5rem; width: 100%; max-width: 500px; }
        .create-box h1 { font-size: 1.8rem; color: #fff; margin-bottom: .5rem; }
        .create-box .subtitle { color: #888; margin-bottom: 1.5rem; font-size: .9rem; }
        .create-box label { display: block; font-size: .85rem; color: #888; margin-bottom: .3rem; }
        .create-box input[type="text"],
        .create-box textarea { width: 100%; padding: .6rem .8rem; border: 1px solid #333; border-radius: .3rem; background: #0a0a0a; color: #e0e0e0; font-size: .95rem; margin-bottom: 1rem; }
        .create-box textarea { resize: vertical; min-height: 80px; }
        .create-box input:focus, .create-box textarea:focus { border-color: #1db954; outline: none; }
        .checkbox-row { display: flex; align-items: center; gap: .5rem; margin-bottom: 1.2rem; }
        .checkbox-row input[type="checkbox"] { accent-color: #1db954; }
        .create-box button { width: 100%; padding: .7rem; background: #1db954; color: #000; border: none; border-radius: 1.5rem; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .create-box button:hover { background: #1ed760; }
        .error { color: #e74c3c; font-size: .85rem; text-align: center; margin-bottom: 1rem; }
        .back-link { text-align: center; margin-top: 1rem; font-size: .9rem; }
    </style>
</head>
<body>
    <div class="create-box">
        <h1>Create Playlist</h1>
        <p class="subtitle">Give your playlist a name and description</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('music.create_playlist_submit') }}">
            <label for="name">Playlist Name</label>
            <input type="text" id="name" name="name" placeholder="My Awesome Playlist" required>
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Add an optional description"></textarea>
            <div class="checkbox-row">
                <input type="checkbox" id="is_public" name="is_public" checked>
                <label for="is_public" style="margin-bottom: 0;">Make playlist public</label>
            </div>
            <button type="submit">Create Playlist</button>
        </form>
        <div class="back-link"><a href="{{ url_for('music.playlists_page') }}">Back to Playlists</a></div>
    </div>
</body>
</html>
