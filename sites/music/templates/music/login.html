{% extends "music/base.html" %}
{% set active = '' %}
{% block title %}Log In — SoundWave{% endblock %}
{% block content %}
<div class="form-card">
    <h1 style="font-size:1.8rem;color:#fff;text-align:center;margin-bottom:6px;">SoundWave</h1>
    <p style="text-align:center;color:#888;margin-bottom:22px;font-size:.9rem;">Log in to your account</p>
    {% if error %}
    <div style="color:#e74c3c;font-size:.85rem;text-align:center;margin-bottom:16px;">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('music.login_submit') }}">
        <div class="fg">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        <div class="fg">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-green" style="width:100%;">Log In</button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:.9rem;"><a href="{{ url_for('music.index') }}" style="color:#1db954;">Back to SoundWave</a></div>
</div>
{% endblock %}
