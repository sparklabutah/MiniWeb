<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - SoundWave</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        a { color: #1db954; text-decoration: none; }
        a:hover { color: #1ed760; }

        .login-box { background: #181818; border-radius: .5rem; padding: 2.5rem; width: 100%; max-width: 400px; }
        .login-box h1 { font-size: 1.8rem; color: #fff; text-align: center; margin-bottom: .5rem; }
        .login-box .subtitle { text-align: center; color: #888; margin-bottom: 1.5rem; font-size: .9rem; }
        .login-box label { display: block; font-size: .85rem; color: #888; margin-bottom: .3rem; }
        .login-box input { width: 100%; padding: .6rem .8rem; border: 1px solid #333; border-radius: .3rem; background: #0a0a0a; color: #e0e0e0; font-size: .95rem; margin-bottom: 1rem; }
        .login-box input:focus { border-color: #1db954; outline: none; }
        .login-box button { width: 100%; padding: .7rem; background: #1db954; color: #000; border: none; border-radius: 1.5rem; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .login-box button:hover { background: #1ed760; }
        .error { color: #e74c3c; font-size: .85rem; text-align: center; margin-bottom: 1rem; }
        .back-link { text-align: center; margin-top: 1rem; font-size: .9rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>SoundWave</h1>
        <p class="subtitle">Log in to your account</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('music.login_submit') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="submit">Log In</button>
        </form>
        <div class="back-link"><a href="{{ url_for('music.index') }}">Back to SoundWave</a></div>
    </div>
</body>
</html>
