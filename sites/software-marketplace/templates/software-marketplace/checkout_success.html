<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Complete - AppVault</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
        .header { background: #1e40af; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.5rem; }
        .nav { display: flex; gap: 1.5rem; align-items: center; }
        .nav a { color: #dbeafe; text-decoration: none; font-size: .95rem; }
        .nav a:hover { color: #fff; }
        .container { max-width: 500px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; }
        .success-icon { width: 80px; height: 80px; background: #ecfdf5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem; color: #059669; }
        h2 { font-size: 1.6rem; margin-bottom: .5rem; }
        .subtitle { color: #64748b; font-size: 1rem; margin-bottom: 1.5rem; }
        .total { font-size: 1.3rem; font-weight: 700; color: #059669; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: .7rem 1.5rem; background: #2563eb; color: #fff; border: none; border-radius: .5rem; font-size: .95rem; font-weight: 600; cursor: pointer; text-decoration: none; margin: 0 .5rem; }
        .btn:hover { background: #1d4ed8; }
        .btn-outline { background: #fff; color: #2563eb; border: 1px solid #2563eb; }
        .btn-outline:hover { background: #eff6ff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AppVault</h1>
        <div class="nav">
            <a href="{{ url_for('software-marketplace.index') }}">Home</a>
            <a href="{{ url_for('software-marketplace.apps_list') }}">Browse</a>
            <a href="{{ url_for('software-marketplace.my_apps') }}">My Apps</a>
            <a href="{{ url_for('software-marketplace.logout') }}">Logout ({{ user.display_name }})</a>
            <a href="/">&larr; MiniWeb</a>
        </div>
    </div>

    <div class="container">
        <div class="success-icon">&#10003;</div>
        <h2>Purchase Complete!</h2>
        <p class="subtitle">{{ purchased_app_ids|length }} app{{ 's' if purchased_app_ids|length != 1 }} have been installed to your account.</p>
        <div class="total">Total: ${{ "%.2f"|format(total) }}</div>
        <a href="{{ url_for('software-marketplace.my_apps') }}" class="btn">View My Apps</a>
        <a href="{{ url_for('software-marketplace.apps_list') }}" class="btn btn-outline">Continue Browsing</a>
    </div>
</body>
</html>
