<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AppVault</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
        .header { background: #1e40af; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.5rem; }
        .nav { display: flex; gap: 1.5rem; align-items: center; }
        .nav a { color: #dbeafe; text-decoration: none; font-size: .95rem; }
        .nav a:hover { color: #fff; }
        .login-container { max-width: 400px; margin: 4rem auto; padding: 0 1.5rem; }
        .login-box { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 2rem; }
        .login-box h2 { font-size: 1.4rem; margin-bottom: .5rem; text-align: center; }
        .login-box .subtitle { color: #64748b; font-size: .9rem; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .88rem; font-weight: 600; color: #475569; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1px solid #cbd5e1; border-radius: .4rem; font-size: .95rem; outline: none; }
        .form-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
        .btn { width: 100%; padding: .75rem; background: #2563eb; color: #fff; border: none; border-radius: .5rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        .error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: .75rem; border-radius: .4rem; margin-bottom: 1rem; font-size: .9rem; text-align: center; }
        .demo-accounts { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; }
        .demo-accounts h4 { font-size: .88rem; color: #64748b; margin-bottom: .5rem; }
        .demo-accounts table { width: 100%; font-size: .82rem; border-collapse: collapse; }
        .demo-accounts td { padding: .3rem .5rem; color: #64748b; }
        .demo-accounts td:first-child { font-weight: 600; color: #475569; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AppVault</h1>
        <div class="nav">
            <a href="{{ url_for('software-marketplace.index') }}">Home</a>
            <a href="{{ url_for('software-marketplace.apps_list') }}">Browse</a>
            <a href="/">&larr; MiniWeb</a>
        </div>
    </div>

    <div class="login-container">
        <div class="login-box">
            <h2>Sign In</h2>
            <p class="subtitle">Log in to install apps and write reviews</p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('software-marketplace.login_submit') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>

            <div class="demo-accounts">
                <h4>Demo Accounts</h4>
                <table>
                    <tr><td>alex_dev</td><td>pass123</td></tr>
                    <tr><td>samantha_k</td><td>pass123</td></tr>
                    <tr><td>marcus_j</td><td>pass123</td></tr>
                    <tr><td>priya_s</td><td>pass123</td></tr>
                    <tr><td>jordan_w</td><td>pass123</td></tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
