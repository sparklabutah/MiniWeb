<div class="ft-top">
    <div class="ft-top-inner">
        <a class="ft-brand" href="{{ url_for('health-fitness-tracking.index') }}">Fit<span class="dot">◈</span>Track</a>
        <nav class="ft-nav">
            <a href="{{ url_for('health-fitness-tracking.index') }}" class="{{ 'active' if active_page == 'overview' }}">Overview</a>
            <a href="{{ url_for('health-fitness-tracking.workouts_page') }}" class="{{ 'active' if active_page == 'activity' }}">Activity</a>
            <a href="{{ url_for('health-fitness-tracking.nutrition_page') }}" class="{{ 'active' if active_page == 'nutrition' }}">Nutrition</a>
            <a href="{{ url_for('health-fitness-tracking.stats_page') }}" class="{{ 'active' if active_page == 'trends' }}">Trends</a>
            <a href="{{ url_for('health-fitness-tracking.goals_page') }}" class="{{ 'active' if active_page == 'goals' }}">Goals</a>
        </nav>
        <div class="ft-top-right">
            {% if user %}<span>{{ user.display_name or user.username }}</span>
            <span class="ft-avatar">{{ (user.display_name or user.username)[0]|upper }}</span>{% endif %}
        </div>
    </div>
</div>
