<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FitTrack</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #fff; border-radius: .6rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 2.5rem; width: 100%; max-width: 400px; }
        .login-box h1 { text-align: center; color: #0073e6; margin-bottom: .3rem; font-size: 1.6rem; }
        .login-box p { text-align: center; color: #888; margin-bottom: 1.5rem; font-size: .85rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .7rem; border: 1px solid #ddd; border-radius: .3rem; font-size: .9rem; }
        .form-group input:focus { outline: none; border-color: #0073e6; box-shadow: 0 0 0 3px rgba(0,115,230,.1); }
        .btn { width: 100%; padding: .8rem; background: #0073e6; color: #fff; border: none; border-radius: .3rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #005bb5; }
        .error { color: #e74c3c; text-align: center; margin-bottom: 1rem; font-size: .85rem; }
        .back { display: block; text-align: center; margin-top: 1rem; color: #0073e6; text-decoration: none; font-size: .85rem; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>FitTrack</h1>
        <p>Sign in to your fitness dashboard</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('health-fitness-tracking.login_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <a href="{{ url_for('health-fitness-tracking.index') }}" class="back">Back to Dashboard</a>
    </div>
</body>
</html>
