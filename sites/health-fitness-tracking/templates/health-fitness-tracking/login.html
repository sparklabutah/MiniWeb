<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FitTrack</title>
    <link rel="stylesheet" href="/static/fittrack.css">
</head>
<body>
    <div class="ft-top">
        <div class="ft-top-inner">
            <a class="ft-brand" href="{{ url_for('health-fitness-tracking.index') }}">Fit<span class="dot">◈</span>Track</a>
        </div>
    </div>
    <div class="ft-login-wrap">
        <div class="panel ft-login">
            <div class="panel-h"><h3>Sign In</h3></div>
            <div class="panel-b">
                {% if error %}
                <div class="error" style="color:var(--red); text-align:center; margin-bottom:1rem; font-size:.85rem;">{{ error }}</div>
                {% endif %}
                <form method="POST" action="{{ url_for('health-fitness-tracking.login_submit') }}">
                    <div class="ft-field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required placeholder="Enter your username">
                    </div>
                    <div class="ft-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                    </div>
                    <button type="submit" class="ft-btn" style="width:100%;">Sign In</button>
                </form>
                <a href="{{ url_for('health-fitness-tracking.index') }}" class="back" style="display:block; text-align:center; margin-top:1rem; color:var(--blue); font-size:.85rem;">Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
