<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - LakeReview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #fff; border-radius: 8px; padding: 32px; width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .login-card h1 { font-size: 24px; margin-bottom: 4px; color: #d32323; }
        .login-card p { font-size: 14px; color: #777; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .error { color: #d32323; font-size: 13px; margin-bottom: 12px; padding: 8px; background: #fff0f0; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: #d32323; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #b41c1c; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>LakeReview</h1>
        <p>Log in to write reviews and save your favorites</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('rating-review.login') }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required>
            </div>
                <label for="password" style="display:block;margin-top:.6rem;font-size:.85rem;font-weight:500;">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter password" style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:.3rem;margin-top:.3rem;" required>
            <button type="submit" class="btn">Log In</button>
        </form>
    </div>
</body>
</html>
