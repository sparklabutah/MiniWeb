<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHaven Online Store</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .header {
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 1.4rem;
            margin: 0;
        }
        .search-bar {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .search-bar input {
            width: 100%;
            padding: .75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: .5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color .15s;
        }
        .search-bar input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.12);
        }
        .book-list {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem;
        }
        .book-item {
            display: block;
            border: 1px solid #e2e8f0;
            border-radius: .5rem;
            padding: 1.25rem;
            margin-bottom: .75rem;
            text-decoration: none;
            color: inherit;
            transition: border-color .15s, box-shadow .15s;
        }
        .book-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
            text-decoration: none;
        }
        .book-item h2 {
            margin: 0 0 .2rem;
            font-size: 1.1rem;
        }
        .book-meta {
            color: #64748b;
            font-size: .88rem;
        }
        .book-meta .price {
            color: #059669;
            font-weight: 600;
        }
        .no-results {
            text-align: center;
            color: #94a3b8;
            padding: 2rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>BookHaven</h1>
        <a href="/" class="back-link">&larr; Back to MiniWeb</a>
    </div>

    <div class="search-bar">
        <input type="text" id="search" placeholder="Search books by title, author, or genre..." autofocus autocomplete="off">
    </div>

    <div class="book-list" id="book-list">
        {% for book in books %}
        <a class="book-item" href="{{ url_for('bookstore.book_detail', book_id=book.id) }}"
           data-title="{{ book.title|lower }}" data-author="{{ book.author|lower }}"
           data-genre="{{ book.genre|lower }}">
            <h2>{{ book.title }}</h2>
            <div class="book-meta">
                {{ book.author }} &middot; {{ book.genre }} &middot; {{ book.year }}
                <span class="price">${{ "%.2f"|format(book.price) }}</span>
            </div>
        </a>
        {% endfor %}
    </div>

    <div class="no-results" id="no-results">No books match your search.</div>

    <script>
    const input = document.getElementById("search");
    const list = document.getElementById("book-list");
    const items = list.querySelectorAll(".book-item");
    const noResults = document.getElementById("no-results");

    input.addEventListener("input", () => {
        const q = input.value.toLowerCase().trim();
        let visible = 0;
        items.forEach(item => {
            const match = !q
                || item.dataset.title.includes(q)
                || item.dataset.author.includes(q)
                || item.dataset.genre.includes(q);
            item.style.display = match ? "" : "none";
            if (match) visible++;
        });
        noResults.style.display = visible === 0 ? "block" : "none";
    });
    </script>
</body>
</html>
