<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - BookHaven</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .header {
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 1.4rem;
            margin: 0;
        }
        .book-detail {
            max-width: 640px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
        }
        .book-detail h2 {
            font-size: 1.8rem;
            margin: 0 0 .3rem;
        }
        .meta-line {
            color: #64748b;
            font-size: .95rem;
            margin-bottom: 1.5rem;
        }
        .price-tag {
            display: inline-block;
            background: #ecfdf5;
            color: #059669;
            font-weight: 700;
            font-size: 1.2rem;
            padding: .4rem .9rem;
            border-radius: .4rem;
            margin-bottom: 1.5rem;
        }
        .description {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #334155;
        }
        .back {
            display: inline-block;
            margin-top: 2rem;
            font-size: .95rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>BookHaven</h1>
        <a href="/" class="back-link">&larr; Back to MiniWeb</a>
    </div>

    <div class="book-detail">
        <a href="{{ url_for('bookstore.index') }}" class="back">&larr; All books</a>
        <h2>{{ book.title }}</h2>
        <div class="meta-line">
            {{ book.author }} &middot; {{ book.genre }} &middot; {{ book.year }}
        </div>
        <div class="price-tag">${{ "%.2f"|format(book.price) }}</div>
        <p class="description">{{ book.description }}</p>
    </div>
</body>
</html>
