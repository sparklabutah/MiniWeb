<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Review -- {{ paper.title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #1e293b; }
        .header { border-bottom: 2px solid #7c3aed; padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .header h1 { font-size: 1.3rem; color: #7c3aed; }
        .header h1 a { color: inherit; text-decoration: none; }
        .header-nav a { margin-left: 1rem; font-size: .9rem; color: #475569; text-decoration: none; }
        .main { max-width: 700px; margin: 2rem auto; padding: 0 1.5rem 3rem; }
        .back-link { font-size: .9rem; display: inline-block; margin-bottom: 1rem; color: #7c3aed; text-decoration: none; }
        .paper-title { font-size: 1.2rem; color: #1e293b; margin-bottom: 1.5rem; }
        .review-form { background: #fff; border: 1px solid #e2e8f0; border-radius: .5rem; padding: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; color: #475569; margin-bottom: .3rem; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: .6rem .8rem; border: 1px solid #cbd5e1; border-radius: .3rem; font-size: .95rem; font-family: inherit; }
        .form-group textarea { min-height: 200px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #7c3aed; outline: none; }
        .btn-submit { padding: .7rem 2rem; background: #7c3aed; color: #fff; border: none; border-radius: .3rem; cursor: pointer; font-size: 1rem; }
        .btn-submit:hover { background: #6d28d9; }
        .help-text { font-size: .8rem; color: #94a3b8; margin-top: .2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('conference-review-submission.index') }}">OpenReview ICLR 2017</a></h1>
        <div class="header-nav">
            <a href="{{ url_for('conference-review-submission.index') }}">Papers</a>
            <a href="{{ url_for('conference-review-submission.stats_page') }}">Statistics</a>
            <a href="{{ url_for('conference-review-submission.dashboard') }}">Dashboard</a>
            <a href="/">MiniWeb</a>
        </div>
    </div>

    <div class="main">
        <a href="{{ url_for('conference-review-submission.paper_detail', paper_id=paper.id) }}" class="back-link">&larr; Back to paper</a>
        <div class="paper-title">Reviewing: {{ paper.title }}</div>

        <form class="review-form" method="post" action="{{ url_for('conference-review-submission.review_form', paper_id=paper.id) }}">
            <div class="form-group">
                <label for="title">Review Title</label>
                <input type="text" name="title" id="title" placeholder="e.g., Strong contribution with minor issues" required>
            </div>
            <div class="form-group">
                <label for="recommendation">Recommendation (1-10)</label>
                <select name="recommendation" id="recommendation" required>
                    <option value="">Select score...</option>
                    {% for i in range(1, 11) %}
                    <option value="{{ i }}">{{ i }} {% if i <= 3 %}(Reject){% elif i <= 5 %}(Weak Reject){% elif i <= 7 %}(Weak Accept){% else %}(Accept){% endif %}</option>
                    {% endfor %}
                </select>
                <div class="help-text">1 = strong reject, 10 = strong accept</div>
            </div>
            <div class="form-group">
                <label for="confidence">Confidence (1-5)</label>
                <select name="confidence" id="confidence" required>
                    <option value="">Select confidence...</option>
                    <option value="1">1 (Not confident)</option>
                    <option value="2">2 (Somewhat confident)</option>
                    <option value="3">3 (Fairly confident)</option>
                    <option value="4">4 (Confident)</option>
                    <option value="5">5 (Very confident / Expert)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="comments">Detailed Comments</label>
                <textarea name="comments" id="comments" placeholder="Provide detailed feedback on strengths, weaknesses, clarity, novelty, and significance..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Submit Review</button>
        </form>
    </div>
</body>
</html>
