<style>
    /* OpenReview-flavored shared styles (Bootstrap 3 era look) */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans', 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #fff; color: #333; font-size: 14px; line-height: 1.5; }
    a { color: #4d6d87; text-decoration: none; }
    a:hover { color: #34506a; text-decoration: underline; }
    h1, h2, h3, h4 { font-weight: 600; color: #222; }

    /* navbar — OpenReview maroon with embedded search */
    .or-navbar { background: #8c1d13; min-height: 60px; display: flex; align-items: center; gap: 18px; padding: 0 28px; flex-wrap: wrap; }
    .or-navbar .or-brand { color: #fff; font-size: 22px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .or-navbar .or-brand:hover { color: #fff; text-decoration: none; }
    .or-navbar .or-brand .or-brand-tld { color: rgba(255,255,255,.55); font-weight: 400; }
    .or-navbar .nav-search { display: flex; flex: 0 1 440px; min-width: 200px; }
    .or-navbar .nav-search input { flex: 1; border: none; border-radius: 3px 0 0 3px; padding: 9px 14px; font-size: 14px; background: #eceae9; color: #333; font-family: inherit; }
    .or-navbar .nav-search input:focus { outline: none; background: #fff; }
    .or-navbar .nav-search button { border: none; border-radius: 0 3px 3px 0; background: #dcdad9; padding: 0 14px; cursor: pointer; font-size: 14px; }
    .or-navbar .nav-search button:hover { background: #cfcdcc; }
    .or-navbar a.nav-link { color: #fff; font-size: 15px; text-decoration: none; padding: 0 12px; line-height: 60px; display: inline-block; }
    .or-navbar a.nav-link:hover { color: rgba(255,255,255,.75); }
    .or-navbar .nav-right { margin-left: auto; display: flex; align-items: center; }

    /* tagline strip under the navbar */
    .or-tagline { background: #e6e5e4; color: #444; text-align: center; padding: 11px 16px; font-size: 14.5px; }

    .or-container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
    .or-content { max-width: 1000px; margin: 0 auto; padding: 24px 20px 64px; }

    /* bootstrap-style buttons */
    .btn { display: inline-block; padding: 6px 12px; font-size: 14px; font-weight: 400; line-height: 1.42; text-align: center; white-space: nowrap; vertical-align: middle; cursor: pointer; border: 1px solid transparent; border-radius: 3px; text-decoration: none; }
    .btn:hover { text-decoration: none; }
    .btn-default { color: #333; background: #fff; border-color: #ccc; }
    .btn-default:hover { background: #e6e6e6; border-color: #adadad; color: #333; }
    .btn-primary { color: #fff; background: #337ab7; border-color: #2e6da4; }
    .btn-primary:hover { color: #fff; background: #286090; border-color: #204d74; }
    .btn-success { color: #fff; background: #5cb85c; border-color: #4cae4c; }
    .btn-success:hover { color: #fff; background: #449d44; }
    .btn-danger-outline { color: #d9534f; background: #fff; border-color: #d9534f; }
    .btn-danger-outline:hover { background: #f9eaea; color: #c9302c; }
    .btn-xs { padding: 2px 8px; font-size: 12px; }
    .btn-sm { padding: 4px 10px; font-size: 13px; }

    /* bootstrap-style label pills */
    .label { display: inline-block; padding: .2em .6em .3em; font-size: 11px; font-weight: 700; line-height: 1; color: #fff; text-align: center; white-space: nowrap; vertical-align: middle; border-radius: .25em; }
    .label-success { background: #5cb85c; }
    .label-danger { background: #d9534f; }
    .label-info { background: #5bc0de; }
    .label-warning { background: #f0ad4e; }
    .label-default { background: #777; }
    .label-primary { background: #337ab7; }

    /* nav tabs */
    .nav-tabs { border-bottom: 1px solid #ddd; list-style: none; display: flex; flex-wrap: wrap; margin-bottom: 18px; padding-left: 0; }
    .nav-tabs a { display: block; padding: 10px 15px; margin-bottom: -1px; font-size: 14px; color: #337ab7; border: 1px solid transparent; border-radius: 4px 4px 0 0; text-decoration: none; }
    .nav-tabs a:hover { background: #eee; border-color: #eee #eee #ddd; text-decoration: none; }
    .nav-tabs a.active { color: #555; background: #fff; border-color: #ddd #ddd transparent; cursor: default; }

    /* panels */
    .panel { border: 1px solid #ddd; border-radius: 4px; margin-bottom: 20px; background: #fff; }
    .panel-heading { padding: 10px 15px; background: #f5f5f5; border-bottom: 1px solid #ddd; border-radius: 3px 3px 0 0; font-size: 14px; font-weight: 600; color: #333; }
    .panel-body { padding: 15px; }

    /* alerts */
    .alert { padding: 12px 15px; border: 1px solid transparent; border-radius: 4px; margin-bottom: 20px; font-size: 13px; }
    .alert-info { color: #31708f; background: #d9edf7; border-color: #bce8f1; }
    .alert-info a { color: #245269; font-weight: 700; }
    .alert-danger { color: #a94442; background: #f2dede; border-color: #ebccd1; }

    /* forms */
    .form-control { display: block; width: 100%; padding: 6px 12px; font-size: 14px; line-height: 1.42; color: #555; background: #fff; border: 1px solid #ccc; border-radius: 3px; font-family: inherit; }
    .form-control:focus { border-color: #66afe9; outline: 0; box-shadow: 0 0 6px rgba(102,175,233,.4); }
    .control-label { display: block; font-size: 13px; font-weight: 700; color: #333; margin-bottom: 5px; }
    .help-block { font-size: 12px; color: #737373; margin-bottom: 5px; }

    /* tables */
    .table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .table th { padding: 8px; border-bottom: 2px solid #ddd; text-align: left; font-size: 13px; color: #333; }
    .table td { padding: 8px; border-top: 1px solid #ddd; font-size: 13px; vertical-align: middle; }
    .table-hover tbody tr:hover { background: #f5f5f5; }

    /* forum-style note (paper) rows */
    .note { padding: 12px 0; border-bottom: 1px solid #eee; }
    .note:last-child { border-bottom: none; }
    .note-title { font-size: 15px; line-height: 1.4; margin-bottom: 2px; }
    .note-title a { color: #337ab7; }
    .note-authors { font-size: 12.5px; color: #8c8c8c; font-style: italic; margin-bottom: 3px; }
    .note-abstract { font-size: 13px; color: #555; line-height: 1.55; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
    .note-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: #8c8c8c; }
    .note-meta .dot { color: #ccc; }

    /* forum reply (review) cards */
    .reply { border: 1px solid #ddd; border-left: 4px solid #ddd; border-radius: 3px; margin-bottom: 12px; background: #fff; }
    .reply.meta-review { border-left-color: #5bc0de; }
    .reply-heading { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; user-select: none; flex-wrap: wrap; }
    .reply-heading:hover { background: #f9f9f9; }
    .reply-heading .reply-title { font-size: 14px; font-weight: 700; color: #333; }
    .reply-heading .reply-date { font-size: 12px; color: #8c8c8c; }
    .reply-fields { padding: 0 15px 6px; font-size: 13px; color: #333; }
    .reply-fields .field { margin-bottom: 4px; }
    .reply-fields .field strong { font-weight: 700; }
    .reply-body { padding: 6px 15px 12px; font-size: 13px; line-height: 1.65; color: #444; white-space: pre-wrap; }
    .reply-body.collapsed { max-height: 110px; overflow: hidden; position: relative; }
    .reply-body.collapsed::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 46px; background: linear-gradient(transparent, #fff); }
    .toggle-review { padding: 0 15px 10px; font-size: 12px; color: #337ab7; cursor: pointer; }
    .toggle-review:hover { text-decoration: underline; }

    /* score bar (kept from old UI, restyled) */
    .score-indicator { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
    .score-indicator .bar { width: 40px; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .score-indicator .fill { height: 100%; border-radius: 2px; }
    .score-indicator .fill.high { background: #5cb85c; }
    .score-indicator .fill.mid { background: #f0ad4e; }
    .score-indicator .fill.low { background: #d9534f; }

    /* pagination */
    .pagination { display: flex; justify-content: center; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }
    .pagination a, .pagination span { display: inline-block; padding: 6px 12px; font-size: 13px; color: #337ab7; border: 1px solid #ddd; margin-left: -1px; text-decoration: none; }
    .pagination a:hover { background: #eee; text-decoration: none; }
    .pagination .current { background: #337ab7; border-color: #337ab7; color: #fff; font-weight: 600; }
    .pagination .disabled { color: #999; pointer-events: none; }

    /* footer */
    .or-footer { margin-top: 48px; border-top: 1px solid #ddd; background: #f5f5f5; padding: 22px 20px; text-align: center; font-size: 12.5px; color: #666; }
    .or-footer a { color: #337ab7; margin: 0 8px; }
    .or-footer .tagline { margin-bottom: 6px; color: #555; }

    .empty-state { text-align: center; color: #999; padding: 48px 16px; font-size: 14px; }

    /* OpenReview homepage building blocks */
    .news-card { border: 1px solid #ddd; border-radius: 2px; padding: 22px 28px; margin: 28px 0 40px; position: relative; }
    .news-card h2 { font-size: 26px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid #ddd; margin-bottom: 14px; }
    .news-card .news-close { position: absolute; top: 10px; right: 14px; border: none; background: none; font-size: 16px; color: #888; cursor: pointer; }
    .news-item { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 6px 0; }
    .news-item a { font-size: 16.5px; font-weight: 700; color: #34536b; }
    .news-item .news-date { font-size: 14px; color: #555; white-space: nowrap; }
    .news-card .news-more { display: inline-block; margin-top: 10px; font-size: 14px; }

    .home-cols { display: flex; gap: 56px; flex-wrap: wrap; }
    .home-col { flex: 1 1 380px; min-width: 300px; }
    .col-heading { font-size: 26px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid #ddd; margin-bottom: 16px; }
    .big-item { margin-bottom: 18px; }
    .big-item > a { font-size: 20px; color: #4d6d87; line-height: 1.3; }
    .big-item .sub-line { font-size: 13.5px; color: #555; margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .big-item .sub-line .clock { font-size: 13px; color: #666; }
</style>
