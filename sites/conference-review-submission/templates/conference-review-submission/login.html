<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In -- OpenReview</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #1e293b; }
        .header { border-bottom: 2px solid #7c3aed; padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .header h1 { font-size: 1.3rem; color: #7c3aed; }
        .header h1 a { color: inherit; text-decoration: none; }
        .login-form { max-width: 400px; margin: 4rem auto; padding: 2rem; border: 1px solid #e2e8f0; border-radius: .5rem; background: #fff; }
        .login-form h2 { margin: 0 0 1.5rem; font-size: 1.3rem; color: #1e293b; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: #475569; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .6rem .8rem; border: 1px solid #cbd5e1; border-radius: .3rem; font-size: .95rem; }
        .form-group input:focus { border-color: #7c3aed; outline: none; }
        .btn-login { width: 100%; padding: .7rem; background: #7c3aed; color: #fff; border: none; border-radius: .3rem; cursor: pointer; font-size: 1rem; }
        .btn-login:hover { background: #6d28d9; }
        .error { color: #dc2626; font-size: .85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('conference-review-submission.index') }}">OpenReview ICLR 2017</a></h1>
        <a href="/" style="font-size:.9rem;color:#475569;text-decoration:none">&larr; MiniWeb</a>
    </div>

    <form class="login-form" method="post" action="{{ url_for('conference-review-submission.login_submit') }}">
        <h2>Sign In</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
</body>
</html>
