<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PeerPortal</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; background: #f7f7f7; color: #333; line-height: 1.5; font-size: 14px; }

        .topbar { background: #333; height: 40px; display: flex; align-items: center; padding: 0 24px; }
        .topbar a { color: rgba(255,255,255,.7); font-size: 13px; text-decoration: none; margin-right: 20px; }
        .topbar a:hover { color: #fff; }
        .topbar .right { margin-left: auto; }

        .login-container {
            max-width: 380px; margin: 60px auto; padding: 32px;
            background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
        }
        .login-logo { text-align: center; margin-bottom: 24px; }
        .login-logo h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 24px; font-weight: 700; color: #1a1a1a; }
        .login-logo p { font-size: 13px; color: #888; margin-top: 4px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 9px 12px; border: 1px solid #d0d0d0; border-radius: 4px;
            font-size: 14px; font-family: inherit;
        }
        .form-group input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 0 2px rgba(26,115,232,.15); }
        .btn-login {
            width: 100%; padding: 10px; background: #1a73e8; color: #fff; border: none;
            border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer;
            margin-top: 4px;
        }
        .btn-login:hover { background: #1557b0; }
        .error-msg { background: #fce8e6; color: #c5221f; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #1a73e8; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="{{ url_for('conference-review-submission.index') }}" style="font-weight:600;color:#fff">PeerPortal</a>
        <div class="right">
            <a href="/">MiniWeb</a>
        </div>
    </div>

    <form class="login-container" method="post" action="{{ url_for('conference-review-submission.login_submit') }}">
        <div class="login-logo">
            <h1>PeerPortal</h1>
            <p>Sign in to access your review tasks and submissions</p>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <div class="form-group">
            <label for="username">Email or Username</label>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <a href="{{ url_for('conference-review-submission.index') }}" class="back-link">Back to venues</a>
    </form>
</body>
</html>
