<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Lakeport Medical Center</title>
    <link rel="stylesheet" href="/static/health.css">
</head>
<body>
    {% include "health-portals/_masthead_plain.html" %}

    <div class="reg-box" style="max-width:500px;">
        <div class="portlet-head">Create Patient Portal Account</div>
        <div class="portlet-body" style="padding:16px 18px;">
            <p class="subtitle" style="margin-bottom:14px;">Register for the Lakeport Medical Center Patient Portal.</p>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="POST" action="{{ url_for('health-portals.register_submit') }}">
                <div class="form-row">
                    <div class="form-group"><label for="first_name">First Name</label><input type="text" id="first_name" name="first_name" required></div>
                    <div class="form-group"><label for="last_name">Last Name</label><input type="text" id="last_name" name="last_name" required></div>
                </div>
                <div class="form-group"><label for="username">Username</label><input type="text" id="username" name="username" required></div>
                <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
                <div class="form-row">
                    <div class="form-group"><label for="date_of_birth">Date of Birth</label><input type="date" id="date_of_birth" name="date_of_birth" required></div>
                    <div class="form-group"><label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label for="phone">Phone</label><input type="tel" id="phone" name="phone"></div>
                <button type="submit" class="btn-primary block">Create Account</button>
            </form>
            <a href="{{ url_for('health-portals.login_page') }}" class="login-link" style="display:block;text-align:center;margin-top:12px;">Already have an account? Sign in</a>
        </div>
    </div>

    {% include "health-portals/_footer.html" %}
</body>
</html>
