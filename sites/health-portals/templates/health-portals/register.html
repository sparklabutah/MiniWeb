<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Lakeport Medical Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .reg-box { background: #fff; border-radius: .6rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 2rem; width: 100%; max-width: 500px; }
        .reg-box h1 { text-align: center; color: #0d6e6e; margin-bottom: .3rem; font-size: 1.4rem; }
        .reg-box p { text-align: center; color: #64748b; margin-bottom: 1.5rem; font-size: .85rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .3rem; }
        .form-group input, .form-group select { width: 100%; padding: .6rem; border: 1px solid #e2e8f0; border-radius: .3rem; font-size: .85rem; }
        .btn { width: 100%; padding: .7rem; background: #0d6e6e; color: #fff; border: none; border-radius: .3rem; font-size: .95rem; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #0a5c5c; }
        .error { color: #dc2626; text-align: center; margin-bottom: 1rem; font-size: .85rem; }
        .login-link { display: block; text-align: center; margin-top: 1rem; color: #0d6e6e; text-decoration: none; font-size: .85rem; }
    </style>
</head>
<body>
    <div class="reg-box">
        <h1>Create Account</h1>
        <p>Register for the Lakeport Medical Center Patient Portal</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="{{ url_for('health-portals.register_submit') }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="date_of_birth">Date of Birth</label>
                    <input type="date" id="date_of_birth" name="date_of_birth" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <a href="{{ url_for('health-portals.login_page') }}" class="login-link">Already have an account? Sign in</a>
    </div>
</body>
</html>
