<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity - Lakeport Medical Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .verify-box { background: #fff; border-radius: .6rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 2rem; width: 100%; max-width: 400px; text-align: center; }
        .verify-box h1 { color: #0d6e6e; margin-bottom: .5rem; font-size: 1.3rem; }
        .verify-box p { color: #64748b; margin-bottom: 1.5rem; font-size: .85rem; }
        .code-display { background: #f0f4f8; padding: 1rem; border-radius: .4rem; font-size: 1.8rem; font-weight: 700; letter-spacing: .3rem; color: #0d6e6e; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .7rem; border: 1px solid #e2e8f0; border-radius: .3rem; font-size: 1.2rem; text-align: center; letter-spacing: .3rem; }
        .btn { width: 100%; padding: .7rem; background: #0d6e6e; color: #fff; border: none; border-radius: .3rem; font-size: .95rem; font-weight: 600; cursor: pointer; }
        .error { color: #dc2626; margin-bottom: 1rem; font-size: .85rem; }
    </style>
</head>
<body>
    <div class="verify-box">
        <h1>Verify Your Identity</h1>
        <p>Enter the 6-digit verification code below to complete registration.</p>
        <div class="code-display">{{ code_hint }}</div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="{{ url_for('health-portals.verify_submit') }}">
            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" id="code" name="code" maxlength="6" required placeholder="000000">
            </div>
            <button type="submit" class="btn">Verify</button>
        </form>
    </div>
</body>
</html>
