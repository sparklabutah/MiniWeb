<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity - Lakeport Medical Center</title>
    <link rel="stylesheet" href="/static/health.css">
</head>
<body>
    {% include "health-portals/_masthead_plain.html" %}

    <div class="verify-box" style="max-width:400px;text-align:center;">
        <div class="portlet-head" style="justify-content:center;">Verify Your Identity</div>
        <div class="portlet-body" style="padding:16px 18px;">
            <p class="subtitle" style="margin-bottom:12px;">Enter the 6-digit verification code below to complete registration.</p>
            <div class="code-display">{{ code_hint }}</div>
            {% if error %}<div class="error" style="margin-top:10px;">{{ error }}</div>{% endif %}
            <form method="POST" action="{{ url_for('health-portals.verify_submit') }}" style="margin-top:12px;">
                <div class="form-group" style="text-align:left;">
                    <label for="code">Verification Code</label>
                    <input type="text" id="code" name="code" maxlength="6" required placeholder="000000" style="text-align:center;letter-spacing:6px;font-size:16px;">
                </div>
                <button type="submit" class="btn-primary block">Verify</button>
            </form>
        </div>
    </div>

    {% include "health-portals/_footer.html" %}
</body>
</html>
