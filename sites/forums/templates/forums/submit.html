<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - ForumHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #dae0e6; color: #1c1c1c; }
        a { color: #0079d3; text-decoration: none; }
        .header { background: #fff; border-bottom: 1px solid #edeff1; padding: 8px 20px; display: flex; align-items: center; gap: 16px; }
        .header .logo { font-weight: 700; font-size: 20px; color: #ff4500; }
        .container { max-width: 640px; margin: 24px auto; padding: 0 16px; }
        h1 { font-size: 18px; margin-bottom: 16px; }
        .form-card { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #1c1c1c; margin-bottom: 4px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #edeff1; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .form-group textarea { height: 160px; resize: vertical; }
        .error { color: #ff0000; font-size: 13px; margin-bottom: 12px; padding: 8px; background: #fff0f0; border-radius: 4px; }
        .btn-submit { padding: 8px 24px; background: #0079d3; color: #fff; border: none; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .btn-submit:hover { background: #006cbd; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('forums.index') }}" class="logo">ForumHub</a>
    </div>
    <div class="container">
        <h1>Create a post</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-card">
            <form method="POST" action="{{ url_for('forums.submit_post_form') }}">
                <div class="form-group">
                    <label for="subreddit">Community</label>
                    <select name="subreddit" id="subreddit" required>
                        <option value="">Choose a community</option>
                        {% for sub in subreddits %}
                        <option value="{{ sub }}">{{ sub }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title" placeholder="Title" required maxlength="300">
                </div>
                <div class="form-group">
                    <label for="body">Body (optional)</label>
                    <textarea name="body" id="body" placeholder="Text (optional)"></textarea>
                </div>
                <div class="form-group">
                    <label for="flair">Flair (optional)</label>
                    <input type="text" name="flair" id="flair" placeholder="e.g. Discussion, Question, OC">
                </div>
                <button type="submit" class="btn-submit">Post</button>
            </form>
        </div>
    </div>
</body>
</html>
