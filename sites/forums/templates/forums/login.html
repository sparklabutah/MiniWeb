<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — ForumHub</title>
    <link rel="stylesheet" href="/static/reddit.css">
</head>
<body>
    {% include "forums/_topbar.html" %}
    <div class="rd-auth-wrap">
        <div class="rd-panel rd-auth">
            <h1>Log In</h1>
            <p style="font-size:.85rem;color:var(--muted);margin:-8px 0 16px;">Welcome back to ForumHub</p>
            {% if error %}
            <div class="rd-err">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('forums.login_submit') }}">
                <div class="rd-field">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" placeholder="Username" required>
                </div>
                <div class="rd-field">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Password">
                </div>
                <button type="submit" class="rd-btn" style="width:100%;text-align:center;">Log In</button>
            </form>
            <div style="text-align:center;margin-top:16px;font-size:.85rem;color:var(--muted);">
                New to ForumHub? <a href="{{ url_for('forums.register_page') }}" style="color:var(--blue);font-weight:600;">Sign Up</a>
            </div>
        </div>
    </div>
</body>
</html>
