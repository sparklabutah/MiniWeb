<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - ForumHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #dae0e6; color: #1c1c1c; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #fff; border-radius: 8px; padding: 32px; width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .login-card h1 { font-size: 20px; margin-bottom: 4px; }
        .login-card p { font-size: 13px; color: #787c7e; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #edeff1; border-radius: 20px; font-size: 14px; }
        .error { color: #ff0000; font-size: 13px; margin-bottom: 12px; }
        .btn { width: 100%; padding: 10px; background: #ff4500; color: #fff; border: none; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .btn:hover { background: #e03d00; }
        .alt-link { text-align: center; margin-top: 16px; font-size: 13px; }
        .alt-link a { color: #0079d3; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Log In</h1>
        <p>Welcome back to ForumHub</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('forums.login_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Password">
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>
        <div class="alt-link">
            New to ForumHub? <a href="{{ url_for('forums.register_page') }}">Sign Up</a>
        </div>
    </div>
</body>
</html>
