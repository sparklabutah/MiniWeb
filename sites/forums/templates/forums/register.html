<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ForumHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #dae0e6; color: #1c1c1c; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .register-card { background: #fff; border-radius: 8px; padding: 32px; width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .register-card h1 { font-size: 20px; margin-bottom: 4px; }
        .register-card p { font-size: 13px; color: #787c7e; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #edeff1; border-radius: 20px; font-size: 14px; }
        .error { color: #ff0000; font-size: 13px; margin-bottom: 12px; }
        .btn { width: 100%; padding: 10px; background: #ff4500; color: #fff; border: none; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .btn:hover { background: #e03d00; }
        .alt-link { text-align: center; margin-top: 16px; font-size: 13px; }
        .alt-link a { color: #0079d3; }
    </style>
</head>
<body>
    <div class="register-card">
        <h1>Sign Up</h1>
        <p>Join the ForumHub community</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('forums.register_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <div class="alt-link">
            Already have an account? <a href="{{ url_for('forums.login_page') }}">Log In</a>
        </div>
    </div>
</body>
</html>
