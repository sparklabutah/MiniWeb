<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — ForumHub</title>
    <link rel="stylesheet" href="/static/reddit.css">
</head>
<body>
    {% include "forums/_topbar.html" %}
    <div class="rd-auth-wrap">
        <div class="rd-panel rd-auth">
            <h1>Sign Up</h1>
            <p style="font-size:.85rem;color:var(--muted);margin:-8px 0 16px;">Join the ForumHub community</p>
            {% if error %}
            <div class="rd-err">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('forums.register_submit') }}">
                <div class="rd-field">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" placeholder="Choose a username" required>
                </div>
                <div class="rd-field">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="rd-btn" style="width:100%;text-align:center;">Sign Up</button>
            </form>
            <div style="text-align:center;margin-top:16px;font-size:.85rem;color:var(--muted);">
                Already have an account? <a href="{{ url_for('forums.login_page') }}" style="color:var(--blue);font-weight:600;">Log In</a>
            </div>
        </div>
    </div>
</body>
</html>
