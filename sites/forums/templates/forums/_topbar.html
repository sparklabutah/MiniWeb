<div class="rd-top">
    <a class="rd-logo" href="{{ url_for('forums.index') }}">
        <span class="snoo"><svg width="18" height="18" viewBox="0 0 20 20" fill="#fff"><circle cx="10" cy="11" r="7"/><circle cx="10" cy="2.5" r="1.6"/><line x1="10" y1="4" x2="10" y2="6" stroke="#fff" stroke-width="1.4"/><circle cx="7" cy="10.5" r="1.3" fill="#ff4500"/><circle cx="13" cy="10.5" r="1.3" fill="#ff4500"/></svg></span>
        <span class="word">forumhub</span>
    </a>
    <form class="rd-search" method="get" action="{{ url_for('forums.search_page') }}">
        <span class="mag"><svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="2"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <input name="q" placeholder="Search ForumHub" value="{{ request.args.get('q','') }}" autocomplete="off">
    </form>
    <div class="rd-top-right">
        <a class="rd-create" href="{{ url_for('forums.submit_page') }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
            Create
        </a>
        {% if current_user %}
            <a class="lnk" href="{{ url_for('forums.messages_page') }}">Messages</a>
            <a class="lnk" href="{{ url_for('forums.logout') }}">Log Out</a>
            <a href="{{ url_for('forums.user_profile', username=current_user.username) }}" class="rd-uav" title="u/{{ current_user.username }}" style="background:{{ avatar_color(current_user.username) }};">{{ current_user.username[0]|upper }}</a>
        {% else %}
            <a class="rd-btn blue" href="{{ url_for('forums.login_page') }}" style="padding:7px 16px;">Log In</a>
        {% endif %}
    </div>
</div>
