{% extends "agency-portals/base.html" %}
{% block title %}Sign In - City of Cedar Grove{% endblock %}
{% block content %}
<div class="main-content" style="max-width:500px;">
    <h2 class="section-title">Sign In to Your Account</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <div class="detail-body">
        <form method="post" action="{{ url_for('agency-portals.login_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <p style="margin-top:1rem;font-size:.9rem;">
            Don't have an account? <a href="{{ url_for('agency-portals.register_page') }}">Create one here</a>.
        </p>
    </div>
</div>
{% endblock %}
