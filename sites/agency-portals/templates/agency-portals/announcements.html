{% extends "agency-portals/base.html" %}
{% block title %}Announcements - City of Cedar Grove{% endblock %}
{% block content %}
<div class="main-content">
    <h2 class="section-title">Public Announcements</h2>
    {% for ann in announcements %}
    <div class="card" style="margin-bottom:1rem;">
        <h3>{{ ann.title }}</h3>
        <p class="detail-meta">
            <span><strong>Date:</strong> {{ ann.date }}</span>
            <span><strong>Category:</strong> {{ ann.category }}</span>
        </p>
        <p style="margin-top:.5rem;">{{ ann.content }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
