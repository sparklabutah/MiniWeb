<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Meridian State University</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; }
        .header { background: linear-gradient(135deg, #4b2e83, #33006f); padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.2rem; }
        .header h1 a span { color: #b7a57a; }
        nav { max-width: 1100px; margin: 0 auto; padding: .6rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
        nav a { color: #4b2e83; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .3rem .5rem; border-radius: .3rem; }
        nav a:hover { background: #f0ecf5; }
        nav a.active { font-weight: 700; background: #ede9f5; }
        .login-container { max-width: 420px; margin: 4rem auto; padding: 2.5rem; background: #fff; border-radius: .6rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .login-container h2 { color: #4b2e83; margin-bottom: .5rem; font-size: 1.5rem; }
        .login-container .subtitle { color: #64748b; font-size: .9rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; color: #334155; font-weight: 600; margin-bottom: .4rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1.5px solid #d1d5db; border-radius: .4rem; font-size: .95rem; }
        .form-group input:focus { border-color: #4b2e83; outline: none; box-shadow: 0 0 0 3px rgba(75,46,131,.15); }
        .btn-login { width: 100%; padding: .8rem; background: #4b2e83; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #33006f; }
        .error { background: #fef2f2; color: #dc2626; padding: .7rem 1rem; border-radius: .3rem; font-size: .85rem; margin-bottom: 1rem; border: 1px solid #fee2e2; }
        .secure-badge { text-align: center; margin-top: 1.5rem; font-size: .8rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('university-academic.index') }}">MSU Computer Science</a></h1>
    </div>

    <nav>
        <a href="{{ url_for('university-academic.index') }}">Home</a>
        <a href="{{ url_for('university-academic.courses_page') }}">Courses</a>
        <a href="{{ url_for('university-academic.faculty_page') }}">Faculty</a>
        <a href="{{ url_for('university-academic.departments_page') }}">Research</a>
        <a href="{{ url_for('university-academic.events_page') }}">Events</a>
        <a href="{{ url_for('university-academic.alumni_page') }}">Alumni</a>
        <a href="{{ url_for('university-academic.login_page') }}" class="active">Sign In</a>
    </nav>

    <form class="login-container" method="post" action="{{ url_for('university-academic.login_submit') }}">
        <h2>Student / Faculty Portal</h2>
        <p class="subtitle">Sign in with your MSU NetID</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">MSU NetID</label>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="Enter your NetID">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <div class="secure-badge">Secured by MSU Identity Provider</div>
    </form>
</body>
</html>
