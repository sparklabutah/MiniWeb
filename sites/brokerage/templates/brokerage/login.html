{% extends "brokerage/base.html" %}
{% block title %}Login — TradeCore{% endblock %}
{% block content %}
<div style="max-width:400px;margin:3rem auto;">
    <div class="card">
        <h2>Sign In to TradeCore</h2>
        {% if error %}
        <div class="msg msg-error" style="display:block;">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('brokerage.login_submit') }}" style="display:flex;flex-direction:column;gap:0.8rem;margin-top:1rem;">
            <label style="font-size:0.85rem;color:#8b949e;">Username
                <input type="text" name="username" required style="width:100%;margin-top:0.3rem;">
            </label>
            <label style="font-size:0.85rem;color:#8b949e;">Password
                <input type="password" name="password" required style="width:100%;margin-top:0.3rem;">
            </label>
            <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
