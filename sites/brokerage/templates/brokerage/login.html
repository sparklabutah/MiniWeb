{% extends "brokerage/base.html" %}
{% block title %}Log In | TradeVista{% endblock %}
{% block content %}
<div style="max-width:400px;margin:60px auto;">
    <div style="text-align:center;margin-bottom:32px;">
        <svg viewBox="0 0 32 32" fill="none" width="48" height="48" style="margin-bottom:16px;">
            <circle cx="16" cy="16" r="16" fill="#00C805"/>
            <path d="M10 22V12l6-4 6 4v10l-6 4-6-4z" fill="#1E2124" opacity="0.9"/>
            <path d="M16 8l6 4v10l-6 4" fill="none" stroke="#1E2124" stroke-width="1.5"/>
        </svg>
        <div style="font-size:28px;font-weight:700;">Log in to TradeVista</div>
    </div>

    {% if error %}
    <div class="msg msg-error" style="display:block;">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('brokerage.login_submit') }}" style="display:flex;flex-direction:column;gap:16px;">
        <div>
            <label style="font-size:13px;color:#6F7782;display:block;margin-bottom:6px;">Email or Username</label>
            <input type="text" name="username" required style="width:100%;padding:12px 16px;border-radius:8px;">
        </div>
        <div>
            <label style="font-size:13px;color:#6F7782;display:block;margin-bottom:6px;">Password</label>
            <input type="password" name="password" required style="width:100%;padding:12px 16px;border-radius:8px;">
        </div>
        <button type="submit" class="rh-btn rh-btn-primary" style="width:100%;margin-top:8px;padding:14px;font-size:16px;">Log In</button>
    </form>
</div>
{% endblock %}
