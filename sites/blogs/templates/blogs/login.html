<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TumblrVibe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a2e; color: #e0e0e0; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: #16213e; padding: 2.5rem; border-radius: .6rem; width: 360px; text-align: center; }
        .login-box h1 { font-size: 1.6rem; color: #7c83ff; margin-bottom: .3rem; font-weight: 800; }
        .login-box p { font-size: .85rem; color: #888; margin-bottom: 1.5rem; }
        .login-box input { width: 100%; padding: .7rem 1rem; margin-bottom: .8rem; border: 1px solid #0f3460; border-radius: .4rem; background: #1a1a2e; color: #e0e0e0; font-size: .95rem; }
        .login-box input:focus { border-color: #7c83ff; outline: none; }
        .login-box button { width: 100%; padding: .7rem; background: #7c83ff; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .login-box button:hover { background: #6b72e8; }
        .error { color: #e94560; font-size: .85rem; margin-bottom: .8rem; }
        .login-box .back { display: inline-block; margin-top: 1rem; font-size: .9rem; color: #7c83ff; font-weight: 600; padding: .4rem 1rem; border: 1px solid #7c83ff; border-radius: .4rem; }
        .login-box .back:hover { background: #7c83ff; color: #fff; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>TumblrVibe</h1>
        <p>Sign in to your blog</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('blogs.login_submit') }}">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <a href="{{ url_for('blogs.index') }}" class="back">Back to feed</a>
    </div>
</body>
</html>
