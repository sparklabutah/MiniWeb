<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tool.name }} -- CalcTools</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .header { background: #1a73e8; color: #fff; padding: .9rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.4rem; }
        .header h1 a { color: #fff; text-decoration: none; }
        .header-nav a { color: rgba(255,255,255,.85); text-decoration: none; margin-left: 1.2rem; font-size: .9rem; }
        .header-nav a:hover { color: #fff; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem 1.5rem; }
        .tool-title { font-size: 1.5rem; color: #1a73e8; margin-bottom: .5rem; }
        .tool-desc { color: #666; margin-bottom: 1.5rem; }
        .converter-box { background: #fff; border: 1px solid #e0e0e0; border-radius: .5rem; padding: 1.5rem; }
        .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: flex-end; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-size: .85rem; color: #555; margin-bottom: .3rem; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: .3rem; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { border-color: #1a73e8; outline: none; }
        .btn-convert { width: 100%; padding: .75rem; background: #1a73e8; color: #fff; border: none; border-radius: .3rem; font-size: 1rem; cursor: pointer; margin-top: .5rem; }
        .btn-convert:hover { background: #1557b0; }
        .result-box { margin-top: 1.5rem; padding: 1.2rem; background: #e8f0fe; border-radius: .4rem; text-align: center; display: none; }
        .result-box .result-value { font-size: 1.8rem; color: #1a73e8; font-weight: 700; }
        .result-box .result-label { font-size: .9rem; color: #555; margin-top: .3rem; }
        .save-form { margin-top: 1rem; text-align: center; }
        .btn-save { padding: .5rem 1.5rem; background: #34a853; color: #fff; border: none; border-radius: .3rem; cursor: pointer; font-size: .9rem; }
        .btn-save:hover { background: #2d8f47; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #1a73e8; text-decoration: none; font-size: .9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('converters-calculators.index') }}">CalcTools</a></h1>
        <div class="header-nav">
            <a href="{{ url_for('converters-calculators.index') }}">Home</a>
            {% if user %}
            <a href="{{ url_for('converters-calculators.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('converters-calculators.logout') }}">Logout</a>
            {% else %}
            <a href="{{ url_for('converters-calculators.login_page') }}">Sign In</a>
            {% endif %}
            <a href="/">MiniWeb</a>
        </div>
    </div>

    <div class="container">
        <a href="{{ url_for('converters-calculators.index') }}" class="back-link">&larr; All Tools</a>
        <h2 class="tool-title">{{ tool.name }}</h2>
        <p class="tool-desc">{{ tool.description }}</p>

        <div class="converter-box">
            <div class="form-row">
                <div class="form-group">
                    <label for="from-value">Value</label>
                    <input type="number" id="from-value" step="any" value="1" autocomplete="off">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="from-unit">From</label>
                    <select id="from-unit" name="from_unit">
                        {% for key, unit in units.items() %}
                        <option value="{{ key }}">{{ unit.name }} ({{ unit.symbol }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="to-unit">To</label>
                    <select id="to-unit" name="to_unit">
                        {% for key, unit in units.items() %}
                        <option value="{{ key }}" {% if loop.index == 2 %}selected{% endif %}>{{ unit.name }} ({{ unit.symbol }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <button class="btn-convert" onclick="doConvert()">Convert</button>
        </div>

        <div class="result-box" id="result-box">
            <div class="result-value" id="result-value"></div>
            <div class="result-label" id="result-label"></div>
            {% if user %}
            <form class="save-form" method="post" action="{{ url_for('converters-calculators.form_save_conversion') }}">
                <input type="hidden" name="tool" value="{{ category }}">
                <input type="hidden" name="from_value" id="save-from-value">
                <input type="hidden" name="from_unit" id="save-from-unit">
                <input type="hidden" name="to_unit" id="save-to-unit">
                <input type="hidden" name="result" id="save-result">
                <input type="hidden" name="redirect_to" value="{{ request.url }}">
                <button type="submit" class="btn-save">Save to Dashboard</button>
            </form>
            {% endif %}
        </div>
    </div>

    <script>
    function doConvert() {
        var value = document.getElementById('from-value').value;
        var fromUnit = document.getElementById('from-unit').value;
        var toUnit = document.getElementById('to-unit').value;
        var category = '{{ category }}';
        var apiUrl;
        if (category === 'currency') {
            apiUrl = '{{ url_for("converters-calculators.api_convert_currency") }}?value=' + value + '&from=' + fromUnit + '&to=' + toUnit;
        } else {
            apiUrl = '{{ url_for("converters-calculators.index") }}api/convert/' + category + '?value=' + value + '&from=' + fromUnit + '&to=' + toUnit;
        }
        fetch(apiUrl)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    document.getElementById('result-value').textContent = 'Error';
                    document.getElementById('result-label').textContent = data.error;
                } else {
                    document.getElementById('result-value').textContent = data.result;
                    var fromSel = document.getElementById('from-unit');
                    var toSel = document.getElementById('to-unit');
                    var fromName = fromSel.options[fromSel.selectedIndex].text;
                    var toName = toSel.options[toSel.selectedIndex].text;
                    document.getElementById('result-label').textContent = value + ' ' + fromName + ' = ' + data.result + ' ' + toName;
                    // Update save form
                    var sfv = document.getElementById('save-from-value');
                    if (sfv) {
                        sfv.value = value;
                        document.getElementById('save-from-unit').value = fromUnit;
                        document.getElementById('save-to-unit').value = toUnit;
                        document.getElementById('save-result').value = data.result;
                    }
                }
                document.getElementById('result-box').style.display = 'block';
            });
    }
    </script>
</body>
</html>
