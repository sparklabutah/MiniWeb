<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MeridianCloud</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; }
        .header { background: #fff; border-bottom: 1px solid #dadce0; padding: 0.6rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.3rem; font-weight: 500; color: #1a73e8; text-decoration: none; }
        nav { max-width: 1000px; margin: 0 auto; padding: .6rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
        nav a { color: #5f6368; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .3rem .5rem; border-radius: .3rem; }
        nav a:hover { background: #f1f3f4; }
        nav a.active { font-weight: 700; background: #e8f0fe; color: #1a73e8; }
        .login-container { max-width: 420px; margin: 4rem auto; padding: 2.5rem; background: #fff; border-radius: .6rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .login-container h2 { color: #202124; margin-bottom: .5rem; font-size: 1.5rem; }
        .login-container .subtitle { color: #5f6368; font-size: .9rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; color: #202124; font-weight: 600; margin-bottom: .4rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1.5px solid #dadce0; border-radius: .4rem; font-size: .95rem; }
        .form-group input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 0 3px rgba(26,115,232,.15); }
        .btn-login { width: 100%; padding: .8rem; background: #1a73e8; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #1557b0; }
        .error { background: #fce8e6; color: #d93025; padding: .7rem 1rem; border-radius: .3rem; font-size: .85rem; margin-bottom: 1rem; border: 1px solid #f5c6cb; }
        .secure-badge { text-align: center; margin-top: 1.5rem; font-size: .8rem; color: #80868b; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('cloud-storage-file-transfer.index') }}" class="logo">&#9729; MeridianCloud</a>
    </div>

    <nav>
        <a href="{{ url_for('cloud-storage-file-transfer.index') }}">My Files</a>
        <a href="{{ url_for('cloud-storage-file-transfer.shared') }}">Shared</a>
        <a href="{{ url_for('cloud-storage-file-transfer.recent') }}">Recent</a>
        <a href="{{ url_for('cloud-storage-file-transfer.starred') }}">Starred</a>
        <a href="{{ url_for('cloud-storage-file-transfer.trash') }}">Trash</a>
        <a href="{{ url_for('cloud-storage-file-transfer.login_page') }}" class="active">Sign In</a>
    </nav>

    <form class="login-container" method="post" action="{{ url_for('cloud-storage-file-transfer.login_submit') }}">
        <h2>Sign In</h2>
        <p class="subtitle">Access your MeridianCloud files</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="e.g. alex.chen">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <div class="secure-badge">&#128274; End-to-end encrypted connection</div>
    </form>
</body>
</html>
