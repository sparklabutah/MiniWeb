<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Listing — KSL Classifieds</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f5f7; color: #333; }
        .header { background: #1b5e20; color: #fff; padding: .7rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.4rem; }
        .header-nav a { color: #c8e6c9; text-decoration: none; margin-left: 1rem; font-size: .9rem; }
        .form-card { max-width: 600px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: .5rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .form-card h2 { font-size: 1.3rem; color: #1b5e20; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: #555; margin-bottom: .3rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: .3rem; font-size: .95rem; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #2e7d32; outline: none; }
        .btn-submit { width: 100%; padding: .7rem; background: #1b5e20; color: #fff; border: none; border-radius: .3rem; cursor: pointer; font-size: 1rem; }
        .btn-submit:hover { background: #2e7d32; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('classifieds.index') }}">KSL Classifieds</a></h1>
        <div class="header-nav">
            <a href="{{ url_for('classifieds.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('classifieds.logout') }}">Logout</a>
            <a href="/">MiniWeb</a>
        </div>
    </div>

    <form class="form-card" method="post" action="{{ url_for('classifieds.post_listing_submit') }}">
        <h2>Post a New Listing</h2>
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" name="title" id="title" required placeholder="e.g. 2020 Toyota Camry SE">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea name="description" id="description" required placeholder="Describe your item in detail..."></textarea>
        </div>
        <div class="form-group">
            <label for="price">Price ($)</label>
            <input type="number" name="price" id="price" required min="0" placeholder="0">
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category" required>
                <option value="">Select category...</option>
                {% for c in categories %}
                <option value="{{ c }}">{{ c | capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="subcategory">Subcategory</label>
            <input type="text" name="subcategory" id="subcategory" placeholder="e.g. cars, computers, rentals">
        </div>
        <div class="form-group">
            <label for="condition">Condition</label>
            <select name="condition" id="condition" required>
                {% for co in conditions %}
                <option value="{{ co }}">{{ co | replace('_', ' ') | capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" name="location" id="location" required placeholder="e.g. Salt Lake City">
        </div>
        <button type="submit" class="btn-submit">Post Listing</button>
    </form>
</body>
</html>
