<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCard - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo h1 { font-size: 1.6rem; color: #1a365d; font-weight: 800; letter-spacing: -0.5px; }
        .logo .card-icon { display: inline-block; width: 48px; height: 30px; background: linear-gradient(135deg, #2b6cb0, #4299e1); border-radius: 4px; margin-bottom: .5rem; position: relative; }
        .logo .card-icon::after { content: ''; position: absolute; bottom: 6px; left: 6px; width: 16px; height: 12px; border: 2px solid rgba(255,255,255,0.6); border-radius: 2px; }
        .subtitle { color: #718096; font-size: .9rem; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #4a5568; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: .95rem; transition: border-color .2s; }
        .form-group input:focus { border-color: #4299e1; outline: none; box-shadow: 0 0 0 3px rgba(66,153,225,0.15); }
        .btn-login { width: 100%; padding: .8rem; background: linear-gradient(135deg, #2b6cb0, #3182ce); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: .5rem; transition: opacity .2s; }
        .btn-login:hover { opacity: .9; }
        .error { background: #fed7d7; color: #c53030; padding: .6rem .8rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem; }
        .secure-note { text-align: center; margin-top: 1.2rem; font-size: .78rem; color: #a0aec0; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="card-icon"></div>
            <h1>SecureCard</h1>
        </div>
        <p class="subtitle">Sign in to manage your credit card</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('credit-card.login_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <p class="secure-note">Your connection is secured with 256-bit encryption</p>
    </div>
</body>
</html>
