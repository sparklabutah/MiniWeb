<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Meridian Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1d21; color: #d1d2d3; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #222529; border-radius: 8px; padding: 2.5rem; width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
        .login-card h1 { color: #fff; font-size: 1.5rem; margin-bottom: .5rem; text-align: center; }
        .login-card .subtitle { color: #ababad; font-size: .9rem; margin-bottom: 2rem; text-align: center; }
        .error { background: rgba(220,38,38,.15); color: #f87171; padding: .6rem .8rem; border-radius: .4rem; font-size: .83rem; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .82rem; color: #ababad; font-weight: 600; margin-bottom: .4rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; background: #2a2d31; border: 1px solid #3f3f42; border-radius: 6px; color: #d1d2d3; font-size: .95rem; outline: none; }
        .form-group input:focus { border-color: #1264a3; }
        .form-group input::placeholder { color: #8b8b8d; }
        .btn-login { width: 100%; padding: .8rem; background: #1264a3; color: #fff; border: none; border-radius: 6px; font-size: .95rem; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #0e5a94; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Meridian Chat</h1>
        <p class="subtitle">Sign in to your workspace</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('team-chat-workspace.login_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
