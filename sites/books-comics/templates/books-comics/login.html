<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In -- BookVerse</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #faf7f2; }
        .header { border-bottom: 2px solid #e8dfd3; padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .header h1 { font-size: 1.4rem; margin: 0; color: #8b4513; }
        .header h1 span { color: #d4a574; }
        .login-form { max-width: 400px; margin: 4rem auto; padding: 2rem; border: 1px solid #e8dfd3; border-radius: .5rem; background: #fff; }
        .login-form h2 { margin: 0 0 1.5rem; font-size: 1.3rem; color: #2d2d2d; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: #6b5b4f; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .6rem .8rem; border: 1px solid #d4c5b0; border-radius: .3rem; font-size: .95rem; box-sizing: border-box; }
        .form-group input:focus { border-color: #8b4513; outline: none; }
        .btn-login { width: 100%; padding: .7rem; background: #8b4513; color: #fff; border: none; border-radius: .3rem; cursor: pointer; font-size: 1rem; }
        .btn-login:hover { background: #a0522d; }
        .error { color: #c44536; font-size: .85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('books-comics.index') }}" style="color:inherit;text-decoration:none">Book<span>Verse</span></a></h1>
        <a href="/" style="font-size:.85rem;color:#6b5b4f;text-decoration:none">MiniWeb</a>
    </div>

    <form class="login-form" method="post" action="{{ url_for('books-comics.login_submit') }}">
        <h2>Sign In to BookVerse</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
</body>
</html>
