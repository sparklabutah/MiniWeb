<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KnowledgeHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f6f6; color: #232629; }
        a { color: #0074cc; text-decoration: none; }
        .header { background: #f48024; padding: 8px 16px; display: flex; align-items: center; gap: 16px; }
        .header .logo { color: #fff; font-weight: 700; font-size: 18px; }
        .container { max-width: 400px; margin: 60px auto; padding: 16px; }
        .card { background: #fff; border: 1px solid #d6d9dc; border-radius: 4px; padding: 24px; }
        h2 { text-align: center; margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #babfc4; border-radius: 3px; font-size: 14px; margin-bottom: 14px; }
        .btn { display: block; width: 100%; padding: 10px; background: #0a95ff; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #0074cc; }
        .error { color: #d1383d; margin-bottom: 12px; font-size: 14px; text-align: center; }
        .login-link { text-align: center; margin-top: 16px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('qa-knowledge.index') }}" class="logo">KnowledgeHub</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>Create your account</h2>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('qa-knowledge.register_submit') }}">
                <label for="display_name">Display Name</label>
                <input type="text" id="display_name" name="display_name" placeholder="Your display name" required>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password">
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <div class="login-link">
                Already have an account? <a href="{{ url_for('qa-knowledge.login_page') }}">Log in</a>
            </div>
        </div>
    </div>
</body>
</html>
