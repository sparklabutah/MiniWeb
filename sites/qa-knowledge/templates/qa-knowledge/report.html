<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report - KnowledgeHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f6f6; color: #232629; }
        a { color: #0074cc; text-decoration: none; }
        .header { background: #f48024; padding: 8px 16px; display: flex; align-items: center; gap: 16px; }
        .header .logo { color: #fff; font-weight: 700; font-size: 18px; }
        .container { max-width: 600px; margin: 40px auto; padding: 16px; }
        .card { background: #fff; border: 1px solid #d6d9dc; border-radius: 4px; padding: 24px; }
        h2 { margin-bottom: 12px; }
        .item-info { font-size: 14px; color: #3b4045; margin-bottom: 16px; padding: 8px; background: #f8f9f9; border-radius: 3px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        select, textarea { width: 100%; padding: 8px; border: 1px solid #babfc4; border-radius: 3px; font-family: inherit; font-size: 14px; margin-bottom: 14px; }
        textarea { min-height: 80px; }
        .btn { display: inline-block; padding: 10px 20px; background: #d1383d; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #c02227; }
        .error { color: #d1383d; margin-bottom: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('qa-knowledge.index') }}" class="logo">KnowledgeHub</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>Report {{ item_type }}</h2>
            <div class="item-info">
                <strong>{{ item_type|capitalize }}:</strong> {{ item_title }}
            </div>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('qa-knowledge.report_question_submit', qid=item_id) }}">
                <label for="reason">Reason</label>
                <select id="reason" name="reason" required>
                    <option value="">Select a reason...</option>
                    <option value="spam">Spam</option>
                    <option value="offensive">Rude or offensive</option>
                    <option value="not-an-answer">Not an answer</option>
                    <option value="duplicate">Duplicate</option>
                    <option value="off-topic">Off-topic</option>
                    <option value="other">Other</option>
                </select>
                <label for="details">Additional details (optional)</label>
                <textarea id="details" name="details" placeholder="Provide any additional context..."></textarea>
                <button type="submit" class="btn">Submit Report</button>
            </form>
        </div>
    </div>
</body>
</html>
