<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SkyLodge Travel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; color: #1a202c; }
        .header { background: linear-gradient(135deg, #1a365d, #2b6cb0); padding: .8rem 2rem; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.2rem; }
        .header h1 a span { color: #63b3ed; }
        nav { max-width: 1000px; margin: 0 auto; padding: .6rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
        nav a { color: #1a365d; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .3rem .5rem; border-radius: .3rem; }
        nav a:hover { background: #ebf4ff; }
        nav .right { margin-left: auto; }
        .login-container { max-width: 400px; margin: 3rem auto; padding: 0 2rem; }
        .login-card { background: #fff; border-radius: .5rem; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .login-card h2 { text-align: center; color: #1a365d; margin-bottom: 1.5rem; font-size: 1.4rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #4a5568; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1px solid #cbd5e0; border-radius: .3rem; font-size: .95rem; }
        .form-group input:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,.15); }
        .login-btn { width: 100%; background: #2b6cb0; color: #fff; border: none; padding: .75rem; border-radius: .3rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: .5rem; }
        .login-btn:hover { background: #1a365d; }
        .error { background: #fed7d7; color: #9b2c2c; padding: .7rem 1rem; border-radius: .3rem; margin-bottom: 1rem; font-size: .9rem; }
        .demo-accounts { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }
        .demo-accounts h4 { font-size: .82rem; color: #a0aec0; text-transform: uppercase; margin-bottom: .5rem; }
        .demo-accounts table { width: 100%; font-size: .82rem; border-collapse: collapse; }
        .demo-accounts td { padding: .3rem .4rem; color: #4a5568; border-bottom: 1px solid #f0f4f8; }
        .demo-accounts td:first-child { font-weight: 600; color: #2d3748; }
        .footer { text-align: center; padding: 2rem; color: #a0aec0; font-size: .8rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('flights-hotels.index') }}">Sky<span>Lodge</span> Travel</a></h1>
    </div>

    <nav>
        <a href="{{ url_for('flights-hotels.index') }}">Home</a>
        <a href="{{ url_for('flights-hotels.flights_page') }}">Flights</a>
        <a href="{{ url_for('flights-hotels.hotels_page') }}">Hotels</a>
        <a href="{{ url_for('flights-hotels.bookings_page') }}">My Bookings</a>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h2>Sign In</h2>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('flights-hotels.login_submit') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="demo-accounts">
                <h4>Demo Accounts</h4>
                <table>
                    <tr><td>alex_morgan</td><td>travel123</td></tr>
                    <tr><td>jamie_chen</td><td>travel234</td></tr>
                    <tr><td>taylor_brooks</td><td>travel345</td></tr>
                    <tr><td>sam_rivera</td><td>travel456</td></tr>
                    <tr><td>casey_ward</td><td>travel567</td></tr>
                </table>
            </div>
        </div>
    </div>

    <div class="footer">SkyLodge Travel -- Your journey starts here</div>
</body>
</html>
