<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register to Vote - Lakeport Civic Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #1a1a2e; }
        .header { background: linear-gradient(135deg, #1b4332, #2d6a4f); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { color: #fff; font-size: 1.4rem; }
        .header h1 span { color: #95d5b2; }
        .header-nav a { color: #b7e4c7; text-decoration: none; margin-left: 1.2rem; font-size: .9rem; }
        .header-nav .btn-login { background: #40916c; color: #fff; padding: .45rem 1rem; border-radius: .3rem; font-weight: 600; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        .page-title { font-size: 1.5rem; color: #1b4332; margin-bottom: 1.5rem; }
        .form-card { background: #fff; border-radius: .5rem; padding: 2rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #475569; margin-bottom: .3rem; }
        .form-group input, .form-group select { width: 100%; padding: .5rem; border: 1px solid #d1d5db; border-radius: .3rem; font-size: .9rem; }
        .btn-register { background: #40916c; color: #fff; border: none; padding: .7rem 2rem; border-radius: .4rem; cursor: pointer; font-size: 1rem; font-weight: 600; width: 100%; }
        .btn-register:hover { background: #2d6a4f; }
        .footer { text-align: center; padding: 2rem; color: #94a3b8; font-size: .8rem; border-top: 1px solid #e2e8f0; margin-top: 2rem; background: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('petitions-voting-info.index') }}" style="color:#fff;text-decoration:none;">Lakeport <span>Civic Hub</span></a></h1>
        <div class="header-nav">
            <a href="{{ url_for('petitions-voting-info.petitions_list') }}">Petitions</a>
            <a href="{{ url_for('petitions-voting-info.elections_list') }}">Elections</a>
            <a href="{{ url_for('petitions-voting-info.voter_info_page') }}">Voter Info</a>
            {% if logged_in %}
                <a href="{{ url_for('petitions-voting-info.logout') }}" class="btn-login">Logout ({{ user.display_name }})</a>
            {% else %}
                <a href="{{ url_for('petitions-voting-info.login_page') }}" class="btn-login">Sign In</a>
            {% endif %}
            <a href="/">MiniWeb</a>
        </div>
    </div>
    <div class="container">
        <h2 class="page-title">Voter Registration</h2>
        <div class="form-card">
            <form id="register-form">
                <div class="form-group">
                    <label for="full_name">Full Legal Name</label>
                    <input type="text" id="full_name" name="full_name" required>
                </div>
                <div class="form-group">
                    <label for="date_of_birth">Date of Birth</label>
                    <input type="date" id="date_of_birth" name="date_of_birth" required>
                </div>
                <div class="form-group">
                    <label for="address">Residential Address</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <div class="form-group">
                    <label for="precinct">Precinct</label>
                    <select id="precinct" name="precinct" required>
                        <option value="">Select precinct...</option>
                        {% for loc in voter_info.polling_locations %}
                            {% for p in loc.precincts_served %}
                            <option value="{{ p }}">{{ p }}</option>
                            {% endfor %}
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="party_affiliation">Party Affiliation</label>
                    <select id="party_affiliation" name="party_affiliation">
                        <option value="independent">Independent</option>
                        <option value="democrat">Democrat</option>
                        <option value="republican">Republican</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-register">Register to Vote</button>
                <div id="result" style="margin-top:1rem;font-size:.9rem;"></div>
            </form>
        </div>
    </div>
    <div class="footer">Lakeport Civic Hub</div>
    <script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var data = {};
        ['full_name','date_of_birth','address','precinct','party_affiliation','email','username','password'].forEach(function(f) {
            data[f] = document.getElementById(f).value;
        });
        fetch('{{ url_for("petitions-voting-info.api_register_voter") }}', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
        .then(function(res) {
            var el = document.getElementById('result');
            if (res.ok) {
                el.style.color = '#065f46';
                el.textContent = 'Registration successful! Welcome, ' + res.data.display_name;
            } else {
                el.style.color = '#b91c1c';
                el.textContent = res.data.error || 'Registration failed.';
            }
        });
    });
    </script>
</body>
</html>
