<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if mode == 'register' %}Register{% else %}Sign In{% endif %} - BidMarket</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .topbar { background: #1a1a2e; color: #fff; padding: .4rem 2rem; font-size: .8rem; }
        .topbar a { color: #ccc; text-decoration: none; margin-right: .8rem; }
        .auth-container { max-width: 420px; margin: 3rem auto; background: #fff; border-radius: .5rem; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .auth-container h1 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 1rem; text-align: center; }
        .auth-container h1 span { color: #e94560; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: #555; margin-bottom: .3rem; font-weight: 600; }
        .form-group input { width: 100%; padding: .7rem; border: 1px solid #ddd; border-radius: .3rem; font-size: .95rem; }
        .form-group input:focus { border-color: #e94560; outline: none; }
        .btn-submit { width: 100%; padding: .8rem; background: #e94560; color: #fff; border: none; border-radius: .3rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #c73e55; }
        .error { color: #dc3545; font-size: .85rem; margin-bottom: 1rem; text-align: center; background: #f8d7da; padding: .5rem; border-radius: .3rem; }
        .switch { text-align: center; margin-top: 1rem; font-size: .85rem; color: #888; }
        .switch a { color: #e94560; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="{{ url_for('auctions-p2p-marketplaces.index') }}">BidMarket Home</a>
        <a href="/">MiniWeb</a>
    </div>
    <div class="auth-container">
        <h1>Bid<span>Market</span></h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        {% if next %}
        <div class="switch" style="margin-top:0;margin-bottom:1rem;color:#555;">Sign in to complete your purchase.</div>
        {% endif %}

        {% if mode == 'register' %}
        <form method="POST" action="{{ url_for('auctions-p2p-marketplaces.register_submit') }}">
            <input type="hidden" name="next" value="{{ next or '' }}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required>
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
            <div class="switch">Already have an account? <a href="{{ url_for('auctions-p2p-marketplaces.login_page', next=next) }}">Sign In</a></div>
        </form>
        {% else %}
        <form method="POST" action="{{ url_for('auctions-p2p-marketplaces.login_submit') }}">
            <input type="hidden" name="next" value="{{ next or '' }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
            <div class="switch">New to BidMarket? <a href="{{ url_for('auctions-p2p-marketplaces.register_page', next=next) }}">Register</a></div>
        </form>
        {% endif %}
    </div>
</body>
</html>
