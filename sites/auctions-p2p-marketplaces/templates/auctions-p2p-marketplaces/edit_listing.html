<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing - BidMarket</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .topbar { background: #1a1a2e; color: #fff; padding: .4rem 2rem; font-size: .8rem; }
        .topbar a { color: #ccc; text-decoration: none; margin-right: .8rem; }
        .container { max-width: 700px; margin: 0 auto; padding: 1.5rem; }
        .form-card { background: #fff; border-radius: .5rem; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        h1 { color: #1a1a2e; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; color: #555; margin-bottom: .3rem; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: .6rem; border: 1px solid #ddd; border-radius: .3rem; font-size: .9rem; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .btn { padding: .8rem 2rem; border: none; border-radius: .3rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-save { background: #e94560; color: #fff; width: 100%; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="{{ url_for('auctions-p2p-marketplaces.index') }}">BidMarket Home</a>
        <a href="{{ url_for('auctions-p2p-marketplaces.dashboard') }}">Dashboard</a>
        <a href="/">MiniWeb</a>
    </div>
    <div class="container">
        <div class="form-card">
            <h1>Edit Listing: {{ product.name[:40] }}</h1>
            <form id="edit-form">
                <div class="form-group">
                    <label for="name">Item Name</label>
                    <input type="text" id="name" name="name" value="{{ product.name }}">
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description">{{ product.description }}</textarea>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        {% for c in categories %}
                        <option value="{{ c }}" {{ 'selected' if c == product.category }}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="condition">Condition</label>
                    <select id="condition" name="condition">
                        {% for cond in ['New', 'Like New', 'Very Good', 'Good', 'Acceptable'] %}
                        <option value="{{ cond }}" {{ 'selected' if cond == product.condition }}>{{ cond }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="shipping">Shipping</label>
                    <input type="text" id="shipping" name="shipping" value="{{ product.shipping }}">
                </div>
                <button type="button" class="btn btn-save" onclick="saveListing()">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
    const BASE = '{{ url_for("auctions-p2p-marketplaces.index") }}'.replace(/\/$/, '');

    function saveListing() {
        const form = document.getElementById('edit-form');
        fetch(BASE + '/api/listings/{{ product.id }}', {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: form.name.value,
                description: form.description.value,
                category: form.category.value,
                condition: form.condition.value,
                shipping: form.shipping.value,
            })
        }).then(r => r.json()).then(d => {
            if (d.success) { alert('Listing updated!'); window.location.href = BASE + '/listing/{{ product.id }}'; }
            else alert(d.error || 'Update failed');
        });
    }
    </script>
</body>
</html>
