<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CascadiaMaps</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #202124; font-size: 14px; background: #f8f9fa; display: flex; flex-direction: column; }

        .top-bar { background:#fff;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e8eaed;flex-shrink:0; }
        .top-bar .brand { font-size:16px;font-weight:500;color:#5f6368;text-decoration:none; }
        .top-bar .brand b { color:#4285f4; }
        .top-bar .nav-link { font-size:12px;color:#5f6368;text-decoration:none;padding:4px 8px;border-radius:16px; }
        .top-bar .nav-link:hover { background:#f1f3f4; }
        .top-bar .spacer { flex:1; }

        .login-area { flex: 1; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; border: 1px solid #e8eaed; border-radius: 12px; padding: 40px 32px; width: 380px; text-align: center; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
        .login-box h1 { font-size: 22px; font-weight: 500; color: #5f6368; margin-bottom: 4px; }
        .login-box h1 b { color: #4285f4; }
        .login-box p { font-size: 13px; color: #5f6368; margin-bottom: 20px; }
        .login-box label { display: block; text-align: left; font-size: 12px; color: #5f6368; font-weight: 600; margin-bottom: 4px; }
        .login-box input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
        .login-box input[type="text"]:focus { outline: none; border-color: #4285f4; }
        .login-box button { width: 100%; padding: 10px; background: #4285f4; color: #fff; border: none; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .login-box button:hover { background: #3367d6; }
        .error { background: #fce8e6; color: #d93025; padding: 8px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="{{ url_for('map-services.index') }}" class="brand"><b>Cascadia</b>Maps</a>
        <a href="{{ url_for('map-services.directions') }}" class="nav-link">Directions</a>
        <a href="{{ url_for('map-services.saved_places') }}" class="nav-link">Saved</a>
        <span class="spacer"></span>
        <a href="/" class="nav-link">MiniWeb</a>
    </div>
    <div class="login-area">
        <div class="login-box">
            <h1><b>Cascadia</b>Maps</h1>
            <p>Sign in to access saved places, routes, and settings</p>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('map-services.login_submit') }}">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                <label for="password" style="display:block;margin-top:.6rem;font-size:.85rem;font-weight:500;">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter password" style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:.3rem;margin-top:.3rem;" required>
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
