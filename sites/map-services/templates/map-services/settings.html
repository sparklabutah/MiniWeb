<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - CascadiaMaps</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #202124; font-size: 14px; }

        .app { display: flex; height: 100vh; flex-direction: column; }
        .top-bar { background:#fff;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e8eaed;flex-shrink:0; }
        .top-bar .brand { font-size:16px;font-weight:500;color:#5f6368;text-decoration:none; }
        .top-bar .brand b { color:#4285f4; }
        .top-bar .nav-link { font-size:12px;color:#5f6368;text-decoration:none;padding:4px 8px;border-radius:16px; }
        .top-bar .nav-link:hover { background:#f1f3f4; }
        .top-bar .spacer { flex:1; }

        .content { flex: 1; overflow-y: auto; background: #f8f9fa; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px 16px; }

        h2 { font-size: 16px; margin-bottom: 16px; font-weight: 500; }
        .user-info { margin-bottom: 16px; }
        .user-info p { font-size: 13px; color: #5f6368; margin-bottom: 3px; }
        .user-info strong { color: #202124; }

        .settings-card { background: #fff; border: 1px solid #e8eaed; border-radius: 12px; padding: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #5f6368; font-weight: 600; margin-bottom: 6px; }
        .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #dadce0; border-radius: 8px; font-size: 13px; background: #fff; }
        .form-group select:focus { outline: none; border-color: #4285f4; }
        .info { font-size: 11px; color: #9aa0a6; margin-top: 3px; }
        .save-btn { padding: 10px 20px; background: #4285f4; color: #fff; border: none; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; }
        .save-btn:hover { background: #3367d6; }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <a href="{{ url_for('map-services.index') }}" class="brand"><b>Cascadia</b>Maps</a>
        <a href="{{ url_for('map-services.directions') }}" class="nav-link">Directions</a>
        <a href="{{ url_for('map-services.saved_places') }}" class="nav-link">Saved</a>
        <span class="spacer"></span>
        <a href="/" class="nav-link">MiniWeb</a>
    </div>
    <div class="content">
        <div class="container">
            <h2>Settings</h2>
            <div class="user-info">
                <p><strong>{{ user.full_name }}</strong></p>
                <p>{{ user.email }}</p>
            </div>
            <div class="settings-card">
                <form method="POST" action="{{ url_for('map-services.form_update_settings') }}">
                    <div class="form-group">
                        <label for="default_mode">Default Travel Mode</label>
                        <select id="default_mode" name="default_mode">
                            <option value="driving" {% if user.default_mode == 'driving' %}selected{% endif %}>Driving</option>
                            <option value="cycling" {% if user.default_mode == 'cycling' %}selected{% endif %}>Cycling</option>
                            <option value="walking" {% if user.default_mode == 'walking' %}selected{% endif %}>Walking</option>
                            <option value="transit" {% if user.default_mode == 'transit' %}selected{% endif %}>Transit</option>
                        </select>
                        <div class="info">Used as default when computing new routes</div>
                    </div>
                    <div class="form-group">
                        <label for="units">Distance Units</label>
                        <select id="units" name="units">
                            <option value="imperial" {% if user.units == 'imperial' %}selected{% endif %}>Imperial (miles)</option>
                            <option value="metric" {% if user.units == 'metric' %}selected{% endif %}>Metric (km)</option>
                        </select>
                        <div class="info">Affects distance display throughout the app</div>
                    </div>
                    <button type="submit" class="save-btn">Save Settings</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
