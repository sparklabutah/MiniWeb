<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Issue - Meridian Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #1e293b; }
        .topbar { background: #1e293b; color: #fff; padding: .75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .topbar h1 { font-size: 1.2rem; font-weight: 600; }
        .topbar a { color: #94a3b8; text-decoration: none; font-size: .85rem; }
        .topbar a:hover { color: #fff; }
        .topbar-nav { display: flex; gap: 1.25rem; align-items: center; }
        .topbar-nav a { color: #cbd5e1; }
        .user-badge { background: #334155; padding: .3rem .6rem; border-radius: .25rem; font-size: .8rem; color: #e2e8f0; }
        .container { max-width: 700px; margin: 0 auto; padding: 1.5rem; }
        .back-link { font-size: .85rem; color: #3b82f6; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        h2 { font-size: 1.3rem; margin: 1rem 0; }
        .form-card { background: #fff; border: 1px solid #e2e8f0; border-radius: .5rem; padding: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .88rem; font-weight: 500; color: #334155; margin-bottom: .3rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: .5rem .75rem; border: 1px solid #cbd5e1; border-radius: .35rem; font-size: .9rem; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .form-group .hint { font-size: .78rem; color: #94a3b8; margin-top: .2rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .btn { display: inline-block; padding: .5rem 1.2rem; border-radius: .35rem; font-size: .9rem; font-weight: 500; text-decoration: none; cursor: pointer; border: none; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-cancel { background: #e2e8f0; color: #475569; }
        .btn-cancel:hover { background: #cbd5e1; }
        .form-actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Meridian Tracker</h1>
        <div class="topbar-nav">
            <a href="{{ url_for('project-mgmt-issue-tracking.index') }}">Dashboard</a>
            <a href="{{ url_for('project-mgmt-issue-tracking.sprints_page') }}">Sprints</a>
            <a href="{{ url_for('project-mgmt-issue-tracking.backlog') }}">Backlog</a>
            {% if user %}
            <span class="user-badge">{{ user.name }}</span>
            {% endif %}
            <a href="/">&larr; MiniWeb</a>
        </div>
    </div>

    <div class="container">
        <a class="back-link" href="{{ url_for('project-mgmt-issue-tracking.index') }}">&larr; Dashboard</a>
        <h2>Create New Issue</h2>
        <div class="form-card">
            <form method="POST" action="{{ url_for('project-mgmt-issue-tracking.form_create_issue') }}">
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" name="title" required placeholder="Brief summary of the issue" autofocus>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Detailed description, steps to reproduce, expected behavior..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="project_id">Project *</label>
                        <select id="project_id" name="project_id" required>
                            <option value="">Select project...</option>
                            {% for p in projects %}
                            <option value="{{ p.id }}" {% if selected_project == p.id %}selected{% endif %}>{{ p.name }} ({{ p.key }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" name="type">
                            <option value="bug">Bug</option>
                            <option value="feature">Feature</option>
                            <option value="task" selected>Task</option>
                            <option value="story">Story</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="critical">Critical</option>
                            <option value="high">High</option>
                            <option value="medium" selected>Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="assignee_id">Assignee</label>
                        <select id="assignee_id" name="assignee_id">
                            <option value="">Unassigned</option>
                            {% for u in users %}
                            <option value="{{ u.id }}">{{ u.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="story_points">Story Points</label>
                        <input type="number" id="story_points" name="story_points" min="0" placeholder="e.g. 5">
                    </div>
                    <div class="form-group">
                        <label for="sprint">Sprint</label>
                        <select id="sprint" name="sprint">
                            <option value="">Backlog (no sprint)</option>
                            {% for s in sprints %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="labels">Labels</label>
                    <input type="text" id="labels" name="labels" placeholder="e.g. security, api, performance">
                    <div class="hint">Comma-separated list of labels</div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create Issue</button>
                    <a href="{{ url_for('project-mgmt-issue-tracking.index') }}" class="btn btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
