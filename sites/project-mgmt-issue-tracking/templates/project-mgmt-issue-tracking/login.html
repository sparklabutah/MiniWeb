{% extends "project-mgmt-issue-tracking/base.html" %}
{% block title %}Log In - Meridian Tracker{% endblock %}
{% block heading %}Sign In{% endblock %}
{% block content %}

<div class="card" style="max-width:380px;margin:40px auto;">
    <h2 style="font-size:1.3rem;text-align:center;margin-bottom:4px;">Meridian Tracker</h2>
    <div style="font-size:.88rem;color:var(--muted);margin-bottom:20px;text-align:center;">Sign in to your account</div>
    {% if error %}
    <div style="background:#fef2f2;color:#dc2626;padding:8px 12px;border-radius:8px;font-size:.85rem;margin-bottom:16px;text-align:center;">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('project-mgmt-issue-tracking.login_submit') }}">
        <div style="margin-bottom:14px;">
            <label for="username" style="display:block;font-weight:600;margin-bottom:5px;">Username</label>
            <input type="text" id="username" name="username" required autofocus placeholder="e.g. alex.chen">
        </div>
        <div style="margin-bottom:16px;">
            <label for="password" style="display:block;font-weight:600;margin-bottom:5px;">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In</button>
    </form>
    <a href="{{ url_for('project-mgmt-issue-tracking.index') }}" style="display:block;text-align:center;margin-top:14px;font-size:.85rem;color:var(--accent);">&larr; Back to Dashboard</a>
</div>
{% endblock %}
