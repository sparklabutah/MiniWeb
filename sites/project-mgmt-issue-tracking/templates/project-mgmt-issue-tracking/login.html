<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Meridian Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #fff; border: 1px solid #e2e8f0; border-radius: .5rem; padding: 2rem; width: 100%; max-width: 380px; }
        .login-card h2 { font-size: 1.3rem; margin-bottom: .25rem; text-align: center; }
        .login-card .subtitle { font-size: .88rem; color: #64748b; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .88rem; font-weight: 500; color: #334155; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .55rem .75rem; border: 1px solid #cbd5e1; border-radius: .35rem; font-size: .9rem; }
        .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
        .btn { display: block; width: 100%; padding: .6rem; border-radius: .35rem; font-size: .95rem; font-weight: 500; cursor: pointer; border: none; text-align: center; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .error { background: #fef2f2; color: #dc2626; padding: .5rem .75rem; border-radius: .35rem; font-size: .85rem; margin-bottom: 1rem; text-align: center; }
        .back-link { display: block; text-align: center; margin-top: 1rem; font-size: .85rem; color: #3b82f6; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Meridian Tracker</h2>
        <div class="subtitle">Sign in to your account</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('project-mgmt-issue-tracking.login_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="e.g. alex.chen">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <a class="back-link" href="{{ url_for('project-mgmt-issue-tracking.index') }}">&larr; Back to Dashboard</a>
    </div>
</body>
</html>
