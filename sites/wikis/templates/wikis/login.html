<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LakeportWiki</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #202122; }
        .site-header { background: #fff; border-bottom: 2px solid #2563eb; padding: .6rem 2rem; }
        .site-header h1 { font-size: 1.4rem; color: #1e3a5f; }
        .site-header h1 a { color: inherit; text-decoration: none; }
        .main { max-width: 400px; margin: 3rem auto; padding: 0 1.5rem; }
        .login-card { background: #fff; border: 1px solid #e2e8f0; border-radius: .5rem; padding: 2rem; }
        .login-card h2 { font-size: 1.2rem; margin-bottom: 1.2rem; color: #1e3a5f; }
        .login-card label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: .3rem; }
        .login-card input { width: 100%; padding: .6rem .8rem; border: 1px solid #cbd5e1; border-radius: .4rem; font-size: .92rem; margin-bottom: 1rem; }
        .login-card button { width: 100%; padding: .7rem; background: #2563eb; color: #fff; border: none; border-radius: .4rem; cursor: pointer; font-size: .95rem; }
        .login-card button:hover { background: #1d4ed8; }
        .error { color: #dc2626; font-size: .85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="site-header">
        <h1><a href="{{ url_for('wikis.index') }}">LakeportWiki</a></h1>
    </div>

    <div class="main">
        <div class="login-card">
            <h2>Log in to LakeportWiki</h2>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('wikis.login_submit') }}">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
                <button type="submit">Log in</button>
            </form>
        </div>
    </div>
</body>
</html>
