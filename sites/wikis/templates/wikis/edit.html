<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit: {{ page.title }} - LakeportWiki</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #202122; }
        .site-header { background: #fff; border-bottom: 2px solid #2563eb; padding: .6rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .site-header h1 { font-size: 1.4rem; color: #1e3a5f; }
        .site-header h1 a { color: inherit; text-decoration: none; }
        .header-nav a { font-size: .88rem; color: #475569; text-decoration: none; margin-left: 1rem; }
        .main { max-width: 800px; margin: 1.5rem auto; padding: 0 1.5rem; }
        .edit-form label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .3rem; color: #1e3a5f; }
        .edit-form input[type="text"], .edit-form textarea, .edit-form select { width: 100%; padding: .6rem .8rem; border: 1px solid #cbd5e1; border-radius: .4rem; font-size: .92rem; margin-bottom: 1rem; font-family: inherit; }
        .edit-form textarea { min-height: 300px; line-height: 1.5; }
        .edit-form select { appearance: auto; }
        .edit-form button { padding: .7rem 1.5rem; background: #2563eb; color: #fff; border: none; border-radius: .4rem; cursor: pointer; font-size: .95rem; }
        .edit-form button:hover { background: #1d4ed8; }
        .cancel-link { margin-left: 1rem; font-size: .9rem; color: #64748b; text-decoration: none; }
    </style>
</head>
<body>
    <div class="site-header">
        <h1><a href="{{ url_for('wikis.index') }}">LakeportWiki</a></h1>
        <div class="header-nav">
            <a href="{{ url_for('wikis.wiki_page', slug=page.slug) }}">Back to Article</a>
        </div>
    </div>

    <div class="main">
        <h2 style="margin-bottom:1rem; font-size:1.2rem; color:#1e3a5f;">Editing: {{ page.title }}</h2>

        <form class="edit-form" method="post" action="{{ url_for('wikis.edit_page_submit', slug=page.slug) }}">
            <label for="title">Title</label>
            <input type="text" name="title" id="title" value="{{ page.title }}">

            <label for="category">Category</label>
            <select name="category" id="category">
                {% for cat in categories %}
                <option value="{{ cat.name }}" {{ 'selected' if cat.name == page.category else '' }}>{{ cat.name }}</option>
                {% endfor %}
            </select>

            <label for="content">Content</label>
            <textarea name="content" id="content">{{ page.content }}</textarea>

            <label for="summary">Edit summary</label>
            <input type="text" name="summary" id="summary" placeholder="Briefly describe your changes">

            <button type="submit">Save Changes</button>
            <a class="cancel-link" href="{{ url_for('wikis.wiki_page', slug=page.slug) }}">Cancel</a>
        </form>
    </div>
</body>
</html>
