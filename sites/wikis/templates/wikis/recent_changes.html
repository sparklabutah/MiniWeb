<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Changes - LakeportWiki</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #202122; }
        .site-header { background: #fff; border-bottom: 2px solid #2563eb; padding: .6rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .site-header h1 { font-size: 1.4rem; color: #1e3a5f; }
        .site-header h1 a { color: inherit; text-decoration: none; }
        .header-nav { display: flex; gap: 1rem; align-items: center; }
        .header-nav a { font-size: .88rem; color: #475569; text-decoration: none; }
        .search-bar { display: flex; gap: .4rem; }
        .search-bar input { padding: .4rem .7rem; border: 1px solid #cbd5e1; border-radius: .3rem; font-size: .88rem; width: 200px; }
        .search-bar button { padding: .4rem .8rem; background: #2563eb; color: #fff; border: none; border-radius: .3rem; cursor: pointer; font-size: .85rem; }
        .main { max-width: 900px; margin: 1.5rem auto; padding: 0 1.5rem; }
        .rev-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e2e8f0; border-radius: .5rem; overflow: hidden; }
        .rev-table th, .rev-table td { padding: .6rem .8rem; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: .88rem; }
        .rev-table th { background: #f8fafc; color: #1e3a5f; font-size: .82rem; text-transform: uppercase; letter-spacing: .03em; }
        .rev-table td a { color: #2563eb; text-decoration: none; }
        .rev-table td a:hover { text-decoration: underline; }
        .diff-add { color: #16a34a; }
        .diff-rem { color: #dc2626; }
    </style>
</head>
<body>
    <div class="site-header">
        <h1><a href="{{ url_for('wikis.index') }}">LakeportWiki</a></h1>
        <div class="header-nav">
            <a href="{{ url_for('wikis.index') }}">Main Page</a>
            <a href="{{ url_for('wikis.create_page') }}">Create Article</a>
            <form class="search-bar" action="{{ url_for('wikis.search') }}" method="get">
                <input type="text" name="q" placeholder="Search wiki...">
                <button type="submit">Search</button>
            </form>
        </div>
    </div>

    <div class="main">
        <h2 style="margin-bottom:1rem; font-size:1.2rem; color:#1e3a5f;">Recent Changes</h2>

        <table class="rev-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Article</th>
                    <th>Editor</th>
                    <th>Summary</th>
                    <th>Changes</th>
                </tr>
            </thead>
            <tbody>
                {% for rev in revisions %}
                <tr>
                    <td>{{ rev.timestamp[:10] }}</td>
                    <td><a href="{{ url_for('wikis.wiki_page', slug=rev.page_slug) }}">{{ rev.page_title }}</a></td>
                    <td>{{ rev.editor_name }}</td>
                    <td>{{ rev.summary }}</td>
                    <td>
                        <span class="diff-add">+{{ rev.diff_lines_added }}</span>
                        <span class="diff-rem">-{{ rev.diff_lines_removed }}</span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
