<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - PulseLive</title>
    <link rel="stylesheet" href="/static/twitch.css">
</head>
<body>
    {% set logged_in = false %}
    {% include "live/_topnav.html" %}

    <div class="tw-auth-wrap">
        <div class="tw-auth-card">
            <h2>Log In to PulseLive</h2>
            {% if error %}<div class="tw-error">{{ error }}</div>{% endif %}
            <form method="post" action="{{ url_for('live.login_submit') }}">
                <div class="tw-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="tw-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="tw-btn">Log In</button>
            </form>
            <p class="tw-auth-alt">Don't have an account? <a href="{{ url_for('live.register_page') }}">Sign up</a></p>
        </div>
    </div>
</body>
</html>
