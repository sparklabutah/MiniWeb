<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - StreamHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0e0e10; color: #efeff1; display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: #18181b; padding: .7rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2f2f35; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.3rem; font-weight: 700; }
        .header h1 a span { color: #9147ff; }
        .login-container { max-width: 400px; margin: 4rem auto; padding: 2rem; background: #18181b; border-radius: .5rem; }
        .login-container h2 { text-align: center; margin-bottom: 1.5rem; font-size: 1.3rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: #adadb8; margin-bottom: .3rem; font-weight: 600; }
        .form-group input { width: 100%; background: #0e0e10; color: #efeff1; border: 1px solid #3a3a44; padding: .6rem .8rem; border-radius: .3rem; font-size: .9rem; }
        .form-group input:focus { border-color: #9147ff; outline: none; }
        .btn { width: 100%; background: #9147ff; color: #fff; border: none; padding: .7rem; border-radius: .3rem; font-size: .9rem; font-weight: 600; cursor: pointer; margin-top: .5rem; }
        .btn:hover { background: #772ce8; }
        .error { background: #eb0400; color: #fff; padding: .5rem .8rem; border-radius: .3rem; margin-bottom: 1rem; font-size: .85rem; }
        .register-link { text-align: center; margin-top: 1rem; font-size: .85rem; color: #adadb8; }
        .register-link a { color: #9147ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('live.index') }}">Stream<span>Hub</span></a></h1>
    </div>
    <div class="login-container">
        <h2>Log In to StreamHub</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('live.login_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>
        <p class="register-link">Don't have an account? <a href="{{ url_for('live.register_page') }}">Sign up</a></p>
    </div>
</body>
</html>
