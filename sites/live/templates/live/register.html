<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PulseLive</title>
    <link rel="stylesheet" href="/static/twitch.css">
</head>
<body>
    {% set logged_in = false %}
    {% include "live/_topnav.html" %}

    <div class="tw-auth-wrap">
        <div class="tw-auth-card">
            <h2>Sign Up for PulseLive</h2>
            {% if error %}<div class="tw-error">{{ error }}</div>{% endif %}
            <form method="post" action="{{ url_for('live.register_submit') }}">
                <div class="tw-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="tw-field">
                    <label for="display_name">Display Name</label>
                    <input type="text" id="display_name" name="display_name">
                </div>
                <div class="tw-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="tw-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="tw-btn">Sign Up</button>
            </form>
            <p class="tw-auth-alt">Already have an account? <a href="{{ url_for('live.login_page') }}">Log in</a></p>
        </div>
    </div>
</body>
</html>
