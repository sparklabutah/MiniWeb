<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Permit - Lakeport Government Services</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; }
        .header { background: linear-gradient(135deg, #1b3a4b, #274c5b); padding: .8rem 2rem; } .header h1 a { color: #fff; text-decoration: none; font-size: 1.2rem; } .header h1 a span { color: #5db8a3; }
        nav { max-width: 1100px; margin: 0 auto; padding: .6rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1.2rem; flex-wrap: wrap; }
        nav a { color: #1b3a4b; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .3rem .5rem; border-radius: .3rem; }
        .container { max-width: 700px; margin: 2rem auto; padding: 0 2rem; }
        .form-card { background: #fff; padding: 2rem; border-radius: .5rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .form-card h2 { color: #1b3a4b; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #334155; margin-bottom: .3rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: .6rem .8rem; border: 1.5px solid #d1d5db; border-radius: .4rem; font-size: .95rem; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .submit-btn { width: 100%; padding: .8rem; background: #1b3a4b; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { background: #274c5b; }
        .upload-area { border: 2px dashed #d1d5db; padding: 1.5rem; text-align: center; border-radius: .4rem; margin-bottom: 1rem; }
        .upload-area input { margin-top: .5rem; }
        .success-msg { background: #d1fae5; color: #065f46; padding: .8rem; border-radius: .3rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="header"><h1><a href="{{ url_for('tax-filing-dmv-permits.index') }}">Lakeport <span>Gov</span>Services</a></h1></div>
    <nav>
        <a href="{{ url_for('tax-filing-dmv-permits.index') }}">Dashboard</a>
        <a href="{{ url_for('tax-filing-dmv-permits.permits_page') }}">Permits</a>
    </nav>
    <div class="container">
        <div class="form-card">
            <h2>Apply for a Permit</h2>
            <div id="success-msg" class="success-msg">Permit application submitted successfully!</div>
            <form id="permit-form" onsubmit="return submitPermit(event)">
                <div class="form-group"><label for="type">Permit Type</label>
                    <select name="type" id="type">
                        <option value="Building">Building</option>
                        <option value="Renovation">Renovation</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Parking Permit">Parking Permit</option>
                        <option value="Event Permit">Event Permit</option>
                        <option value="Fence">Fence</option>
                    </select>
                </div>
                <div class="form-group"><label for="applicant_name">Applicant Name</label><input type="text" name="applicant_name" id="applicant_name" value="{{ user.display_name }}" required></div>
                <div class="form-group"><label for="address">Property Address</label><input type="text" name="address" id="address" required placeholder="e.g., 123 Main St, Lakeport, WA 98401"></div>
                <div class="form-group"><label for="description">Description</label><textarea name="description" id="description" required placeholder="Describe the work to be performed..."></textarea></div>
                <div class="upload-area">
                    <p>Upload Supporting Documents (optional)</p>
                    <input type="file" id="doc-upload" name="file">
                </div>
                <button type="submit" class="submit-btn">Submit Application</button>
            </form>
        </div>
    </div>
    <script>
    function submitPermit(e) {
        e.preventDefault();
        var data = {
            type: document.getElementById('type').value,
            applicant_name: document.getElementById('applicant_name').value,
            address: document.getElementById('address').value,
            description: document.getElementById('description').value,
            user_id: {{ user.id }},
        };
        fetch('{{ url_for("tax-filing-dmv-permits.index") }}api/permits', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
        }).then(function(r) { return r.json(); }).then(function(d) {
            document.getElementById('success-msg').style.display = 'block';
            document.getElementById('success-msg').textContent = 'Permit application ' + d.permit_id + ' submitted successfully!';
            var fileInput = document.getElementById('doc-upload');
            if (fileInput.files.length > 0) {
                var fd = new FormData(); fd.append('file', fileInput.files[0]);
                fetch('{{ url_for("tax-filing-dmv-permits.index") }}api/upload', {method:'POST', body: fd});
            }
        });
        return false;
    }
    </script>
</body>
</html>
