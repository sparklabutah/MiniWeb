<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Lakeport Government Services</title>
    <link rel="stylesheet" href="/static/lakeport.css">
</head>
<body>
    {% set active_nav = '' %}
    {% include "tax-filing-dmv-permits/_chrome.html" %}

    <form class="login-container" method="post" action="{{ url_for('tax-filing-dmv-permits.login_submit') }}">
        <h2>Sign In</h2>
        <p class="subtitle">Access your government services account</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <div class="secure-badge">Secured Government Portal &mdash; Encrypted Connection</div>
    </form>

    {% include "tax-filing-dmv-permits/_footer.html" %}
</body>
</html>
