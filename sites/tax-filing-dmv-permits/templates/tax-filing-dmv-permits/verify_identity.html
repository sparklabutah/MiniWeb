<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity - Lakeport Government Services</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; }
        .header { background: linear-gradient(135deg, #1b3a4b, #274c5b); padding: .8rem 2rem; } .header h1 a { color: #fff; text-decoration: none; font-size: 1.2rem; } .header h1 a span { color: #5db8a3; }
        nav { max-width: 1100px; margin: 0 auto; padding: .6rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1.2rem; flex-wrap: wrap; }
        nav a { color: #1b3a4b; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .3rem .5rem; }
        .container { max-width: 500px; margin: 3rem auto; padding: 0 2rem; }
        .card { background: #fff; padding: 2rem; border-radius: .5rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); text-align: center; }
        .card h2 { color: #1b3a4b; margin-bottom: 1rem; }
        .code-display { background: #f0fdf4; border: 2px solid #059669; padding: 1rem; border-radius: .4rem; margin: 1rem 0; font-size: 1.3rem; font-weight: 700; letter-spacing: .3rem; color: #065f46; }
        .form-group { margin: 1.5rem 0; text-align: left; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #334155; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .7rem 1rem; border: 1.5px solid #d1d5db; border-radius: .4rem; font-size: 1.1rem; text-align: center; letter-spacing: .2rem; }
        .submit-btn { width: 100%; padding: .8rem; background: #1b3a4b; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .result { margin-top: 1rem; padding: .8rem; border-radius: .3rem; display: none; }
        .result.success { background: #d1fae5; color: #065f46; }
        .result.fail { background: #fee2e2; color: #991b1b; }
        .verified-badge { background: #d1fae5; color: #065f46; padding: 1rem; border-radius: .4rem; font-size: 1.1rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header"><h1><a href="{{ url_for('tax-filing-dmv-permits.index') }}">Lakeport <span>Gov</span>Services</a></h1></div>
    <nav><a href="{{ url_for('tax-filing-dmv-permits.index') }}">Dashboard</a></nav>
    <div class="container">
        <div class="card">
            <h2>Identity Verification</h2>
            {% if verified %}
            <div class="verified-badge">Identity Verified Successfully</div>
            {% else %}
            <p style="color:#64748b;margin-bottom:1rem;">Your verification code has been sent to your registered phone/email.</p>
            <div class="code-display" id="code-hint">Code: {{ verification_code }}</div>
            <form onsubmit="return verifyCode(event)">
                <div class="form-group"><label for="code">Enter Verification Code</label><input type="text" id="code" maxlength="6" placeholder="000000" required></div>
                <button type="submit" class="submit-btn">Verify</button>
            </form>
            <div id="result" class="result"></div>
            {% endif %}
        </div>
    </div>
    <script>
    function verifyCode(e) {
        e.preventDefault();
        var code = document.getElementById('code').value;
        fetch('{{ url_for("tax-filing-dmv-permits.index") }}api/verify-identity', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code: code, user_id: {{ user.id }}})
        }).then(function(r) { return r.json(); }).then(function(d) {
            var el = document.getElementById('result');
            el.style.display = 'block';
            if (d.status === 'verified') { el.className = 'result success'; el.textContent = 'Identity verified successfully!'; }
            else { el.className = 'result fail'; el.textContent = 'Invalid code. Please try again.'; }
        });
        return false;
    }
    </script>
</body>
</html>
