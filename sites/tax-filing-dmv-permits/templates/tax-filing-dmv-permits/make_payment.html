<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Payment - Lakeport Government Services</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; }
        .header { background: linear-gradient(135deg, #1b3a4b, #274c5b); padding: .8rem 2rem; } .header h1 a { color: #fff; text-decoration: none; font-size: 1.2rem; } .header h1 a span { color: #5db8a3; }
        nav { max-width: 1100px; margin: 0 auto; padding: .6rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1.2rem; flex-wrap: wrap; }
        nav a { color: #1b3a4b; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .3rem .5rem; }
        .container { max-width: 700px; margin: 2rem auto; padding: 0 2rem; }
        .form-card { background: #fff; padding: 2rem; border-radius: .5rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .form-card h2 { color: #1b3a4b; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #334155; margin-bottom: .3rem; }
        .form-group input, .form-group select { width: 100%; padding: .6rem .8rem; border: 1.5px solid #d1d5db; border-radius: .4rem; font-size: .95rem; }
        .submit-btn { width: 100%; padding: .8rem; background: #059669; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .success-msg { background: #d1fae5; color: #065f46; padding: 1rem; border-radius: .3rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="header"><h1><a href="{{ url_for('tax-filing-dmv-permits.index') }}">Lakeport <span>Gov</span>Services</a></h1></div>
    <nav><a href="{{ url_for('tax-filing-dmv-permits.index') }}">Dashboard</a><a href="{{ url_for('tax-filing-dmv-permits.payments_page') }}">Payments</a></nav>
    <div class="container">
        <div class="form-card">
            <h2>Make a Payment</h2>
            <div id="success-msg" class="success-msg"></div>
            <form id="pay-form" onsubmit="return submitPayment(event)">
                <div class="form-group"><label for="pay_type">Payment For</label>
                    <select id="pay_type"><option value="income_tax">Income Tax</option><option value="property_tax">Property Tax</option><option value="vehicle_registration">Vehicle Registration</option><option value="permit_fee">Permit Fee</option><option value="business_tax">Business Tax</option></select>
                </div>
                <div class="form-group"><label for="amount">Amount ($)</label><input type="number" id="amount" step="0.01" required placeholder="0.00"></div>
                <div class="form-group"><label for="method">Payment Method</label>
                    <select id="method"><option value="credit_card">Credit Card</option><option value="ach_debit">ACH Debit</option><option value="check">Check</option></select>
                </div>
                <div class="form-group"><label for="card_last_four">Card/Account Last 4</label><input type="text" id="card_last_four" maxlength="4" placeholder="1234"></div>
                <div class="form-group"><label for="account_type">Pay with:</label>
                    <select id="account_type"><option value="checking">Checking Account</option><option value="credit">Credit Card</option></select>
                </div>
                <button type="submit" class="submit-btn">Submit Payment</button>
            </form>
        </div>
    </div>
    <script>
    function submitPayment(e) {
        e.preventDefault();
        var data = {
            user_id: {{ user.id }}, payer_name: '{{ user.display_name }}',
            type: document.getElementById('pay_type').value,
            amount: parseFloat(document.getElementById('amount').value),
            method: document.getElementById('method').value,
            card_last_four: document.getElementById('card_last_four').value,
            account_last_four: document.getElementById('card_last_four').value,
            account_type: document.getElementById('account_type').value,
        };
        fetch('{{ url_for("tax-filing-dmv-permits.index") }}api/payments', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
        }).then(function(r) { return r.json(); }).then(function(d) {
            var msg = document.getElementById('success-msg');
            msg.style.display = 'block';
            msg.textContent = 'Payment confirmed! Confirmation: ' + d.confirmation_number;
        });
        return false;
    }
    </script>
</body>
</html>
