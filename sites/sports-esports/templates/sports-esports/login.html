<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lakeport Sports Hub</title>
    <link rel="stylesheet" href="/static/sportscenter.css">
</head>
<body>
    {% set active_nav = '' %}
    {% include "sports-esports/_nav.html" %}
    <div class="login-container">
        <div class="page-title" style="margin-bottom:1.25rem;">Sign In</div>
        {% if error %}
        <div style="background:#fee2e2;color:#991b1b;padding:.6rem 1rem;border-radius:6px;font-size:.85rem;margin-bottom:1rem;">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('sports-esports.login_submit') }}">
            <div class="form-group">
                <label class="label" for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label class="label" for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;text-align:center;margin-top:.5rem;">Sign In</button>
        </form>
        <div style="text-align:center;margin-top:1.25rem;font-size:.85rem;">
            <a href="{{ url_for('sports-esports.index') }}" class="team-link">Continue as guest</a>
        </div>
    </div>
</body>
</html>
