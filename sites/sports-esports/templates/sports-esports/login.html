<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lakeport Sports Hub</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; }
        .header { background: #1a1a2e; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.4rem; }
        .header h1 span { color: #00d4aa; }
        .nav { display: flex; gap: 1.2rem; align-items: center; }
        .nav a { color: #b0b8c8; text-decoration: none; font-size: .9rem; }
        .nav a:hover { color: #fff; }

        .login-container { max-width: 400px; margin: 4rem auto; padding: 0 1.5rem; }
        .login-card { background: #fff; border-radius: .75rem; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
        .login-card h2 { font-size: 1.4rem; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #475569; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .7rem 1rem; border: 1px solid #e2e8f0; border-radius: .4rem; font-size: .95rem; outline: none; transition: border-color .15s; }
        .form-group input:focus { border-color: #00d4aa; box-shadow: 0 0 0 3px rgba(0,212,170,.12); }
        .error-msg { background: #fee2e2; color: #dc2626; padding: .6rem 1rem; border-radius: .4rem; font-size: .85rem; margin-bottom: 1rem; }
        .login-btn { width: 100%; padding: .75rem; background: #1a1a2e; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .15s; }
        .login-btn:hover { background: #2a2a4e; }
        .login-footer { text-align: center; margin-top: 1.25rem; font-size: .85rem; color: #94a3b8; }
        .login-footer a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lakeport <span>Sports Hub</span></h1>
        <div class="nav">
            <a href="{{ url_for('sports-esports.index') }}">Scoreboard</a>
            <a href="{{ url_for('sports-esports.standings_page') }}">Standings</a>
            <a href="{{ url_for('sports-esports.compare_page') }}">Compare</a>
            <a href="{{ url_for('sports-esports.players_page') }}">Players</a>
            <a href="/">&larr; MiniWeb</a>
        </div>
    </div>
    <div class="login-container">
        <div class="login-card">
            <h2>Sign In</h2>
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('sports-esports.login_submit') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            <div class="login-footer">
                <a href="{{ url_for('sports-esports.index') }}">Continue as guest</a>
            </div>
        </div>
    </div>
</body>
</html>
