<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SecureBank Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #0a2463, #1e3a6e); padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.2rem; }
        .header h1 a span { color: #4da6ff; }
        nav { max-width: 1000px; margin: 0 auto; padding: .6rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
        nav a { color: #0a2463; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .3rem .5rem; border-radius: .3rem; }
        nav a:hover { background: #f0f4ff; }
        nav a.active { font-weight: 700; background: #dbeafe; }
        nav .btn-login { background: #0a2463; color: #fff; padding: .4rem 1rem; border-radius: .3rem; margin-left: auto; }
        nav .btn-logout { color: #dc2626; margin-left: auto; }
        .main { max-width: 700px; margin: 2rem auto; padding: 0 2rem; }
        .form-card { background: #fff; padding: 2rem; border-radius: .5rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .form-card h2 { color: #0a2463; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; color: #334155; font-weight: 600; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .6rem .8rem; border: 1.5px solid #d1d5db; border-radius: .4rem; font-size: .9rem; }
        .form-group input:focus { border-color: #4da6ff; outline: none; }
        .btn-save { padding: .7rem 2rem; background: #0a2463; color: #fff; border: none; border-radius: .4rem; font-size: .95rem; font-weight: 600; cursor: pointer; }
        .btn-save:hover { background: #1e3a6e; }
        .alert-success { background: #d1fae5; color: #065f46; padding: .7rem 1rem; border-radius: .3rem; font-size: .85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('banking.index') }}">Secure<span>Bank</span> Online</a></h1>
    </div>

    <nav>
        <a href="{{ url_for('banking.index') }}">Dashboard</a>
        <a href="{{ url_for('banking.accounts_page') }}">Accounts</a>
        <a href="{{ url_for('banking.transactions_page') }}">Transactions</a>
        <a href="{{ url_for('banking.transfer_page') }}">Transfer</a>
        <a href="{{ url_for('banking.pay_bills_page') }}">Pay Bills</a>
        <a href="{{ url_for('banking.payees_page') }}">Payees</a>
        <a href="{{ url_for('banking.loans_page') }}">Loans</a>
        <a href="{{ url_for('banking.settings_page') }}" class="active">Settings</a>
        {% if logged_in %}
        <a href="{{ url_for('banking.logout') }}" class="btn-logout">Sign Out</a>
        {% else %}
        <a href="{{ url_for('banking.login_page') }}" class="btn-login">Sign In</a>
        {% endif %}
    </nav>

    <div class="main">
        <div class="form-card">
            <h2>Account Settings</h2>
            {% if result == 'success' %}
            <div class="alert-success">Settings saved successfully.</div>
            {% endif %}
            <form method="post" action="{{ url_for('banking.settings_submit') }}">
                <div class="form-group">
                    <label for="s-name">Full Name</label>
                    <input type="text" name="name" id="s-name" value="{{ user.name }}">
                </div>
                <div class="form-group">
                    <label for="s-email">Email</label>
                    <input type="email" name="email" id="s-email" value="{{ user.email }}">
                </div>
                <div class="form-group">
                    <label for="s-phone">Phone</label>
                    <input type="text" name="phone" id="s-phone" value="{{ user.phone }}">
                </div>
                <div class="form-group">
                    <label for="s-address">Address</label>
                    <input type="text" name="address" id="s-address" value="{{ user.address }}">
                </div>
                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
    </div>

</body>
</html>
