<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - WordRef Dictionary</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Georgia', 'Times New Roman', serif; background: #f5f5f0; color: #2d2d2d; }
        a { color: #1a5276; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .header { background: #1a3c5e; color: #fff; }
        .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: .7rem 1.5rem; }
        .header h1 { font-size: 1.5rem; }
        .header h1 a { color: #fff; text-decoration: none; }
        .header h1 span { color: #e74c3c; }

        .nav-bar { background: #15334f; border-bottom: 2px solid #e74c3c; }
        .nav-bar-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 0; padding: 0 1.5rem; }
        .nav-bar a { color: #ccc; font-size: .95rem; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: .6rem 1rem; display: inline-block; }
        .nav-bar a:hover { color: #fff; background: rgba(255,255,255,.08); text-decoration: none; }

        .main { max-width: 400px; margin: 4rem auto; padding: 1.5rem; }
        .login-card { background: #fff; border: 1px solid #ddd; border-radius: .5rem; padding: 2rem; }
        .login-card h2 { font-size: 1.4rem; color: #1a3c5e; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-family: -apple-system, sans-serif; font-size: .85rem; font-weight: 600; color: #555; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .65rem .8rem; border: 1px solid #ccc; border-radius: .3rem; font-size: 1rem; font-family: inherit; }
        .form-group input:focus { border-color: #1a3c5e; outline: none; }
        .login-btn { width: 100%; padding: .75rem; background: #e74c3c; color: #fff; border: none; border-radius: .3rem; font-size: 1rem; cursor: pointer; font-weight: 600; font-family: -apple-system, sans-serif; }
        .login-btn:hover { background: #c0392b; }
        .error-msg { background: #fde8e8; color: #922; border: 1px solid #f5c6cb; padding: .5rem .8rem; border-radius: .3rem; font-size: .9rem; margin-bottom: 1rem; text-align: center; }
        .footer { text-align: center; padding: 2rem; color: #999; font-size: .8rem; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <h1><a href="{{ url_for('dictionaries-language-tools.index') }}">Word<span>Ref</span> Dictionary</a></h1>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-bar-inner">
            <a href="{{ url_for('dictionaries-language-tools.index') }}">Home</a>
            <a href="{{ url_for('dictionaries-language-tools.index') }}">Search</a>
            <a href="{{ url_for('dictionaries-language-tools.browse', letter='A') }}">Browse A-Z</a>
            <a href="{{ url_for('dictionaries-language-tools.login_page') }}">Login</a>
        </div>
    </div>

    <div class="main">
        <div class="login-card">
            <h2>Sign In</h2>
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('dictionaries-language-tools.login_submit') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <a href="{{ url_for('dictionaries-language-tools.index') }}">Back to Dictionary</a>
    </div>
</body>
</html>
