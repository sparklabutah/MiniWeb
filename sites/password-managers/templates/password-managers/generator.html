<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - VaultGuard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; }
        .header { background: linear-gradient(135deg, #1a1d29, #252a3a); padding: .8rem 2rem; display: flex; align-items: center; border-bottom: 1px solid #2d3348; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.2rem; font-weight: 700; }
        .header h1 a span { color: #6c8cff; }
        nav { max-width: 1100px; margin: 0 auto; padding: .6rem 2rem; background: #161822; border-bottom: 1px solid #2d3348; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        nav a { color: #8b92a5; text-decoration: none; font-size: .85rem; font-weight: 500; padding: .4rem .7rem; border-radius: .3rem; }
        nav a:hover { color: #c9cdd8; background: #1e2235; }
        nav a.active { color: #6c8cff; background: #1e2235; font-weight: 600; }
        nav .spacer { flex: 1; }
        nav .btn-auth { background: #6c8cff; color: #fff; padding: .4rem 1rem; border-radius: .3rem; font-weight: 600; }
        nav .btn-logout { color: #f87171; }
        .container { max-width: 700px; margin: 0 auto; padding: 2rem; }
        .breadcrumb { font-size: .85rem; color: #8b92a5; margin-bottom: 1rem; }
        .breadcrumb a { color: #6c8cff; text-decoration: none; }
        h2 { color: #e1e4e8; font-size: 1.3rem; margin-bottom: .5rem; }
        .subtitle { color: #8b92a5; font-size: .9rem; margin-bottom: 1.5rem; }
        .generator-card { background: #161822; border: 1px solid #2d3348; border-radius: .6rem; padding: 2rem; }
        .password-display { background: #1e2235; border: 2px solid #2d3348; border-radius: .4rem; padding: 1.2rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .password-display .pw-text { flex: 1; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 1.2rem; color: #6ee7b7; word-break: break-all; letter-spacing: .05rem; min-height: 1.5em; }
        .password-display .btn-copy { background: #6c8cff; color: #fff; border: none; padding: .5rem 1rem; border-radius: .3rem; font-size: .85rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .password-display .btn-copy:hover { background: #5a7af0; }
        .controls { margin-bottom: 1.5rem; }
        .control-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .control-row label { font-size: .9rem; color: #c9cdd8; min-width: 120px; }
        .control-row input[type="range"] { flex: 1; accent-color: #6c8cff; }
        .control-row .range-value { font-size: .9rem; color: #6c8cff; font-weight: 700; min-width: 35px; text-align: right; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: .5rem; }
        .checkbox-item { display: flex; align-items: center; gap: .4rem; }
        .checkbox-item input[type="checkbox"] { accent-color: #6c8cff; width: 16px; height: 16px; }
        .checkbox-item label { font-size: .85rem; color: #c9cdd8; cursor: pointer; }
        .btn-generate { width: 100%; padding: .8rem; background: #6c8cff; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .15s; }
        .btn-generate:hover { background: #5a7af0; }
        .strength-meter { margin-top: 1rem; }
        .strength-meter .meter-label { font-size: .8rem; color: #8b92a5; margin-bottom: .3rem; }
        .meter-track { height: 6px; background: #1e2235; border-radius: 3px; overflow: hidden; }
        .meter-fill { height: 100%; border-radius: 3px; transition: width .3s, background .3s; }
        .strength-text { font-size: .8rem; font-weight: 600; margin-top: .3rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('password-managers.index') }}">Vault<span>Guard</span></a></h1>
    </div>

    <nav>
        <a href="{{ url_for('password-managers.index') }}">Vaults</a>
        <a href="{{ url_for('password-managers.generator_page') }}" class="active">Generator</a>
        <a href="{{ url_for('password-managers.security_report_page') }}">Security</a>
        <a href="{{ url_for('password-managers.audit_log_page') }}">Audit Log</a>
        <span class="spacer"></span>
        {% if logged_in %}
        <a href="{{ url_for('password-managers.logout') }}" class="btn-logout">Sign Out</a>
        {% else %}
        <a href="{{ url_for('password-managers.login_page') }}" class="btn-auth">Sign In</a>
        {% endif %}
    </nav>

    <div class="container">
        <div class="breadcrumb">
            <a href="{{ url_for('password-managers.index') }}">Home</a> &rsaquo; Password Generator
        </div>

        <h2>Password Generator</h2>
        <p class="subtitle">Create strong, unique passwords for your accounts.</p>

        <div class="generator-card">
            <div class="password-display">
                <div class="pw-text" id="generatedPassword">Click "Generate" to create a password</div>
                <button class="btn-copy" id="btnCopy" onclick="copyPassword()">Copy</button>
            </div>

            <div class="controls">
                <div class="control-row">
                    <label for="pwLength">Length:</label>
                    <input type="range" id="pwLength" min="8" max="64" value="20" oninput="document.getElementById('lengthValue').textContent = this.value">
                    <span class="range-value" id="lengthValue">20</span>
                </div>

                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="useUppercase" checked>
                        <label for="useUppercase">Uppercase (A-Z)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="useLowercase" checked>
                        <label for="useLowercase">Lowercase (a-z)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="useDigits" checked>
                        <label for="useDigits">Digits (0-9)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="useSymbols" checked>
                        <label for="useSymbols">Symbols (!@#$...)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="excludeAmbiguous">
                        <label for="excludeAmbiguous">Exclude ambiguous (0, O, l, 1)</label>
                    </div>
                </div>
            </div>

            <button class="btn-generate" onclick="generatePassword()">Generate Password</button>

            <div class="strength-meter" id="strengthMeter" style="display: none;">
                <div class="meter-label">Estimated Strength</div>
                <div class="meter-track">
                    <div class="meter-fill" id="meterFill"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>
        </div>
    </div>

    <script>
        function generatePassword() {
            var length = document.getElementById('pwLength').value;
            var uppercase = document.getElementById('useUppercase').checked ? '1' : '0';
            var lowercase = document.getElementById('useLowercase').checked ? '1' : '0';
            var digits = document.getElementById('useDigits').checked ? '1' : '0';
            var symbols = document.getElementById('useSymbols').checked ? '1' : '0';
            var excludeAmbiguous = document.getElementById('excludeAmbiguous').checked ? '1' : '0';

            var url = '{{ url_for("password-managers.api_generate_password") }}' +
                '?length=' + length +
                '&uppercase=' + uppercase +
                '&lowercase=' + lowercase +
                '&digits=' + digits +
                '&symbols=' + symbols +
                '&exclude_ambiguous=' + excludeAmbiguous;

            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    document.getElementById('generatedPassword').textContent = data.password;
                    updateStrengthMeter(data.password);
                });
        }

        function copyPassword() {
            var pw = document.getElementById('generatedPassword').textContent;
            if (pw && pw !== 'Click "Generate" to create a password') {
                navigator.clipboard.writeText(pw).then(function() {
                    var btn = document.getElementById('btnCopy');
                    btn.textContent = 'Copied!';
                    setTimeout(function() { btn.textContent = 'Copy'; }, 2000);
                });
                }
        }

        function updateStrengthMeter(password) {
            var meter = document.getElementById('strengthMeter');
            var fill = document.getElementById('meterFill');
            var text = document.getElementById('strengthText');
            meter.style.display = 'block';

            var score = 0;
            if (password.length >= 12) score += 25;
            if (password.length >= 20) score += 15;
            if (/[A-Z]/.test(password)) score += 15;
            if (/[a-z]/.test(password)) score += 15;
            if (/[0-9]/.test(password)) score += 15;
            if (/[^A-Za-z0-9]/.test(password)) score += 15;

            var label, color;
            if (score >= 85) { label = 'Excellent'; color = '#34d399'; }
            else if (score >= 65) { label = 'Strong'; color = '#60a5fa'; }
            else if (score >= 45) { label = 'Fair'; color = '#fbbf24'; }
            else { label = 'Weak'; color = '#f87171'; }

            fill.style.width = score + '%';
            fill.style.background = color;
            text.textContent = label + ' (' + password.length + ' characters)';
            text.style.color = color;
        }
    </script>
</body>
</html>
