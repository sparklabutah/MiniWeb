# Canonical macro registry — the SINGLE source of truth for macro
# identity, metadata, difficulty and retired-name aliases.
# Consumers derive from this: annotation/macros.py, macro_difficulty,
# _MACRO_DESCRIPTIONS/_MACRO_ALIASES/_canon in annotation/app.py.
# Per-site UI locations stay in annotation/macro_locations.py (validated
# against this registry). Edit this file directly; regenerate the docs
# sheet with scripts/export_macro_sheet.py.
# Also defines: archetypes (Layer 1 commit types), interaction_primitives
# (Layer 2, ranked easy->hard), and each macro's archetype. See docs/macro_taxonomy.md.
categories:
  spatial_control: 5.0
  reasoning: 8.0
  state_change: 4.0
  media: 4.0
  text_input: 1.5
  simple_select: 1.0
  trivial: 0.5
archetypes:
  form_write:
    collapses_to: submit_form
    description: author-and-commit content via a form
  query:
    collapses_to: filter_by_query
    description: refine/reorder a view (filter/sort/search)
  one_shot_mutate:
    collapses_to: delete_from_table
    description: act on an existing item + confirm
  boolean_mutate:
    collapses_to: toggle_status
    description: toggle a boolean state (follow/save/subscribe/react/block)
  read_reason:
    collapses_to: null
    description: extract/compute/compare/verify an answer
  media:
    collapses_to: null
    description: play or record media
  navigate:
    collapses_to: navigate_by_route
    description: navigate between pages (not sampled)
  input_primitive:
    collapses_to: null
    description: select a value with no standalone committed outcome
interaction_primitives:
- name: link
  desc: click a labelled link
- name: button
  desc: click a labelled button
- name: radio
  desc: pick one of a few visible options
- name: chip
  desc: click a tag/chip
- name: checkbox
  desc: small target + read checked state
- name: dropdown
  desc: open an occluding list, locate+click an option
- name: toggle
  desc: small switch + read on/off state
- name: text-field
  desc: locate a field and type content
- name: table-cell
  desc: localize a cell in a grid
- name: number
  desc: numeric stepper/spinner
- name: date-range
  desc: navigate a calendar grid
- name: slider
  desc: estimate a pixel position for a continuous value
- name: drag
  desc: drag gesture (reorder, div-drawn slider)
