# The paper's runs: one named list per configuration and benchmark (paths relative to the repo root; one run
# per entry, reported as the mean over the list). Read by the figure scripts (rq2, rq3, chain, teaser, review/) and
# by reproduce.py, which says how each run is made (experiments/paper.yaml).

benchmarks:
  single:   {kind: miniweb,    head: "Single\\\\primitives", primitives: well_covered}
  heldout:  {kind: miniweb,    head: "Multi-step\\\\tasks"}
  wa:       {kind: webarena,   head: "WebArena-\\\\Lite"}
  wv:       {kind: webvoyager, head: "Web-\\\\Voyager", tasks: data/webmix/webvoyager/WebVoyager_reduced_536.jsonl}
  om2w:     {kind: om2w,       head: "Online-\\\\Mind2Web", tasks: data/webmix/om2w/Online_Mind2Web_reduced_280.json}

runs:                                  # named run lists, reused by several rows
  base:      {single: [data/webmix/eval/val2_rq2_base, data/webmix/eval/val2_rq2_base_s2, data/webmix/eval/val2_rq2_base_s3],
              heldout: [data/webmix/eval/human_base, data/webmix/eval/seeds/base_s2, data/webmix/eval/seeds/base_s3],
              wa: [data/webmix/wa/seeds/base_s1, data/webmix/wa/seeds/base_s2, data/webmix/wa/seeds/base_s3],
              wv: [data/webmix/om2w/runs/granite/webvoyager100_base_wvjudge],
              om2w: [data/webmix/om2w/runs/granite/om2w100_base_webjudge]}
  pooled:    {single: [data/webmix/eval/val2_rq2_pooled, data/webmix/eval/val2_rq2_pooled_s2, data/webmix/eval/val2_rq2_pooled_s3],
              heldout: [data/webmix/eval/human_pooled_v4, data/webmix/eval/seeds/pooled_v4_s2, data/webmix/eval/seeds/pooled_v4_s3],
              wa: [data/webmix/wa/seeds/single_pooled_s1, data/webmix/wa/seeds/single_pooled_s2, data/webmix/wa/seeds/single_pooled_s3],
              wv: [data/webmix/om2w/runs/granite/webvoyager100_single_pooled_wvjudge],
              om2w: [data/webmix/om2w/runs/granite/om2w100_single_pooled_webjudge]}
  planner:   {single: [data/webmix/eval/val2_rq2_planner_base, data/webmix/eval/val2_rq2_planner_base_s2,
                       data/webmix/eval/val2_rq2_planner_base_s3],
              heldout: [data/webmix/eval/seeds/pagent_v6_baseexec_s1, data/webmix/eval/seeds/pagent_v6_baseexec_s2,
                        data/webmix/eval/seeds/pagent_v6_baseexec_s3],
              wa: [data/webmix/wa/seeds/agent_base_s1, data/webmix/wa/seeds/agent_base_s2, data/webmix/wa/seeds/agent_base_s3],
              wv: [data/webmix/om2w/runs/granite/webvoyager100_agent_planner_base_wvjudge],
              om2w: [data/webmix/om2w/runs/granite/om2w100_agent_planner_base_webjudge]}
  planner_pooled: {single: [data/webmix/eval/val2_pagent_pooled_s1, data/webmix/eval/val2_pagent_pooled_s2, data/webmix/eval/val2_pagent_pooled_s3],
                  heldout: [data/webmix/eval/pagent_pooled_s1, data/webmix/eval/pagent_pooled_s2, data/webmix/eval/pagent_pooled_s3],
                  wa: [data/webmix/wa/seeds/agent_pooled31k_s1, data/webmix/wa/seeds/agent_pooled31k_s2, data/webmix/wa/seeds/agent_pooled31k_s3],
                  wv: [data/webmix/om2w/runs/granite/webvoyager100_agent_pooled31k_wvjudge],
                  om2w: [data/webmix/om2w/runs/granite/om2w100_agent_pooled31k_webjudge]}
  agent:     {single: [data/webmix/eval/val2_rq2_planner_v5, data/webmix/eval/val2_rq2_planner_v5_s2,
                       data/webmix/eval/val2_rq2_planner_v5_s3],
              heldout: [data/webmix/eval/seeds/pagent_v6_v5b_s1, data/webmix/eval/seeds/pagent_v6_v5b_s2,
                        data/webmix/eval/seeds/pagent_v6_v5b_s3],
              wa: [data/webmix/wa/seeds/agent_v5b_s1, data/webmix/wa/seeds/agent_v5b_s2, data/webmix/wa/seeds/agent_v5b_s3],
              wv: [data/webmix/om2w/runs/granite/webvoyager100_agent_v5bspec_wvjudge],
              om2w: [data/webmix/om2w/runs/granite/om2w100_agent_v5bspec_webjudge]}
  balanced:  {single: [data/webmix/eval/val2_pagent_balanced],
              heldout: [data/webmix/eval/seeds/pagent_balanced_s1, data/webmix/eval/seeds/pagent_balanced_s2,
                        data/webmix/eval/seeds/pagent_balanced_s3]}
  skewed:    {single: [data/webmix/eval/val2_pagent_skewed],
              heldout: [data/webmix/eval/seeds/pagent_skewed_s1, data/webmix/eval/seeds/pagent_skewed_s2,
                        data/webmix/eval/seeds/pagent_skewed_s3],
              wa: [data/webmix/wa/seeds/agent_skewed_s1, data/webmix/wa/seeds/agent_skewed_s2]}
  fara:      {single: [data/webmix/eval/val2_rq2_fara_base_s1, data/webmix/eval/val2_rq2_fara_base_s2,
                       data/webmix/eval/val2_rq2_fara_base_s3],
              heldout: [data/webmix/eval/rq2_fara_base_s2, data/webmix/eval/rq2_fara_base_s3]}
  fara_webatoms: {single: [data/webmix/eval/val2_rq2_fara_pooled_s1],
                  heldout: [data/webmix/eval/rq2_fara_pooled_s1, data/webmix/eval/rq2_fara_pooled_s2,
                            data/webmix/eval/rq2_fara_pooled_s3]}
