# Supplement tables and gallery (make_supp.py). Counts come from the human tasks (data/annotations/*/*/task.json,
# required tags only), the generated pool (datagen.viewer kept rows) and data/macro_locations.yaml.

out_dir: docs/figures/supp                    # reproduce.py figures copies the tables to <paper>/tables/
figures_dir: docs/figures/supp/figures        # screenshots are copied here (sites/, annotation/), then to <paper>/figures/

primitives:
  # the paper's training pool (Gen. column): the 3,128 generated trajectories of the 27.6K-step set. data/webmix/replay_v4
  # later also received the 7K scaling point's trajectories, so the pool is this id list, not that directory.
  pool_ids: experiments/pools/pool3k_plain_ids.txt
  # the primitives listed are the well-covered set of docs/figures/common/results.py (MIN_INSTANCES)
  family_names: {"Reasoning base": "Reasoning"}

operations:
  min_instances: 15         # same cut as the RQ1 figure (rq1_config.yaml)

gallery:
  shots: docs/figures/site_gallery/shots       # from docs/figures/site_gallery/capture.py
  annotation: docs/figures/site_gallery/annotation
  per_row: 3
