# The paper's four-panel results row (make_results_row.py), 2026-10-06 (user: "merge fig 7 and 8 into a row of 4
# plots"). The runs are the panels' own configs; this file holds the layout (inches, at the printed width) and labels.

out: docs/figures/rq3/results_row
configs:
  practice: docs/figures/rq2/rq2_config.yaml
  compose: docs/figures/rq3/rq3_config.yaml
  data: docs/figures/rq3/data_config.yaml
  scaling: docs/figures/scaling/scaling_wv_config.yaml

titles: ["(a) Practice", "(b) Composition", "(c) Data source", "(d) Scaling"]
short: {miniweb: MW, wa: WA, wv: WV, om2w: OM}          # benchmark names under the bars; the caption spells them out
legend:
  single_untrained: "Single agent, untrained"
  single_trained: "Single agent, trained"
  planner_untrained: "Planner, untrained"
  insta: "Planner + InSTA's task data"
  miniwebagent: "MiniWebAgent (planner + our data)"
  references: "Published agents (reference)"

layout: {left: 0.44, gap: 0.14, gap_d: 0.42, right: 0.04, title_h: 0.3, bottom: 0.5}   # four square panels share
                                                                                         # the rest of the width

# Panel (d) is narrower than scaling_wv's own figure: where its value labels go (overrides of its panel config).
# The untrained value above its dashed line, under our rising curve (the legend names the line); the published curves'
# names stacked in the empty lower right, right-aligned at 2.7M steps (label_dx/label_dy: from each curve's last point).
scaling_panel:
  untrained_label: {text: "{:.1f}", x: 12000, above: true}
reference_labels:
  Fara-7B: {label_at: 2, label_dx: 1.42, label_dy: -0.65, ha: right}
  MolmoWeb: {label_at: 2, label_dx: 2.55, label_dy: -0.654, ha: right}
