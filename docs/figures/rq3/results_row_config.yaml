# Paper Fig. 7 (make_results_row.py), 2026-10-06 (user: Fig. 7 keeps practice and scaling; the benchmark comparison is
# Tab. 3). The runs are the panels' own configs; this file holds the layout (inches, at the printed width) and labels.

out: docs/figures/rq3/results_row
configs:
  practice: docs/figures/rq2/rq2_config.yaml
  compose: docs/figures/rq3/rq3_config.yaml
  data: docs/figures/rq3/data_config.yaml
  scaling: docs/figures/scaling/scaling_wv_config.yaml

titles: ["(a) Practice", "(b) Scaling"]
legend:
  single_untrained: "Single agent, untrained"
  single_trained: "Single agent, trained"
  planner_untrained: "Planner, untrained"
  insta: "Planner + InSTA data"
  ours: "Planner + our data"
  references: "Published curves"

layout: {left: 0.4, gap: 0.38, right: 0.06, title_h: 0.28, bottom: 0.58}   # two square panels share the rest

# Panel (b) at this width: values on the best point (left of it, under the title) and InSTA's only; the dashed line
# without its value (the legend names it); the published curves marked by their logos (the caption names them),
# Fara-7B's above its last point, MolmoWeb's below its last one.
scaling_panel:
  untrained_label: {text: null}
  value_labels: ["7K"]
  label_at: {"7K": {dx: 0.77, dy: 0, ha: right, va: center}}
reference_labels:
  Fara-7B: {logo_at: [1900000, 78.5]}
  MolmoWeb: {logo_at: [1060000, 61.5]}
