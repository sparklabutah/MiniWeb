# The src/ layout (2026-10-08, to match the paper): src/miniweb (benchmark), src/miniwebgen (data generation),
# src/miniwebagent (planner + trained executor), src/helpers (shared utilities); scripts/ holds the paper's entry
# points (reproduce.py, paper.yaml). `pip install -e .` puts src/ on the path, or set PYTHONPATH=src.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "miniweb"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
