<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MiniWeb Console</title>
<style>
  :root {
    --bg: #1c1c1c; --panel: #202020; --raise: #272727; --raise2: #2e2e2e; --line: rgba(255,255,255,.08);
    --line2: rgba(255,255,255,.14); --ink: #ececec; --ink2: #a8a8a8; --ink3: #737373;
    --orange: linear-gradient(135deg, #ffa24a 0%, #f47a35 50%, #e4552c 100%);
    --red: #ff6b5e; --green: #6fdc95;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* the grid lives on #app, not body: extensions inject elements into body, and a grid on body
     lets them take a cell and push the panels around */
  #app { height: 100%; display: grid; grid-template-columns: minmax(420px, 34%) minmax(0, 1fr);
         grid-template-rows: minmax(0, 1fr); }
  #left { grid-area: 1 / 1; } #right { grid-area: 1 / 2; }
  body {
    margin: 0; color: var(--ink);
    font: 14.5px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
    letter-spacing: -.005em; -webkit-font-smoothing: antialiased;
    background: radial-gradient(140% 55% at 25% 115%, #6a2e1c 0%, rgba(106,46,28,.45) 30%, transparent 62%), var(--bg);
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { border: 0; background: none; cursor: pointer; border-radius: 9px; padding: 7px 12px; color: var(--ink);
           transition: background .15s, opacity .15s, transform .08s; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.07); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: default; }
  input, select { width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 10px;
                  padding: 9px 12px; outline: none; }
  input:focus, select:focus { border-color: var(--line2); }
  select option { background: #262626; }
  [hidden] { display: none !important; }
  ::placeholder { color: var(--ink3); }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 8px; }

  /* ── left ── */
  #left { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  #left.empty { overflow-y: auto; }
  #dock, #examples, #list { min-width: 0; }
  #top { display: flex; align-items: center; gap: 10px; padding: 16px 22px; }
  #top .logo { width: 22px; height: 22px; border-radius: 7px; background: var(--orange); }
  #top b { font-weight: 600; }
  #meta { color: var(--ink3); font-size: 12.5px; margin-left: auto; text-align: right; }
  #body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 22px; }
  #welcome { padding: 6vh 0 18px; }
  #welcome h1 { margin: 0; font: 500 30px/1.2 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; }
  #welcome p { margin: 8px 0 0; color: var(--ink2); }
  #notices { display: grid; gap: 6px; margin-top: 14px; }
  #notices div { font-size: 12.5px; color: var(--ink3); text-align: left; }
  #notices .error { color: #ffb27a; }
  #chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px; }
  #left.empty #chat { display: none; }
  #left:not(.empty) #welcome { display: none; }

  .msg { max-width: 88%; white-space: pre-wrap; word-wrap: break-word; animation: rise .2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .user { align-self: flex-end; background: var(--raise2); padding: 9px 14px; border-radius: 16px 16px 4px 16px; }
  .agent { align-self: flex-start; color: #d9d9d9; padding: 2px 2px 2px 12px; border-left: 2px solid #3a3a3a; }
  .k { display: block; font-size: 11px; color: var(--ink3); letter-spacing: .03em; margin-bottom: 1px; }
  .system { align-self: center; color: var(--ink3); font-size: 12px; text-align: center; }
  .task { align-self: stretch; max-width: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 12px 14px; margin-top: 8px; }
  .takeover, .record { align-self: stretch; max-width: none; border-radius: 12px; padding: 10px 14px;
                       background: rgba(255,107,94,.1); color: #ff9b91; border: 1px solid rgba(255,107,94,.18); }
  .done { align-self: flex-start; background: rgba(111,220,149,.08); color: #a6ebbd; padding: 9px 14px;
          border-radius: 16px 16px 16px 4px; border: 1px solid rgba(111,220,149,.16); }
  .result { align-self: stretch; max-width: none; border-radius: 12px; padding: 10px 14px; font-weight: 500; text-align: center; }
  .result.pass { background: rgba(111,220,149,.1); color: var(--green); }
  .result.fail { background: rgba(255,107,94,.1); color: var(--red); }
  .error { align-self: stretch; max-width: none; border-radius: 12px; padding: 10px 14px;
           background: rgba(255,162,74,.1); color: #ffb27a; border: 1px solid rgba(255,162,74,.18); }

  /* composer, hint, handback */
  #dock { padding: 10px 22px 18px; display: grid; gap: 10px; }
  #left.empty #dock { padding-top: 0; }
  #left.empty #body { flex: 0 0 auto; }
  #hintbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 10px 9px 14px; border-radius: 12px;
             background: var(--orange); color: #fff; box-shadow: 0 8px 26px rgba(228,85,44,.25); }
  #hint { flex: 1; min-width: 160px; font-size: 13px; font-weight: 500; }
  #hintbar button { background: rgba(255,255,255,.2); color: #fff; padding: 5px 12px; font-size: 13px; font-weight: 500; }
  #hintbar button:hover { background: rgba(255,255,255,.3); }
  #hintbar #takeover, #hintbar #accept { background: #fff; color: #b8381a; font-weight: 600; }
  #hintbar #accept { color: #1f7a45; }
  #handback { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
  #handback .row { display: flex; gap: 8px; }
  #finish { background: var(--ink); color: #111; font-weight: 600; flex: 1; }
  #finish:hover { background: #fff !important; }
  #giveup { border: 1px solid var(--line2); }
  #composer { background: var(--raise); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 12px 8px 16px;
              transition: border .15s, box-shadow .15s; position: relative; }
  #composer:focus-within { border-color: rgba(255,255,255,.24); box-shadow: 0 0 0 4px rgba(255,255,255,.03); }
  #text { width: 100%; border: 0; outline: none; background: transparent; resize: none; height: 46px; max-height: 160px;
          font-size: 15px; padding: 0; }
  .bar { display: flex; align-items: center; gap: 4px; margin-top: 6px; margin-left: -6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; color: #cfcfcf; padding: 6px 9px; font-size: 13.5px; }
  .chip svg { width: 15px; height: 15px; flex: none; }
  .chip .caret { color: var(--ink3); font-size: 10px; }
  #model { color: var(--ink2); cursor: default; }
  #model:hover { background: none; }
  .spacer { flex: 1; }
  #record { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; color: #cfcfcf; font-size: 13.5px; }
  #record .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: none; }
  #record.on { background: rgba(255,107,94,.16); color: #ff9b91; }
  #record.on .dot, #record.auto .dot { animation: pulse 1.1s ease-in-out infinite; }
  #record.auto { color: #ff9b91; opacity: 1; }
  @keyframes pulse { 50% { opacity: .25; } }
  #send { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: grid; place-items: center;
          background: var(--raise2); color: var(--ink3); }
  #send.ready { background: var(--ink); color: #111; }
  #send svg { width: 15px; height: 15px; }
  #startpop { position: absolute; left: 10px; right: 10px; bottom: calc(100% + 8px); background: #2a2a2a;
              border: 1px solid var(--line2); border-radius: 12px; padding: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
  #startpop label { display: block; font-size: 12px; color: var(--ink3); margin: 0 0 6px 2px; }

  /* examples */
  #examples h3 { margin: 8px 0 10px; font-weight: 400; font-size: 14px; color: var(--ink2); display: flex; align-items: center; gap: 10px; }
  #examples h3 input { width: 180px; margin-left: auto; padding: 5px 10px; font-size: 12.5px; }
  #list { display: grid; grid-template-columns: 1fr; gap: 8px; }
  #left:not(.empty) #list { display: flex; overflow-x: auto; max-height: none; padding-bottom: 4px; }
  #left:not(.empty) .card { flex: 0 0 240px; }
  .card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
  .card:hover { background: #252525 !important; border-color: var(--line2); }
  .card .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink); }
  .card .m { margin-top: 4px; font-size: 12px; color: var(--ink3); }
  #footer { display: flex; justify-content: flex-end; }
  #end { color: var(--ink3); font-size: 12.5px; padding: 4px 8px; }

  /* ── right: the browser ── */
  #right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #tools { display: flex; gap: 6px; align-items: center; padding: 12px 18px; }
  #tools .nav { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; color: var(--ink2); font-size: 18px; }
  #urlwrap { flex: 1; display: flex; align-items: center; background: var(--raise); border: 1px solid var(--line);
             border-radius: 10px; height: 34px; padding: 0 4px 0 12px; }
  #url { border: 0; background: transparent; padding: 0; height: 100%; text-align: center; color: var(--ink2); }
  #url:focus { text-align: left; color: var(--ink); }
  #urlwrap.typing { border-color: #ff7f27; box-shadow: 0 0 0 3px rgba(255,127,39,.18); }
  #urlwrap.typing #url { text-align: left; color: var(--ink); }
  #go { padding: 3px 10px; font-size: 12px; color: var(--ink2); }
  #pill { font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: var(--raise);
          color: var(--ink2); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
          border: 1px solid var(--line); }
  #pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); }
  #pill.agent { color: #ffbf86; } #pill.agent::before { background: #ff9a3c; animation: pulse 1.2s infinite; }
  #pill.human, #pill.recording { color: #ff9b91; } #pill.human::before, #pill.recording::before { background: var(--red); animation: pulse 1s infinite; }
  #pill.review { color: var(--green); } #pill.review::before { background: var(--green); }
  #status { color: var(--ink3); font-size: 12px; max-width: 28%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #keybar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 18px 6px; padding: 9px 10px 9px 14px;
            border-radius: 12px; background: var(--raise); border: 1px solid rgba(255,155,145,.35); }
  #keybar[hidden] { display: none; }
  #keybar .msg { font-size: 13px; color: #ff9b91; white-space: nowrap; }
  #key { flex: 1; min-width: 180px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line2);
         background: var(--bg); color: var(--ink); font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  #keybar label { font-size: 12.5px; color: var(--ink2); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  #usekey { background: var(--ink); color: #111; font-weight: 600; padding: 5px 12px; font-size: 13px; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 6px 22px 22px; min-height: 0; }
  #view { position: relative; max-width: 100%; max-height: 100%; outline: none; border-radius: 12px; transition: box-shadow .2s; }
  #view img { display: block; max-width: 100%; max-height: calc(100vh - 86px); border-radius: 12px; background: #fff;
              box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.45); user-select: none; -webkit-user-drag: none; }
  #view.locked img { cursor: not-allowed; }
  #view.live { box-shadow: 0 0 0 2px var(--red), 0 0 0 7px rgba(255,107,94,.18); }
</style>
</head>
<body>
<div id="app">
<section id="left" class="empty">
  <div id="top"><span class="logo"></span><b>MiniWeb</b><span id="meta">connecting…</span></div>
  <div id="body">
    <div id="welcome">
      <h1>What should the agent do today?</h1>
      <p>Give it a task and watch it work. Take over the moment it goes wrong.</p>
      <div id="notices"></div>
    </div>
    <div id="chat"></div>
  </div>
  <div id="dock">
    <div id="hintbar">
      <span id="hint">Type a task below to start.</span>
      <button id="accept" hidden>Correct</button>
      <button id="reject" hidden>Wrong, I'll take over</button>
      <button id="takeover" hidden>Take over</button>
    </div>
    <div id="handback" hidden>
      <input id="answer" placeholder="Answer, if the task asks a question (optional)">
      <div class="row"><select id="etype"><option value="">What went wrong? (optional)</option></select>
        <select id="part"><option value="">Which part? (optional)</option></select></div>
      <input id="note" placeholder="Note on the agent's mistake (optional)">
      <div class="row"><button id="finish">Done, task finished</button><button id="giveup">Give up</button></div>
    </div>
    <div id="composer">
      <div id="startpop" hidden>
        <label id="startlabel">Start page</label>
        <input id="starturl" hidden placeholder="google.com" spellcheck="false">
        <select id="site" hidden></select>
      </div>
      <textarea id="text" placeholder="Describe a task for the agent…"></textarea>
      <div class="bar">
        <button id="startchip" class="chip" title="Where the task starts">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/>
            <path d="M1.8 8h12.4M8 1.8c1.8 1.9 2.6 3.9 2.6 6.2S9.8 12.3 8 14.2C6.2 12.3 5.4 10.3 5.4 8S6.2 3.7 8 1.8z"/></svg>
          <span id="startname">start page</span><span class="caret">▾</span></button>
        <span class="spacer"></span>
        <span id="model" class="chip" title="The agent's model"></span>
        <button id="record" title="Record yourself doing a task in the browser"><span class="dot"></span><span id="reclabel">Record</span></button>
        <button id="send" title="Send"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
      </div>
    </div>
    <div id="examples" hidden>
      <h3><span id="exlabel">Example tasks</span><input id="filter" hidden placeholder="Filter"></h3>
      <div id="list"></div>
    </div>
    <div id="footer"><button id="end" title="Hand today's episodes to the night">End day</button></div>
  </div>
</section>
<section id="right">
  <div id="tools">
    <span id="pill">Idle</span>
    <button id="back" class="nav" disabled title="Back">‹</button><button id="reload" class="nav" disabled title="Reload">↻</button>
    <div id="urlwrap"><input id="url" readonly spellcheck="false"><button id="go" disabled>Go</button></div>
    <span id="status"></span>
  </div>
  <form id="keybar" hidden autocomplete="off">
    <span class="msg">The agent needs an OpenAI API key</span>
    <input id="key" type="password" placeholder="sk-…" spellcheck="false" autocomplete="off">
    <label title="Write it to the repo's .env (gitignored) so the next console starts with it"><input id="savekey" type="checkbox" checked>Save to .env</label>
    <button id="usekey" type="submit">Use key</button>
  </form>
  <div id="stage"><div id="view" class="locked" tabindex="0"><img id="screen" alt="the agent's browser" draggable="false"></div></div>
</section>
</div>
<script>
const $ = id => document.getElementById(id);
let since = 0, status = "idle", frame = -1, info = null, episode = null, queue = Promise.resolve(), browser = false;
let started = false;            // a task or recording has begun: the conversation replaces the welcome
// the browser takes your input after a takeover, while you record, and (real web) whenever no task is running
const canAct = () => status === "human" || status === "recording" || (status === "idle" && browser);
const STATUS = {idle: "Idle", starting: "Starting", agent: "Agent working", review: "Agent says done",
                human: "You have control", grading: "Saving", ended: "Day ended", recording: "Recording"};

async function post(name, body = {}) {
  const r = await fetch("/api/" + name, {method: "POST", headers: {"Content-Type": "application/json", "X-Console": "1"},
                                          body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $("status").textContent = j.error || r.statusText; throw new Error(j.error); }
  $("status").textContent = "";
  return j;
}

function bubble(e) {
  if (!started && ["task", "user", "record"].includes(e.kind)) { started = true; $("left").classList.remove("empty"); }
  const d = document.createElement("div");
  if (!started && (e.kind === "system" || e.kind === "error")) {        // before the first task: quiet notices
    d.className = e.kind; d.textContent = e.text; $("notices").append(d); return;
  }
  d.className = "msg " + e.kind;
  if (e.kind === "agent") { d.innerHTML = `<span class="k">STEP ${e.step}</span>`; d.append(e.text); }
  else if (e.kind === "task") { d.innerHTML = `<span class="k">TASK · ${e.site}</span>`; d.append(e.text); }
  else if (e.kind === "done") d.textContent = "I'm done." + (e.answer ? "\nAnswer: " + e.answer : "") + "\nIs it right?";
  else if (e.kind === "result") { d.classList.add(e.passed ? "pass" : "fail"); d.textContent = e.text; }
  else d.textContent = e.text;
  $("chat").append(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function render() {
  const live = status === "human" || status === "recording", free = canAct(), idle = status === "idle";
  $("pill").textContent = STATUS[status] || status;
  $("pill").className = status;
  $("view").className = live ? "live" : free ? "" : "locked";
  $("takeover").hidden = status !== "agent";
  $("accept").hidden = $("reject").hidden = status !== "review";
  $("handback").hidden = status !== "human";
  $("end").hidden = !idle;
  for (const id of ["back", "reload", "go"]) $(id).disabled = !free;
  $("url").readOnly = !free;
  $("startchip").hidden = !idle;
  if (!idle) $("startpop").hidden = true;
  $("examples").hidden = !(idle && info && info.tasks.length);
  $("send").disabled = !["idle", "agent", "review", "human", "recording"].includes(status);
  const auto = ["agent", "review", "human", "grading", "starting"].includes(status);
  $("record").className = status === "recording" ? "on" : auto ? "auto" : "";
  $("record").disabled = !(idle || status === "recording");
  $("reclabel").textContent = status === "recording" ? "Stop & save" : auto ? "Recording" : "Record";
  $("text").placeholder = {idle: "Describe a task for the agent…", agent: "Message the agent…",
                           review: "Or tell the agent what's still wrong…", human: "Note for the log…",
                           recording: "What are you showing? (saved with the recording)"}[status] || "";
  $("hint").textContent = {
    idle: browser ? "The browser on the right is yours. Give the agent a task, or press Record to show one."
                  : "Give the agent a task, or pick an example below.",
    starting: "Starting the agent…",
    agent: "Watch it work. Take over the moment it goes wrong.",
    review: "The agent says it's done. Check the page, then mark it.",
    human: "You have control and everything is recorded. Finish, then press Done.",
    grading: "Saving the episode…",
    recording: "Recording you. Do the task in the browser, then Stop & save.",
    ended: "Day ended. Run the night: python -m daynight.loop --config <out>/config.yaml --resume"}[status] || "";
  ready();
}

const ready = () => $("send").classList.toggle("ready", !!$("text").value.trim() || status === "recording");

let typing = null;          // the agent typing a URL into the address bar (cursor.py): shown letter by letter
function typeUrl(t) {
  typing = t; $("urlwrap").classList.add("typing");
  const per = Math.max(12, (t.ms - 150) / Math.max(1, t.url.length)); let i = 0;
  (function next() {
    if (typing !== t) return;
    $("url").value = t.url.slice(0, ++i);
    if (i < t.url.length) return setTimeout(next, per);
    setTimeout(() => { if (typing === t) { typing = null; $("urlwrap").classList.remove("typing"); } }, 900);
  })();
}

async function poll() {
  try {
    const s = await (await fetch("/api/events?since=" + since)).json();
    for (const e of s.events) bubble(e);
    since += s.events.length;
    if (s.status !== status || s.browser !== browser || JSON.stringify(s.episode) !== JSON.stringify(episode)) {
      if ((s.status === "human" || s.status === "recording") && status !== s.status) $("view").focus();
      status = s.status; episode = s.episode; browser = s.browser; render(); parts();
    }
    if (s.typing && (!typing || typing.n !== s.typing.n)) typeUrl(s.typing);
    else if (!typing && document.activeElement !== $("url")) $("url").value = s.url || "";
    if (s.screen_error && status === "agent") $("status").textContent = s.screen_error;
    if (s.frame !== frame) { frame = s.frame; $("screen").src = "/api/frame?n=" + frame; }
  } catch (err) { $("status").textContent = "Console not reachable"; }
  setTimeout(poll, 350);
}

function parts() {
  $("part").innerHTML = '<option value="">Which part? (optional)</option>';
  for (const m of (episode && episode.macros) || []) $("part").add(new Option(m.replaceAll("_", " "), m));
  $("part").hidden = !(episode && episode.macros && episode.macros.length);
}

function fillTasks() {
  const f = $("filter").value.toLowerCase();
  $("list").innerHTML = "";
  let n = 0;
  for (const t of info.tasks) {
    if (f && !`${t.site} ${t.instruction}`.toLowerCase().includes(f)) continue;
    if (++n > 40) break;
    const c = document.createElement("button");
    c.className = "card";
    c.innerHTML = `<div class="t"></div><div class="m"></div>`;
    c.querySelector(".t").textContent = t.instruction;
    c.querySelector(".m").textContent = t.site;
    c.onclick = () => post("run", {task_id: t.id});
    $("list").append(c);
  }
}

function startName() {
  if (info.start.kind === "url") {
    const v = $("starturl").value.trim();
    try { return new URL(v.includes("://") ? v : "https://" + v).host.replace(/^www\./, ""); } catch { return v || "start page"; }
  }
  return $("site").value || "site";
}

$("send").onclick = async () => {
  if (status === "recording") return $("record").click();
  const text = $("text").value.trim();
  if (!text) return;
  if (status === "idle") await post("run", {text, site: info.start.kind === "url" ? $("starturl").value : $("site").value});
  else await post("message", {text});
  $("text").value = ""; ready();
};
$("text").addEventListener("input", () => { ready(); $("text").style.height = "46px";
  $("text").style.height = Math.min(160, $("text").scrollHeight) + "px"; });
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });
$("startchip").onclick = () => { $("startpop").hidden = !$("startpop").hidden;
  if (!$("startpop").hidden) (info.start.kind === "url" ? $("starturl") : $("site")).focus(); };
$("starturl").addEventListener("input", () => $("startname").textContent = startName());
$("starturl").addEventListener("keydown", e => { if (e.key === "Enter") { $("startpop").hidden = true; $("text").focus(); } });
$("site").onchange = () => { $("startname").textContent = startName(); $("startpop").hidden = true; };
$("filter").oninput = fillTasks;
$("takeover").onclick = () => post("takeover");
$("reject").onclick = () => post("takeover");
$("accept").onclick = () => post("accept");
$("record").onclick = async () => {
  if (status === "idle") await post("record_start");
  else if (status === "recording") { await post("record_stop", {task: $("text").value.trim()}); $("text").value = ""; ready(); }
};
$("end").onclick = () => confirm("End the day and hand its episodes to the night?") && post("end");
function handback(passed) {
  post("done", {passed, answer: $("answer").value, note: $("note").value, error_type: $("etype").value, macro: $("part").value})
    .then(() => { for (const id of ["answer", "note"]) $(id).value = ""; $("etype").value = ""; });
}
$("finish").onclick = () => handback(true);
$("giveup").onclick = () => handback(false);
$("back").onclick = () => post("nav", {to: "back"});
$("reload").onclick = () => post("nav", {to: "reload"});
$("go").onclick = () => post("nav", {to: $("url").value});
$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

// ── your input into the browser, only when it is yours ──
function send(ev) { queue = queue.then(() => post("input", ev)).catch(() => {}); }
function pt(e) {
  const img = $("screen"), r = img.getBoundingClientRect();
  const w = img.naturalWidth || 1280, h = img.naturalHeight || 800;
  return {x: Math.round((e.clientX - r.left) * w / r.width), y: Math.round((e.clientY - r.top) * h / r.height)};
}
const mods = e => ({ctrl: e.ctrlKey, meta: e.metaKey, alt: e.altKey, shift: e.shiftKey});
let lastMove = 0;
const img = $("screen");
img.addEventListener("mousedown", e => { if (!canAct()) return; e.preventDefault(); $("view").focus();
  send({type: "down", ...pt(e), clicks: e.detail || 1, ...mods(e)}); });
img.addEventListener("mouseup", e => { if (canAct()) send({type: "up", ...pt(e), clicks: e.detail || 1, ...mods(e)}); });
img.addEventListener("mousemove", e => { if (!canAct()) return; const now = Date.now();
  if (now - lastMove < (e.buttons ? 30 : 120)) return; lastMove = now; send({type: "move", ...pt(e), buttons: e.buttons}); });
img.addEventListener("wheel", e => { if (!canAct()) return; e.preventDefault();
  send({type: "wheel", ...pt(e), dx: e.deltaX, dy: e.deltaY}); }, {passive: false});
img.addEventListener("contextmenu", e => e.preventDefault());
$("view").addEventListener("keydown", e => {
  if (!canAct() || ["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "v") return;      // the paste event sends the text
  e.preventDefault();
  send({type: "key", key: e.key, code: e.code, ...mods(e)});
});
$("view").addEventListener("paste", e => { if (!canAct()) return; e.preventDefault();
  send({type: "text", text: e.clipboardData.getData("text")}); });

$("keybar").addEventListener("submit", async e => {
  e.preventDefault();
  const key = $("key").value.trim();
  if (!key) return $("key").focus();
  try { await post("key", {key, save: $("savekey").checked}); $("key").value = ""; $("keybar").hidden = true; }
  catch (err) { $("key").select(); }
});

(async () => {
  info = await (await fetch("/api/info")).json();
  const world = info.mock ? "mock world" : info.backend === "realweb" ? "real web" : "MiniWeb";
  $("meta").textContent = `${info.name} · day ${info.day} · ${world}`;
  $("model").textContent = info.agent;
  for (const s of info.sites) $("site").add(new Option(s, s));
  for (const t of info.error_types) $("etype").add(new Option(t.replaceAll("_", " "), t));
  if (info.start.kind === "url") { $("starturl").hidden = false; $("starturl").value = info.start.default || ""; }
  else { $("site").hidden = false; $("startlabel").textContent = "Site"; }
  $("exlabel").textContent = info.backend === "realweb" ? "Example tasks" : "Annotated tasks · graded by their verifier";
  $("filter").hidden = info.tasks.length <= 8;
  $("startname").textContent = startName();
  $("keybar").hidden = !info.needs_key;
  fillTasks(); render(); parts(); poll();
})();
</script>
</body>
</html>
