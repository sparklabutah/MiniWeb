# The dry run: the whole loop on the mock world, in seconds, with no browser, server, GPU or API key.
# Its numbers only show that the loop works end to end; they are not results.
#
#   python -m daynight.loop --config daynight/configs/v1_mock.yaml
#   python -m daynight.metrics --config daynight/configs/v1_mock.yaml
name: v1_mock
model: mock
days: 4
tasks_per_day: 40
seed: 0
workers: 4

probe:
  enabled: true
  limit: 30

human:
  kind: simulated
  max_messages: 2

meta:
  weak_macros: 4

propose:
  trajectories_per_night: 80
  min_per_macro: 10
