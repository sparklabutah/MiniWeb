# The console on the real web: a browser-use agent on an OpenAI model works on live websites, shown live in the
# console, and you take over when it goes wrong. Needs browser-use + a Chromium and OPENAI_API_KEY (in .env).
#
#   python -m daynight.console --config daynight/configs/v1_realweb.yaml      # then open http://127.0.0.1:8390
name: v1_realweb
backend: realweb

realweb:
  model: gpt-5.5
  start_url: https://www.google.com
  max_steps: 30
  examples:
    - task: Find the weather forecast for Salt Lake City for tomorrow.
      url: https://www.weather.gov
    - task: Find the University of Utah's Kahlert School of Computing and open its faculty directory.
      url: https://www.cs.utah.edu
    - task: Search Wikipedia for "web agent" and report the first sentence of the article you land on.
      url: https://en.wikipedia.org
    - task: Find the GitHub repository sparklabutah/MiniWeb and report its description.
      url: https://github.com

probe:
  enabled: false
