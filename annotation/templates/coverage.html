<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Coverage - MiniWeb Annotation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #1e293b; padding: 1.5rem; }
        .header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .header h1 { font-size: 1.3rem; }
        .header a { color: #2563eb; text-decoration: none; font-size: .85rem; }
        .global-stats { display: flex; gap: 1.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
        .stat-box { background: #fff; border-radius: .5rem; padding: .8rem 1.2rem; box-shadow: 0 1px 2px rgba(0,0,0,.05); min-width: 140px; }
        .stat-box .val { font-size: 1.5rem; font-weight: 700; color: #1e293b; }
        .stat-box .label { font-size: .75rem; color: #64748b; }
        .controls { display: flex; gap: .6rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .controls input[type="text"] { padding: .4rem .6rem; border: 1px solid #cbd5e1; border-radius: .35rem; font-size: .85rem; width: 240px; }
        .controls label { font-size: .8rem; color: #475569; display: flex; align-items: center; gap: .3rem; cursor: pointer; }
        .site-card { background: #fff; border-radius: .5rem; padding: .9rem 1.1rem; margin-bottom: .6rem; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .site-head { display: flex; align-items: center; gap: .7rem; margin-bottom: .5rem; flex-wrap: wrap; }
        .site-head .name { font-weight: 700; font-size: .95rem; min-width: 200px; }
        .site-head .site-id { font-size: .72rem; color: #94a3b8; }
        .progress { flex: 1; min-width: 100px; max-width: 200px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .progress .fill { height: 100%; border-radius: 4px; transition: width .3s; }
        .fill-green { background: #16a34a; }
        .fill-yellow { background: #eab308; }
        .fill-red { background: #ef4444; }
        .site-head .tasks-info { font-size: .78rem; color: #475569; font-variant-numeric: tabular-nums; }
        .chain-row { display: flex; gap: .5rem; align-items: center; font-size: .75rem; color: #64748b; margin-bottom: .3rem; }
        .chain-bar { display: flex; gap: .15rem; }
        .chain-pip { width: 18px; height: 10px; border-radius: 2px; background: #e2e8f0; }
        .chain-pip.filled { background: #3b82f6; }
        .chain-label { min-width: 55px; }
        .chain-count { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
        .macro-row { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .3rem; }
        .macro-chip { font-size: .65rem; padding: .12rem .4rem; border-radius: .6rem; border: 1px solid transparent; }
        .macro-chip.covered { background: #dcfce7; color: #166534; border-color: #86efac; }
        .macro-chip.uncovered { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
        .site-card.complete { opacity: .6; }
        .empty { text-align: center; color: #94a3b8; padding: 2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Task Coverage</h1>
        <a href="{{ url_for('annotation.index') }}">&larr; Dashboard</a>
        <a href="{{ url_for('annotation.annotate') }}">Annotate</a>
    </div>
    <div class="global-stats" id="global-stats"></div>
    <div class="controls">
        <input type="text" id="search" placeholder="Filter sites..." oninput="render()">
        <label><input type="checkbox" id="hide-done" onchange="render()"> Hide complete sites</label>
        <label><input type="checkbox" id="show-macros" onchange="render()"> Show macro detail</label>
    </div>
    <div id="content"></div>

    <script>
    let DATA = null;

    function render() {
        if (!DATA) return;
        const q = document.getElementById('search').value.trim().toLowerCase();
        const hideDone = document.getElementById('hide-done').checked;
        const showMacros = document.getElementById('show-macros').checked;
        const el = document.getElementById('content');
        el.innerHTML = '';

        // Global stats
        const gs = document.getElementById('global-stats');
        gs.innerHTML = `
            <div class="stat-box"><div class="val">${DATA.total_tasks_done}</div><div class="label">Tasks Done</div></div>
            <div class="stat-box"><div class="val">${DATA.total_tasks_remaining}</div><div class="label">Tasks Remaining</div></div>
            <div class="stat-box"><div class="val">${DATA.sites_complete}/${DATA.total_sites}</div><div class="label">Sites Complete</div></div>
            <div class="stat-box"><div class="val">${DATA.macros_covered}/${DATA.macros_total}</div><div class="label">Macros Covered</div></div>
        `;

        // Sort: most remaining first
        const sites = Object.entries(DATA.sites)
            .filter(([sid, s]) => !q || sid.includes(q) || (s.name || '').toLowerCase().includes(q))
            .filter(([_, s]) => !hideDone || s.tasks_remaining > 0)
            .sort((a, b) => b[1].tasks_remaining - a[1].tasks_remaining);

        for (const [sid, s] of sites) {
            const card = document.createElement('div');
            const pct = s.tasks_target ? Math.round(100 * s.tasks_done / s.tasks_target) : 0;
            const fillClass = pct >= 100 ? 'fill-green' : pct >= 50 ? 'fill-yellow' : 'fill-red';
            card.className = 'site-card' + (s.tasks_remaining === 0 ? ' complete' : '');

            // Chain breakdown
            let chainHtml = '';
            for (const len of [1, 2, 3, 4]) {
                const done = (s.chain_counts[len] || 0);
                const target = (s.chain_targets[len] || 0);
                const remaining = (s.chain_remaining[len] || 0);
                let pips = '';
                for (let i = 0; i < target; i++) {
                    pips += '<span class="chain-pip ' + (i < done ? 'filled' : '') + '"></span>';
                }
                chainHtml += '<div class="chain-row">' +
                    '<span class="chain-label">len-' + len + ':</span>' +
                    '<div class="chain-bar">' + pips + '</div>' +
                    '<span class="chain-count">' + done + '/' + target + '</span>' +
                    (remaining > 0 ? '<span style="color:#ef4444;font-weight:600">need ' + remaining + '</span>' : '<span style="color:#16a34a">done</span>') +
                    '</div>';
            }

            // Macro chips
            let macroHtml = '';
            if (showMacros) {
                macroHtml = '<div class="macro-row">';
                for (const [m, info] of Object.entries(s.macros).sort((a,b) => a[0].localeCompare(b[0]))) {
                    const cls = info.covered ? 'covered' : 'uncovered';
                    macroHtml += '<span class="macro-chip ' + cls + '" title="' + m + ': ' + info.count + ' task(s)">' + m + (info.count ? ' \u00d7' + info.count : '') + '</span>';
                }
                macroHtml += '</div>';
            }

            card.innerHTML = `
                <div class="site-head">
                    <span class="name">${s.name}</span>
                    <span class="site-id">${sid}</span>
                    <div class="progress"><div class="fill ${fillClass}" style="width:${Math.min(pct, 100)}%"></div></div>
                    <span class="tasks-info">${s.tasks_done}/${s.tasks_target} tasks · ${s.covered_macros}/${s.total_macros} macros · ${s.tasks_remaining > 0 ? s.tasks_remaining + ' remaining' : 'complete'}</span>
                </div>
                ${chainHtml}
                ${macroHtml}`;
            el.appendChild(card);
        }
        if (!sites.length) el.innerHTML = '<div class="empty">No sites match.</div>';
    }

    fetch('{{ url_for("annotation.api_coverage_matrix") }}')
        .then(r => r.json())
        .then(d => { DATA = d; render(); })
        .catch(() => { document.getElementById('global-stats').innerHTML = '<div class="stat-box"><div class="val">Error</div><div class="label">Failed to load</div></div>'; });
    </script>
</body>
</html>
