<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Coverage - MiniWeb Annotation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #1e293b; padding: 1.5rem; }
        .header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .header h1 { font-size: 1.3rem; }
        .header a { color: #2563eb; text-decoration: none; font-size: .85rem; }
        .summary { font-size: .85rem; color: #475569; }
        .controls { display: flex; gap: .6rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .controls input[type="text"] { padding: .4rem .6rem; border: 1px solid #cbd5e1; border-radius: .35rem; font-size: .85rem; width: 240px; }
        .controls label { font-size: .8rem; color: #475569; display: flex; align-items: center; gap: .3rem; cursor: pointer; }
        .legend { display: flex; gap: .8rem; font-size: .75rem; color: #475569; margin-left: auto; }
        .legend .chip { pointer-events: none; }
        .site-card { background: #fff; border-radius: .5rem; padding: .9rem 1.1rem; margin-bottom: .7rem; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .site-head { display: flex; align-items: baseline; gap: .7rem; margin-bottom: .55rem; flex-wrap: wrap; }
        .site-head .name { font-weight: 700; font-size: .95rem; }
        .site-head .site-id { font-size: .72rem; color: #94a3b8; }
        .progress { flex: 1; min-width: 120px; max-width: 260px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .progress .fill { height: 100%; background: #16a34a; border-radius: 4px; }
        .site-head .count { font-size: .78rem; color: #475569; font-variant-numeric: tabular-nums; }
        .chips { display: flex; flex-wrap: wrap; gap: .3rem; }
        .chip { font-size: .7rem; padding: .18rem .5rem; border-radius: .8rem; border: 1px solid transparent; white-space: nowrap; }
        .chip.done { background: #dcfce7; color: #166534; border-color: #86efac; }
        .chip.multi-only { background: #fef9c3; color: #854d0e; border-color: #fde047; }
        .chip.todo { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
        .chip .n { font-weight: 700; margin-left: .2rem; }
        .empty { text-align: center; color: #94a3b8; padding: 2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Macro Coverage by Site</h1>
        <a href="{{ url_for('annotation.index') }}">&larr; Dashboard</a>
        <a href="{{ url_for('annotation.annotate') }}">Annotate</a>
        <span class="summary" id="summary">Loading…</span>
    </div>
    <div class="controls">
        <input type="text" id="site-search" placeholder="Filter sites…" oninput="render()">
        <label><input type="checkbox" id="hide-complete" onchange="render()"> Hide completed sites</label>
        <label><input type="checkbox" id="todo-only" onchange="render()"> Show only uncovered macros</label>
        <div class="legend">
            <span class="chip done">covered (single-site task)</span>
            <span class="chip multi-only">multi-site tasks only</span>
            <span class="chip todo">not yet annotated</span>
        </div>
    </div>
    <div id="sites"></div>

    <script>
    let MATRIX = {};

    function render() {
        const q = document.getElementById('site-search').value.trim().toLowerCase();
        const hideComplete = document.getElementById('hide-complete').checked;
        const todoOnly = document.getElementById('todo-only').checked;
        const container = document.getElementById('sites');
        container.innerHTML = '';

        // sort: least-covered first, then by name
        const sites = Object.entries(MATRIX)
            .filter(([sid, s]) => !q || sid.includes(q) || (s.name || '').toLowerCase().includes(q))
            .filter(([_, s]) => !hideComplete || s.covered < s.total)
            .sort((a, b) => (a[1].covered / (a[1].total || 1)) - (b[1].covered / (b[1].total || 1))
                            || a[1].name.localeCompare(b[1].name));

        let totCovered = 0, totMacros = 0;
        for (const s of Object.values(MATRIX)) { totCovered += s.covered; totMacros += s.total; }
        document.getElementById('summary').textContent =
            `Floor: ${totCovered}/${totMacros} (site, macro) pairs covered by single-site tasks across ${Object.keys(MATRIX).length} sites`;

        for (const [sid, s] of sites) {
            const card = document.createElement('div');
            card.className = 'site-card';
            const pct = s.total ? Math.round(100 * s.covered / s.total) : 0;
            let chips = '';
            for (const [m, c] of Object.entries(s.macros)) {
                const cls = c.single > 0 ? 'done' : (c.multi > 0 ? 'multi-only' : 'todo');
                if (todoOnly && cls === 'done') continue;
                const n = c.single + c.multi;
                chips += `<span class="chip ${cls}" title="${m}: ${c.single} single-site, ${c.multi} multi-site task(s)">${m}${n ? `<span class="n">×${n}</span>` : ''}</span>`;
            }
            card.innerHTML = `
                <div class="site-head">
                    <span class="name">${s.name}</span>
                    <span class="site-id">${sid}</span>
                    <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
                    <span class="count">${s.covered}/${s.total} macros covered</span>
                </div>
                <div class="chips">${chips || '<span class="empty">all covered 🎉</span>'}</div>`;
            container.appendChild(card);
        }
        if (!sites.length) container.innerHTML = '<div class="empty">No sites match.</div>';
    }

    fetch('{{ url_for("annotation.api_coverage_matrix") }}')
        .then(r => r.json())
        .then(data => { MATRIX = data; render(); })
        .catch(() => { document.getElementById('summary').textContent = 'Failed to load coverage.'; });
    </script>
</body>
</html>
