<!DOCTYPE html>
<html>
<head>
<title>MiniWeb — Verifier Review</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }
.top-bar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: .5rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.top-bar h1 { font-size: 1rem; font-weight: 700; }
.top-bar a { color: #2563eb; font-size: .85rem; text-decoration: none; }
.top-bar .count { color: #94a3b8; font-size: .78rem; }
.top-bar input, .top-bar select { font-size: .8rem; padding: .3rem .5rem; border: 1px solid #cbd5e1; border-radius: .3rem; }
.container { display: flex; height: calc(100vh - 46px); }
.sidebar { width: 340px; background: #fff; border-right: 1px solid #e2e8f0; overflow-y: auto; padding: .6rem; }
.main { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }

.task-card { padding: .45rem .55rem; border: 1px solid #e2e8f0; border-radius: .35rem; margin-bottom: .35rem; cursor: pointer; font-size: .78rem; }
.task-card:hover { background: #f1f5f9; }
.task-card.active { border-color: #2563eb; background: #eff6ff; }
.task-card .tc-id { font-weight: 600; color: #1e293b; }
.task-card .tc-site { display:inline-block; font-size:.62rem; background:#e2e8f0; color:#475569; padding:.05rem .35rem; border-radius:1rem; margin-right:.3rem; }
.task-card .tc-inst { color: #64748b; margin-top: .2rem; line-height:1.25; }
.task-card .tc-macros { margin-top:.25rem; }
.chip { display:inline-block; font-size:.6rem; padding:.05rem .35rem; border-radius:1rem; background:#eef2ff; color:#4338ca; margin:.05rem .12rem .05rem 0; }
.task-card .no-vf { color:#b91c1c; font-size:.62rem; font-weight:600; }

.detail-head { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:.5rem; }
.detail-head .did { font-size:1.05rem; font-weight:700; }
.detail-head .dsite { font-size:.68rem; background:#e2e8f0; color:#475569; padding:.1rem .5rem; border-radius:1rem; }
.instr { background:#fff; border:1px solid #e2e8f0; border-radius:.4rem; padding:.7rem .9rem; margin-bottom:.7rem; }
.instr .lbl { font-size:.65rem; text-transform:uppercase; color:#94a3b8; font-weight:700; letter-spacing:.03em; }
.instr .txt { font-size:.9rem; margin-top:.15rem; line-height:1.35; }
.instr .exp { margin-top:.4rem; font-size:.82rem; }
.instr .exp code { background:#f1f5f9; padding:.1rem .35rem; border-radius:.25rem; }

.macro-block { background:#fff; border:1px solid #e2e8f0; border-radius:.4rem; margin-bottom:.7rem; overflow:hidden; }
.macro-head { display:flex; align-items:center; gap:.5rem; padding:.5rem .8rem; background:#f8fafc; border-bottom:1px solid #e2e8f0; }
.macro-head .mname { font-weight:700; font-size:.9rem; font-family:monospace; }
.macro-body { padding:.6rem .8rem; }

.node { margin:.15rem 0; }
.group { border-left:2px solid #cbd5e1; padding-left:.7rem; margin:.25rem 0 .25rem .2rem; }
.group.or { border-left-color:#f59e0b; }
.group.and { border-left-color:#3b82f6; }
.group-lbl { font-size:.66rem; text-transform:uppercase; font-weight:700; letter-spacing:.04em; }
.group.or > .group-lbl { color:#b45309; }
.group.and > .group-lbl { color:#1d4ed8; }
.leaf { font-size:.82rem; padding:.18rem 0; line-height:1.4; }
.leaf .lt { display:inline-block; min-width:92px; font-size:.62rem; text-transform:uppercase; font-weight:700; color:#64748b; letter-spacing:.03em; }
.leaf code { background:#f1f5f9; padding:.05rem .3rem; border-radius:.2rem; font-size:.78rem; }
.any { color:#94a3b8; font-style:italic; }
.dim { color:#94a3b8; font-size:.72rem; }

.badge { display:inline-block; font-size:.65rem; padding:.1rem .45rem; border-radius:1rem; font-weight:700; }
.badge-pass { background:#dcfce7; color:#166534; } .badge-fail { background:#fef2f2; color:#991b1b; }
.btn { padding:.35rem .8rem; border-radius:.3rem; border:1px solid #cbd5e1; background:#fff; cursor:pointer; font-size:.78rem; font-weight:500; }
.btn:hover { background:#f1f5f9; } .btn-primary { background:#2563eb; color:#fff; border-color:#2563eb; } .btn-primary:hover { background:#1d4ed8; }
.navbtns { display:flex; gap:.5rem; align-items:center; margin-left:auto; }
.empty { color:#94a3b8; text-align:center; margin-top:3rem; font-size:.9rem; }
</style>
</head>
<body>
<div class="top-bar">
  <h1>Verifier Review</h1>
  <a href="/annotate/">← Home</a>
  <a href="/annotate/verify">Builder</a>
  <span class="count" id="count"></span>
  <input id="search" placeholder="filter tasks…" oninput="render()" style="flex:0 0 200px">
  <select id="siteFilter" onchange="render()"><option value="">all sites</option></select>
  <select id="macroFilter" onchange="render()"><option value="">all macros</option></select>
  <label style="font-size:.75rem;color:#64748b"><input type="checkbox" id="noVfOnly" onchange="render()"> missing only</label>
</div>
<div class="container">
  <div class="sidebar" id="list"></div>
  <div class="main" id="detail"><div class="empty">Loading…</div></div>
</div>
<script>
let TASKS = [], FILTERED = [], CUR = -1;

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function load() {
  const r = await fetch('/annotate/api/verifier_index');
  const d = await r.json();
  TASKS = d.tasks;
  const sites = [...new Set(TASKS.map(t=>t.site))].sort();
  const macros = [...new Set(TASKS.flatMap(t=>t.macros))].sort();
  document.getElementById('siteFilter').innerHTML = '<option value="">all sites</option>' + sites.map(s=>`<option>${esc(s)}</option>`).join('');
  document.getElementById('macroFilter').innerHTML = '<option value="">all macros</option>' + macros.map(m=>`<option>${esc(m)}</option>`).join('');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const sf = document.getElementById('siteFilter').value;
  const mf = document.getElementById('macroFilter').value;
  const noVf = document.getElementById('noVfOnly').checked;
  FILTERED = TASKS.filter(t =>
    (!sf || t.site===sf) &&
    (!mf || t.macros.includes(mf)) &&
    (!noVf || !t.has_verifier) &&
    (!q || (t.task_id+' '+t.instruction+' '+t.macros.join(' ')+' '+t.annotator).toLowerCase().includes(q))
  );
  document.getElementById('count').textContent = `${FILTERED.length} / ${TASKS.length}`;
  document.getElementById('list').innerHTML = FILTERED.map((t,i)=>`
    <div class="task-card ${i===CUR?'active':''}" onclick="select(${i})" id="card${i}">
      <div><span class="tc-site">${esc(t.site)}</span><span class="tc-id">${esc(t.task_id)}</span>
        ${t.has_verifier?'':'<span class="no-vf">no verifier</span>'}</div>
      <div class="tc-inst">${esc((t.instruction||'').slice(0,90))}</div>
      <div class="tc-macros">${t.macros.map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</div>
    </div>`).join('') || '<div class="empty">no matches</div>';
}

async function select(i) {
  CUR = i; render();
  const t = FILTERED[i];
  const card = document.getElementById('card'+i); if (card) card.scrollIntoView({block:'nearest'});
  const D = document.getElementById('detail');
  D.innerHTML = '<div class="empty">Loading verifier…</div>';
  let spec = {macros:{}};
  if (t.has_verifier) {
    try { spec = await (await fetch(`/annotate/api/task_verifier/${encodeURIComponent(t.annotator)}/${encodeURIComponent(t.task_id)}`)).json(); }
    catch(e){}
  }
  D.innerHTML = `
    <div class="detail-head">
      <span class="dsite">${esc(t.site)}</span>
      <span class="did">${esc(t.task_id)}</span>
      <span class="dim">${esc(t.annotator)}</span>
      <div class="navbtns">
        <button class="btn" onclick="step(-1)">← Prev</button>
        <button class="btn" onclick="step(1)">Next →</button>
        <button class="btn btn-primary" onclick="gradeGold(this)">▶ Grade on gold</button>
      </div>
    </div>
    <div class="instr">
      <div class="lbl">Instruction</div>
      <div class="txt">${esc(t.instruction)}</div>
      ${t.expected_answer?`<div class="exp"><span class="lbl">Expected answer</span> <code>${esc(t.expected_answer)}</code></div>`:''}
    </div>
    <div id="grade"></div>
    ${t.has_verifier ? renderSpec(spec) : '<div class="empty">This task has no verifier.json.</div>'}`;
}

function step(d){ const n=CUR+d; if(n>=0&&n<FILTERED.length) select(n); }

function renderSpec(spec){
  const macros = spec.macros || {};
  const keys = Object.keys(macros);
  if(!keys.length) return '<div class="empty">Empty verifier.</div>';
  return keys.map(m=>`
    <div class="macro-block" id="mb-${esc(m)}">
      <div class="macro-head"><span class="mname">${esc(m)}</span><span class="badge" id="bd-${esc(m)}"></span></div>
      <div class="macro-body">${renderNode(macros[m])}</div>
    </div>`).join('');
}

function fmt(v){
  if(v && typeof v==='object' && v.open===true) return '<span class="any">any</span>';
  if(v && typeof v==='object') return `<code>${esc(JSON.stringify(v))}</code>`;
  return `<code>${esc(v)}</code>`;
}
function has(v){ return !(v==null || (typeof v==='object' && v.open===true)); }

function renderNode(node){
  if(node && node.op){
    const op = (node.op||'AND').toUpperCase();
    const cls = op==='OR' ? 'or' : 'and';
    const lbl = op==='OR' ? 'satisfy ANY of' : 'satisfy ALL of';
    return `<div class="group ${cls}"><div class="group-lbl">${lbl}</div>${(node.checks||[]).map(renderNode).join('')}</div>`;
  }
  return `<div class="leaf">${leafLine(node||{})}</div>`;
}

function leafLine(l){
  const t=l.type;
  if(t==='action_included')
    return `<span class="lt">action</span> <b>${esc(l.action||'?')}</b> on ${fmt(l.target)}${has(l.value)?' = '+fmt(l.value):''}`;
  if(t==='request_made')
    return `<span class="lt">request</span> ${fmt(l.method)} ${fmt(l.url)}${has(l.status)?' → status '+fmt(l.status):''}${has(l.body_fields)?' · body '+fmt(l.body_fields):''}`;
  if(t==='page_visited')
    return `<span class="lt">visited</span> ${fmt(l.url)}`;
  if(t==='qa_answer')
    return `<span class="lt">answer</span> matches ${fmt(l.expected)} <span class="dim">(${l.leaf?'reported answer':'reasoning'}, ${esc(l.mode||'')})</span>`;
  if(t==='answer_grounded')
    return `<span class="lt">grounded</span> answer shown on ${fmt(l.url)}${has(l.text)?' · text '+fmt(l.text):''}`;
  if(t==='reasoning_contains')
    return `<span class="lt">reasoning</span> reaches ${fmt(l.expected)}`;
  if(t==='answer_matches')
    return `<span class="lt">answer</span> = ${fmt(l.expected)}`;
  return `<span class="lt">${esc(t||'?')}</span> <code>${esc(JSON.stringify(l))}</code>`;
}

async function gradeGold(btn){
  const t = FILTERED[CUR]; btn.disabled=true; btn.textContent='grading…';
  const g = document.getElementById('grade');
  try{
    const r = await fetch('/annotate/api/run_task_verifier', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({task_id:t.task_id, annotator:t.annotator, which:'gold'})
    });
    const d = await r.json();
    if(d.error){ g.innerHTML = `<div class="instr" style="border-color:#fca5a5">grade error: ${esc(d.error)}</div>`; }
    else {
      const bm = d.by_macro||{};
      Object.entries(bm).forEach(([m,ok])=>{ const b=document.getElementById('bd-'+m); if(b){ b.className='badge '+(ok?'badge-pass':'badge-fail'); b.textContent = ok?'PASS':'FAIL'; }});
      g.innerHTML = `<div class="instr" style="border-color:${d.passed?'#86efac':'#fca5a5'}">gold self-check: <span class="badge ${d.passed?'badge-pass':'badge-fail'}">${d.passed?'PASS':'FAIL'}</span> <span class="dim">${esc(d.source||'')} · ${d.action_count||0} actions</span></div>`;
    }
  } catch(e){ g.innerHTML = `<div class="instr">grade failed: ${esc(e)}</div>`; }
  btn.disabled=false; btn.textContent='▶ Grade on gold';
}

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='j'||e.key==='ArrowDown'){ step(1); e.preventDefault(); }
  if(e.key==='k'||e.key==='ArrowUp'){ step(-1); e.preventDefault(); }
});
load();
</script>
</body>
</html>
