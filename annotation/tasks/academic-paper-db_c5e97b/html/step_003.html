<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarBase — Academic Paper Search</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; }
        .header { border-bottom: 1px solid #e2e8f0; padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .header h1 { font-size: 1.3rem; margin: 0; color: #1e3a5f; }
        .header-nav a { margin-left: 1rem; font-size: .9rem; color: #475569; text-decoration: none; }
        .header-nav a:hover { color: #1e3a5f; }
        .search-section { max-width: 800px; margin: 1.5rem auto; padding: 0 1.5rem; }
        .search-form { display: flex; gap: .5rem; }
        .search-form input[type="text"] { flex: 1; padding: .7rem 1rem; border: 2px solid #cbd5e1; border-radius: .4rem; font-size: 1rem; }
        .search-form input[type="text"]:focus { border-color: #3b82f6; outline: none; }
        .search-form button { padding: .7rem 1.5rem; background: #1e3a5f; color: #fff; border: none; border-radius: .4rem; cursor: pointer; font-size: .95rem; }
        .filters { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1rem; align-items: center; }
        .filters label { font-size: .85rem; color: #64748b; }
        .filters select, .filters input[type="number"] { padding: .4rem .6rem; border: 1px solid #cbd5e1; border-radius: .3rem; font-size: .85rem; }
        .filters input[type="number"] { width: 80px; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: .3rem .8rem; margin-top: .5rem; }
        .checkbox-group label { font-size: .8rem; display: flex; align-items: center; gap: .25rem; cursor: pointer; }
        .main { max-width: 800px; margin: 0 auto; padding: 0 1.5rem 3rem; }
        .result-count { font-size: .85rem; color: #64748b; margin: 1rem 0; }
        .paper-card { border: 1px solid #e2e8f0; border-radius: .5rem; padding: 1.2rem; margin-bottom: .75rem; transition: border-color .15s; }
        .paper-card:hover { border-color: #3b82f6; }
        .paper-title { margin: 0 0 .3rem; font-size: 1.05rem; }
        .paper-title a { color: #1e3a5f; text-decoration: none; }
        .paper-title a:hover { text-decoration: underline; }
        .paper-authors { font-size: .88rem; color: #475569; margin-bottom: .3rem; }
        .paper-abstract { font-size: .85rem; color: #64748b; line-height: 1.5; margin-bottom: .4rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .paper-meta { font-size: .8rem; color: #94a3b8; display: flex; gap: 1rem; flex-wrap: wrap; }
        .paper-meta .cat { background: #f1f5f9; padding: .15rem .5rem; border-radius: .25rem; color: #475569; }
        .no-results { text-align: center; color: #94a3b8; padding: 3rem; }
    </style>
</head>

    <div class="search-section">
        <form class="search-form" method="get" action="/sites/academic-paper-db/">
            <input type="text" name="q" placeholder="Search papers by title, author, or category..." value="Nazia Aslam" autocomplete="off">
            <button type="submit">Search</button>
        </form>
        <div style="display:flex;gap:.5rem;margin-top:.8rem;align-items:center">
            <label style="font-size:.85rem;color:#64748b">Go to Paper ID:</label>
            <input type="number" id="paper-id-input" min="1" style="width:80px;padding:.4rem .6rem;border:1px solid #cbd5e1;border-radius:.3rem;font-size:.85rem" placehold
