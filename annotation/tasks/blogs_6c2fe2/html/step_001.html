<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TumblrVibe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a2e; color: #e0e0e0; font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; }
        a { color: #7c83ff; text-decoration: none; }
        a:hover { color: #a5aaff; }

        .top-bar { background: #16213e; padding: .6rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #0f3460; }
        .top-bar .logo { font-size: 1.4rem; font-weight: 800; color: #7c83ff; letter-spacing: 1px; }
        .top-bar .nav-links { display: flex; gap: 1rem; align-items: center; }
        .top-bar .nav-links a { color: #b0b0c0; font-size: .9rem; }
        .top-bar .nav-links a:hover { color: #fff; }
        .top-bar .nav-links .btn-compose { background: #7c83ff; color: #fff; padding: .4rem 1rem; border-radius: 1rem; font-size: .9rem; font-weight: 600; }
        .top-bar .nav-links .btn-compose:hover { background: #6b72e8; }
        .top-bar .nav-links .btn-login { background: #e94560; color: #fff; padding: .45rem 1.2rem; border-radius: 1rem; font-size: .9rem; font-weight: 700; letter-spacing: .5px; }
        .top-bar .nav-links .btn-login:hover { background: #c03050; }

        .layout { display: flex; max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; gap: 1.5rem; }
        .sidebar { width: 240px; flex-shrink: 0; }
        .feed { flex: 1; max-width: 640px; }
        .right-rail { width: 220px; flex-shrink: 0; }

        .sidebar-section { background: #16213e; border-radius: .5rem; padding: 1rem; margin-bottom: 1rem; }
        .sidebar-section h3 { font-size: .85rem; color: #7c83ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: .6rem; }

        .search-box { width: 100%; padding: .5rem .7rem; border: 1px solid #0f3460; border-radius: .4rem; background: #1a1a2e; color: #e0e0e0; font-size: .9rem; }
        .search-box:focus { border-color: #7c83ff; outline: none; }
        .search-btn { width: 100%; margin-top: .4rem; padding: .45rem; background: #7c83ff; color: #fff; border: none; border-radius: .4rem; cursor: pointer; font-size: .85rem; }
        .search-btn:hover { background: #6b72e8; }

        .cat-list a, .tag-cloud a { display: inline-block; padding: .2rem .5rem; margin: .15rem; font-size: .8rem; border-radius: .3rem; background: #1a1a2e; border: 1px solid #0f3460; color: #b0b0c0; }
        .cat-list a:hover, .tag-cloud a:hover, .cat-list a.active, .tag-cloud a.active { background: #7c83ff; color: #fff; border-color: #7c83ff; }

        .filter-row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .5rem; }
        .filter-row label { font-size: .8rem; color: #888; }
        .filter-row select, .filter-row input[type="date"] { padding: .3rem .5rem; background: #1a1a2e; border: 1px solid #0f3460; border-radius: .3rem; color: #e0e0e0; font-size: .8rem; }

        .post-card { background: #16213e; border-radius: .6rem; margin-bottom: 1.2rem; overflow: hidden; border: 1px solid transparent; transition: border-color .2s; }
        .post-card:hover { border-color: #7c83ff; }
        .post-card img.post-image { width: 100%; max-height: 350px; object-fit: cover; }
        .post-content { padding: 1rem 1.2rem; }
        .post-header { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem; }
        .post-header img.avatar { width: 36px; height: 36px; border-radius: 50%; }
        .post-header .author-name { font-weight: 600; color: #e0e0e0; font-size: .9rem; }
        .post-header .post-date { font-size: .75rem; color: #888; margin-left: auto; }
        .post-title { font-size: 1.15rem; font-weight: 700; margin-bottom: .4rem; }
        .post-title a { color: #e8e8f0; }
        .post-title a:hover { color: #7c83ff; }
        .post-excerpt { font-size: .88rem; color: #a0a0b0; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: .6rem; }
        .post-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .5rem; }
        .post-tags a { font-size: .75rem; color: #7c83ff; }
        .post-tags a:hover { text-decoration: underline; }
        .post-footer { display: flex; gap: 1rem; font-size: .8rem; color: #888; align-items: center; }
        .post-footer .cat-badge { background: #0f3460; padding: .15rem .5rem; border-radius: .25rem; color: #7c83ff; font-size: .75rem; }
        .post-footer .notes { color: #aaa; }
        .pinned-badge { background: #e94560; color: #fff; font-size: .65rem; padding: .1rem .4rem; border-radius: .2rem; margin-left: .5rem; text-transform: uppercase; font-weight: 700; }

        .result-info { font-size: .85rem; color: #888; margin-bottom: 1rem; }
        .no-results { text-align: center; color: #666
