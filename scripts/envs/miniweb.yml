# The paper's `miniweb` environment: the 65 sites, the agent harness (browser-use), the graders, MiniWebGen.
#
#   conda env create -f scripts/envs/miniweb.yml
#   conda activate miniweb && python -m playwright install chromium      # Playwright 1.44: Chromium build 1117
#
# Ran on Ubuntu 22.04.5 LTS, x86_64 (Linux 6.8, glibc 2.35). The sites need no GPU; the pinned torch is a CUDA 13.0
# wheel that some agent libraries import. Versions: miniweb.txt (pip list --format=freeze).
name: miniweb
channels:
  - conda-forge
dependencies:
  - python=3.11.0
  - pip
  - pip:
      - -r miniweb.txt
      - -e ../..
