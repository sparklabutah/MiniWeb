# The paper's `webmix` environment: vLLM serving (src/miniwebagent/scripts/serve.sh) and LoRA training
# (python -m miniwebagent.train).
#
#   conda env create -f scripts/envs/webmix.yml
#
# Trained on 4x NVIDIA A800 40GB under Rocky Linux 8.10, x86_64 (Linux 4.18, glibc 2.28, driver 595.91); served and
# evaluated there and on an RTX 5090 under Ubuntu 22.04.5 LTS (Linux 6.8, glibc 2.35, driver 580.178). torch 2.13.0
# and vLLM 0.30.0 are CUDA 13.0 wheels: they need an NVIDIA driver of 580 or newer. serve.sh finds this environment at
# $WEBMIX_ENV (default ~/.conda/envs/webmix). Versions: webmix.txt (pip list --format=freeze).
name: webmix
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - pip
  - pip:
      - -r webmix.txt
      - -e ../..
