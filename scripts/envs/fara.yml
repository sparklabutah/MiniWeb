# The paper's `fara` environment: only Fara1.5-4B's released agent loop in Tab. 2
# (src/miniweb/evaluation/fara_runner.py, which imports nothing from this repository).
#
#   conda env create -f scripts/envs/fara.yml
#   conda activate fara && python -m playwright install chromium         # Playwright 1.51
#
# Ran on Ubuntu 22.04.5 LTS, x86_64 (Linux 6.8, glibc 2.35). Versions: fara.txt (pip list --format=freeze, with the
# fara package pinned to the microsoft/fara commit the paper used).
name: fara
channels:
  - conda-forge
dependencies:
  - python=3.11.0
  - pip
  - pip:
      - -r fara.txt
