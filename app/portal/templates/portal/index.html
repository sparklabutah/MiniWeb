<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniWeb Browser</title>
    <link rel="stylesheet" href="/static/browser.css">
</head>
<body id="browser-shell">

    <!-- Tab bar -->
    <div id="tab-bar">
        <div id="tabs-container"></div>
        <button id="new-tab-btn" title="New tab">+</button>
    </div>

    <!-- Navigation bar -->
    <div id="nav-bar">
        <button id="btn-back" class="nav-btn" title="Back" disabled>
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Forward" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
        <button id="btn-refresh" class="nav-btn" title="Refresh">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <div id="url-bar-wrapper">
            <input id="url-bar" type="text" placeholder="Search MiniWeb or type a URL..." autocomplete="off" spellcheck="false">
        </div>
    </div>

    <!-- Content area -->
    <div id="content-area">
        <div id="new-tab-page">
            <div class="ntp-logo">MiniWeb</div>
            <div class="ntp-subtitle">Alex Rivera's Web</div>
            <div class="ntp-search-box">
                <span class="search-icon">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                </span>
                <input id="ntp-search" type="text" placeholder="Search the web..." autocomplete="off">
                <div id="ntp-search-results"></div>
            </div>
            <!-- Search results page (hidden by default) -->
            <div id="search-results-page" style="display:none;max-width:680px;width:100%;padding:0 16px;">
                <div id="search-results-header" style="font-size:13px;color:#70757a;margin-bottom:12px;"></div>
                <div id="search-results-list"></div>
            </div>
            <div id="ntp-categories"></div>
        </div>
    </div>

<script>
const SITES = JSON.parse('{{ sites_json | safe }}');
const MAX_TABS = 10;

let tabs = [];
let activeTabId = null;
let tabIdCounter = 0;

const CATEGORY_ORDER = [
    "Communication", "Productivity", "Shopping & Transactional", "Financial",
    "Social Media", "Streaming & Media", "Search & Reference", "Dynamic Info & Feeds",
    "Static & Informational", "Editing", "Education & LMS", "Government & Civic",
    "Health", "Maps & Navigation", "Utilities", "Other"
];

const CATEGORY_ICONS = {
    "Communication": "\u{1F4AC}", "Productivity": "\u{1F4CB}", "Shopping & Transactional": "\u{1F6D2}",
    "Financial": "\u{1F4B3}", "Social Media": "\u{1F465}", "Streaming & Media": "\u{1F3AC}",
    "Search & Reference": "\u{1F50D}", "Dynamic Info & Feeds": "\u{1F4F0}",
    "Static & Informational": "\u{1F4C4}", "Editing": "\u{270F}\uFE0F", "Education & LMS": "\u{1F393}",
    "Government & Civic": "\u{1F3DB}\uFE0F", "Health": "\u{2764}\uFE0F",
    "Maps & Navigation": "\u{1F5FA}\uFE0F", "Utilities": "\u{1F527}", "Other": "\u{1F4E6}"
};

const ICON_COLORS = [
    '#4285f4','#ea4335','#fbbc04','#34a853','#ff6d01','#46bdc6','#7baaf7',
    '#f07b72','#fcd04f','#57bb8a','#e8710a','#9334e6','#d93025','#1967d2',
    '#188038','#a142f4','#c5221f','#0d652d','#b31412','#0b57d0',
];
function hashColor(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
    return ICON_COLORS[Math.abs(h) % ICON_COLORS.length];
}

// ---- Tab management ----

function createTab(siteId) {
    if (tabs.length >= MAX_TABS) return;
    const id = ++tabIdCounter;
    const tab = {
        id, siteId: siteId || null, title: 'New Tab', url: '',
        iframeEl: null, tabEl: null, syncInterval: null,
        history: [], historyIdx: -1, navigating: false
    };

    const tabEl = document.createElement('div');
    tabEl.className = 'tab';
    tabEl.dataset.tabId = id;

    const titleSpan = document.createElement('span');
    titleSpan.className = 'tab-title';
    titleSpan.textContent = 'New Tab';
    tabEl.appendChild(titleSpan);

    const closeBtn = document.createElement('button');
    closeBtn.className = 'tab-close';
    closeBtn.textContent = '\u00d7';
    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });
    tabEl.appendChild(closeBtn);

    tabEl.addEventListener('click', () => switchTab(id));
    document.getElementById('tabs-container').appendChild(tabEl);
    tab.tabEl = tabEl;

    if (siteId) {
        const site = SITES.find(s => s.id === siteId);
        if (site) {
            tab.title = site.name;
            titleSpan.textContent = site.name;
            tab.url = site.path;
            createIframe(tab, site.path);
        }
    }

    tabs.push(tab);
    updateNewTabBtn();
    switchTab(id);
    return tab;
}

function createIframe(tab, url) {
    const iframe = document.createElement('iframe');
    iframe.dataset.tabId = tab.id;
    iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-popups');
    iframe.src = url;
    document.getElementById('content-area').appendChild(iframe);
    tab.iframeEl = iframe;
    tab.url = url;
    // Push initial URL to history
    tab.history = [url];
    tab.historyIdx = 0;
    startUrlSync(tab);
}

function switchTab(tabId) {
    activeTabId = tabId;
    const tab = tabs.find(t => t.id === tabId);
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.tabEl.classList.add('active');
    const ntp = document.getElementById('new-tab-page');
    document.querySelectorAll('#content-area iframe').forEach(f => f.classList.remove('active'));
    if (tab.iframeEl) {
        ntp.classList.remove('active');
        tab.iframeEl.classList.add('active');
        syncUrlBar(tab);
    } else {
        ntp.classList.add('active');
        document.getElementById('url-bar').value = '';
    }
    updateNavButtons();
    tab.tabEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}

function closeTab(tabId) {
    const idx = tabs.findIndex(t => t.id === tabId);
    if (idx === -1) return;
    const tab = tabs[idx];
    if (tab.syncInterval) clearInterval(tab.syncInterval);
    if (tab.iframeEl) tab.iframeEl.remove();
    tab.tabEl.remove();
    tabs.splice(idx, 1);
    if (activeTabId === tabId) {
        if (tabs.length === 0) createTab();
        else switchTab(tabs[Math.min(idx, tabs.length - 1)].id);
    }
    updateNewTabBtn();
}

function updateNewTabBtn() {
    document.getElementById('new-tab-btn').disabled = tabs.length >= MAX_TABS;
}

// ---- Navigation with history ----

function updateNavButtons() {
    const tab = tabs.find(t => t.id === activeTabId);
    const backBtn = document.getElementById('btn-back');
    const fwdBtn = document.getElementById('btn-forward');
    if (!tab || !tab.iframeEl) {
        backBtn.disabled = true;
        fwdBtn.disabled = true;
        return;
    }
    backBtn.disabled = tab.historyIdx <= 0;
    fwdBtn.disabled = tab.historyIdx >= tab.history.length - 1;
}

function pushHistory(tab, url) {
    if (tab.navigating) return;
    if (tab.history[tab.historyIdx] === url) return;
    // Truncate forward history
    tab.history = tab.history.slice(0, tab.historyIdx + 1);
    tab.history.push(url);
    tab.historyIdx = tab.history.length - 1;
    if (activeTabId === tab.id) updateNavButtons();
}

function goBack() {
    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab || !tab.iframeEl || tab.historyIdx <= 0) return;
    tab.navigating = true;
    tab.historyIdx--;
    const url = tab.history[tab.historyIdx];
    tab.iframeEl.src = url;
    tab.url = url;
    document.getElementById('url-bar').value = url;
    updateNavButtons();
    setTimeout(() => { tab.navigating = false; }, 500);
}

function goForward() {
    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab || !tab.iframeEl || tab.historyIdx >= tab.history.length - 1) return;
    tab.navigating = true;
    tab.historyIdx++;
    const url = tab.history[tab.historyIdx];
    tab.iframeEl.src = url;
    tab.url = url;
    document.getElementById('url-bar').value = url;
    updateNavButtons();
    setTimeout(() => { tab.navigating = false; }, 500);
}

function refresh() {
    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab || !tab.iframeEl) return;
    try { tab.iframeEl.contentWindow.location.reload(); } catch (e) {
        tab.iframeEl.src = tab.url;
    }
}

function navigateTo(input) {
    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab) return;
    let url = input.trim();
    if (!url) return;

    if (url.startsWith('/')) { loadUrlInTab(tab, url); return; }

    const lower = url.toLowerCase();
    const matched = SITES.find(s =>
        s.id === lower || s.name.toLowerCase() === lower ||
        s.id.includes(lower) || s.name.toLowerCase().includes(lower)
    );
    if (matched) { loadUrlInTab(tab, matched.path); return; }
    showSearchResults(url);
}

function loadUrlInTab(tab, url) {
    if (tab.iframeEl) {
        tab.iframeEl.src = url;
    } else {
        createIframe(tab, url);
        document.getElementById('new-tab-page').classList.remove('active');
        tab.iframeEl.classList.add('active');
    }
    tab.url = url;
    pushHistory(tab, url);
    document.getElementById('url-bar').value = url;

    const siteMatch = url.match(/^\/sites\/([^/]+)/);
    if (siteMatch) {
        tab.siteId = siteMatch[1];
        tab.tabEl.dataset.siteId = siteMatch[1];
        const site = SITES.find(s => s.id === siteMatch[1]);
        if (site) {
            tab.title = site.name;
            tab.tabEl.querySelector('.tab-title').textContent = site.name;
        }
    } else if (url === '/verify-payment') {
        tab.title = 'Verify Payment';
        tab.tabEl.querySelector('.tab-title').textContent = 'Verify Payment';
    } else if (url.startsWith('/_admin')) {
        tab.title = 'Admin';
        tab.tabEl.querySelector('.tab-title').textContent = 'Admin';
    }
}

// ---- URL bar sync ----

function startUrlSync(tab) {
    if (tab.syncInterval) clearInterval(tab.syncInterval);
    tab.syncInterval = setInterval(() => {
        if (!tab.iframeEl) return;
        try {
            const loc = tab.iframeEl.contentWindow.location;
            const currentUrl = loc.pathname + loc.search;

            if (currentUrl === '/' || currentUrl === '') {
                // User navigated to portal root — open new tab page but keep iframe alive
                // so back button still works
                tab.url = '/';
                tab.title = 'New Tab';
                tab.tabEl.querySelector('.tab-title').textContent = 'New Tab';
                if (activeTabId === tab.id) {
                    tab.iframeEl.classList.remove('active');
                    document.getElementById('new-tab-page').classList.add('active');
                    document.getElementById('url-bar').value = '';
                    updateNavButtons();
                }
                return;
            }

            if (currentUrl !== tab.url) {
                tab.url = currentUrl;
                pushHistory(tab, currentUrl);
                if (activeTabId === tab.id) {
                    document.getElementById('url-bar').value = currentUrl;
                }
            }

            const title = tab.iframeEl.contentDocument.title;
            if (title && title !== tab.title) {
                tab.title = title;
                tab.tabEl.querySelector('.tab-title').textContent = title;
            }
        } catch (e) {}
    }, 300);
}

function syncUrlBar(tab) {
    if (!tab) return;
    try {
        if (tab.iframeEl) {
            const loc = tab.iframeEl.contentWindow.location;
            document.getElementById('url-bar').value = loc.pathname + loc.search;
        } else {
            document.getElementById('url-bar').value = '';
        }
    } catch (e) {
        document.getElementById('url-bar').value = tab.url || '';
    }
}

// ---- Bookmarks by category ----

function openBookmark(siteId) {
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab && !tab.iframeEl) {
        const site = SITES.find(s => s.id === siteId);
        if (site) loadUrlInTab(tab, site.path);
    } else {
        createTab(siteId);
    }
}

function buildCategories() {
    const container = document.getElementById('ntp-categories');
    container.innerHTML = '';

    // Group sites by category
    const groups = {};
    SITES.forEach(s => {
        const cat = s.category || 'Other';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(s);
    });

    // Render in defined order
    CATEGORY_ORDER.forEach(cat => {
        const sites = groups[cat];
        if (!sites || sites.length === 0) return;

        const section = document.createElement('div');
        section.className = 'ntp-category';
        section.dataset.category = cat;

        const header = document.createElement('div');
        header.className = 'ntp-category-header';
        const icon = CATEGORY_ICONS[cat] || '\u{1F4E6}';
        header.innerHTML = `<span class="cat-icon">${icon}</span> ${cat} <span class="cat-count">${sites.length}</span>`;
        section.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'ntp-category-grid';

        sites.forEach(site => {
            const tile = document.createElement('div');
            tile.className = 'bookmark-tile';
            tile.dataset.siteId = site.id;
            tile.addEventListener('click', () => openBookmark(site.id));

            const iconEl = document.createElement('div');
            iconEl.className = 'bookmark-icon';
            iconEl.textContent = site.name.charAt(0).toUpperCase();
            iconEl.style.background = hashColor(site.id);

            const label = document.createElement('div');
            label.className = 'bookmark-label';
            label.textContent = site.name;
            label.title = site.description || site.name;

            tile.appendChild(iconEl);
            tile.appendChild(label);
            grid.appendChild(tile);
        });

        section.appendChild(grid);
        container.appendChild(section);
    });
}

// ---- NTP Search (web search with MiniWeb results on top) ----

var searchDebounce = null;

function showSearchResults(query) {
    const q = query.trim();
    const dropdown = document.getElementById('ntp-search-results');

    if (!q) {
        dropdown.classList.remove('visible');
        dropdown.innerHTML = '';
        // Show bookmarks again
        document.getElementById('ntp-categories').style.display = '';
        document.getElementById('search-results-page').style.display = 'none';
        return;
    }

    // Quick autocomplete from local SITES data
    const matches = SITES.filter(s =>
        s.name.toLowerCase().includes(q.toLowerCase()) ||
        (s.description || '').toLowerCase().includes(q.toLowerCase())
    );

    dropdown.innerHTML = '';
    matches.slice(0, 5).forEach(site => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.addEventListener('click', () => { dropdown.classList.remove('visible'); openBookmark(site.id); });
        const iconEl = document.createElement('div');
        iconEl.className = 'search-result-icon';
        iconEl.textContent = site.name.charAt(0).toUpperCase();
        iconEl.style.background = hashColor(site.id);
        const info = document.createElement('div');
        info.className = 'search-result-info';
        info.innerHTML = `<div class="search-result-name">${site.name}</div>
            <div class="search-result-desc">${site.category || ''}</div>`;
        item.appendChild(iconEl);
        item.appendChild(info);
        dropdown.appendChild(item);
    });
    if (matches.length > 0) dropdown.classList.add('visible');
    else dropdown.classList.remove('visible');
}

function doWebSearch(query) {
    const q = query.trim();
    if (!q) return;

    document.getElementById('ntp-search-results').classList.remove('visible');
    document.getElementById('ntp-categories').style.display = 'none';
    const resultsPage = document.getElementById('search-results-page');
    resultsPage.style.display = '';
    document.getElementById('search-results-header').textContent = 'Searching...';
    document.getElementById('search-results-list').innerHTML = '';

    fetch('/api/search?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(results => {
            document.getElementById('search-results-header').textContent =
                results.length + ' results for "' + q + '"';
            const list = document.getElementById('search-results-list');
            list.innerHTML = '';

            results.forEach(r => {
                const item = document.createElement('div');
                item.style.cssText = 'padding:12px 0;border-bottom:1px solid #ebebeb;';

                const domain = document.createElement('div');
                domain.style.cssText = 'font-size:12px;color:#202124;margin-bottom:2px;display:flex;align-items:center;gap:6px;';
                if (r.is_miniweb) {
                    domain.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:#4285f4;color:#fff;text-align:center;line-height:16px;font-size:9px;font-weight:700;">M</span>' +
                        '<span style="color:#4285f4;">' + r.domain + '</span>';
                } else {
                    domain.innerHTML = '<span style="color:#4d5156;">' + r.domain + '</span>';
                }

                const title = document.createElement('div');
                title.style.cssText = 'font-size:18px;line-height:1.3;margin-bottom:3px;';
                const link = document.createElement('a');
                link.textContent = r.title;
                if (r.is_miniweb) {
                    link.href = '#';
                    link.style.cssText = 'color:#1a0dab;text-decoration:none;';
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        // Open in current tab
                        const tab = tabs.find(t => t.id === activeTabId);
                        if (tab) loadUrlInTab(tab, r.url);
                        // Reset search
                        document.getElementById('ntp-search').value = '';
                        resultsPage.style.display = 'none';
                        document.getElementById('ntp-categories').style.display = '';
                    });
                } else {
                    link.href = '#';
                    link.style.cssText = 'color:#70757a;text-decoration:none;cursor:default;';
                    link.title = 'External site — not available in MiniWeb';
                }
                title.appendChild(link);

                const snippet = document.createElement('div');
                snippet.style.cssText = 'font-size:14px;color:#4d5156;line-height:1.5;';
                snippet.textContent = r.snippet || '';

                item.appendChild(domain);
                item.appendChild(title);
                item.appendChild(snippet);
                list.appendChild(item);
            });

            if (results.length === 0) {
                list.innerHTML = '<div style="color:#70757a;padding:20px 0;">No results found for "' + q + '"</div>';
            }
        });
}

// ---- Event listeners ----

document.addEventListener('DOMContentLoaded', () => {
    buildCategories();
    createTab();

    document.getElementById('new-tab-btn').addEventListener('click', () => createTab());
    document.getElementById('btn-back').addEventListener('click', goBack);
    document.getElementById('btn-forward').addEventListener('click', goForward);
    document.getElementById('btn-refresh').addEventListener('click', refresh);

    const urlBar = document.getElementById('url-bar');
    urlBar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); navigateTo(urlBar.value); urlBar.blur(); }
    });

    const ntpSearch = document.getElementById('ntp-search');
    ntpSearch.addEventListener('input', () => showSearchResults(ntpSearch.value));
    ntpSearch.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            doWebSearch(ntpSearch.value);
        }
    });

    document.addEventListener('click', (e) => {
        const box = document.querySelector('.ntp-search-box');
        if (box && !box.contains(e.target)) document.getElementById('ntp-search-results').classList.remove('visible');
    });

    document.addEventListener('keydown', (e) => {
        const ntp = document.getElementById('new-tab-page');
        if (!ntp.classList.contains('active')) return;
        if (e.target.tagName === 'INPUT') return;
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) ntpSearch.focus();
    });
});
</script>

</body>
</html>
