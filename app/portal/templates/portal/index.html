<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniWeb</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
            padding: 2rem;
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: .25rem;
            letter-spacing: -.02em;
        }
        .hero p {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }
        .search-box {
            width: 100%;
            max-width: 540px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: .85rem 1.2rem .85rem 2.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 9999px;
            font-size: 1rem;
            outline: none;
            transition: border-color .15s;
            box-sizing: border-box;
        }
        .search-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.15);
        }
        .search-box .icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
        }
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 2rem 3rem;
        }
        .site-card {
            border: 1px solid #e2e8f0;
            border-radius: .75rem;
            padding: 1.5rem;
            transition: box-shadow .15s, border-color .15s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .site-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(0,0,0,.06);
        }
        .site-card h2 {
            font-size: 1.15rem;
            margin: 0 0 .4rem;
        }
        .site-card .desc {
            color: #64748b;
            font-size: .9rem;
            margin: 0 0 .75rem;
        }
        .tag {
            display: inline-block;
            background: #f1f5f9;
            color: #475569;
            font-size: .75rem;
            padding: .15rem .55rem;
            border-radius: 9999px;
            margin-right: .35rem;
        }
        .no-results {
            text-align: center;
            color: #94a3b8;
            padding: 3rem 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>MiniWeb</h1>
        <p>Lightweight web for agentic benchmarking</p>
        <div class="search-box">
            <span class="icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </span>
            <input type="text" id="search" placeholder="Search sites..." autofocus autocomplete="off">
        </div>
    </div>

    <div class="sites-grid" id="sites-grid">
        {% for site in sites %}
        <a class="site-card" href="{{ site.path }}" data-name="{{ site.name|lower }}"
           data-desc="{{ site.description|lower }}" data-tags="{{ site.tags|join(' ')|lower }}">
            <h2>{{ site.name }}</h2>
            <p class="desc">{{ site.description }}</p>
            <div>
                {% for tag in site.tags %}
                <span class="tag">{{ tag }}</span>
                {% endfor %}
            </div>
        </a>
        {% endfor %}
    </div>

    <div class="no-results" id="no-results">No sites match your search.</div>

    <script>
    const input = document.getElementById("search");
    const grid = document.getElementById("sites-grid");
    const cards = grid.querySelectorAll(".site-card");
    const noResults = document.getElementById("no-results");

    input.addEventListener("input", () => {
        const q = input.value.toLowerCase().trim();
        let visible = 0;
        cards.forEach(card => {
            const match = !q
                || card.dataset.name.includes(q)
                || card.dataset.desc.includes(q)
                || card.dataset.tags.includes(q);
            card.style.display = match ? "" : "none";
            if (match) visible++;
        });
        noResults.style.display = visible === 0 ? "block" : "none";
    });
    </script>
</body>
</html>
