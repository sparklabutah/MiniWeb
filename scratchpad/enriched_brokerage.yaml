brokerage:
  authenticate_by_form:
  - 'Login page (/sites/brokerage/login, nav ''Log In'') -> ''Email or Username'' + ''Password'' text fields, then the green ''Log In'' button. Outcome: authenticates and starts a session (a 2FA ''Verify Your Identity'' code step appears next unless Skip-2FA is on), landing on the Portfolio page. Real accounts: username ''alex_rivera'' (Alex Rivera), ''priya_sharma'', ''marcus_chen''. Example: log in as ''alex_rivera'' with that user''s password.'
  cancel_by_form:
  - '''History'' page (/sites/brokerage/orders, nav ''History'') -> the ''Cancel'' button shown in the last column of each row whose Status tag is ''Open'' (filled/cancelled rows have no button). Outcome: POSTs to cancel that order and flips its Status to ''Cancelled''. Only limit/stop_loss orders sit Open; market orders fill instantly. Example: alex_rivera has 2 open orders in History with a Cancel button.'
  create_by_form:
  - '''Trade'' page (/sites/brokerage/trade, nav ''Trade'') or the Buy/Sell panel in the right sidebar of a ticker detail page -> order form: Buy/Sell toggle, Symbol dropdown (omitted when a symbol is preselected), ''Order Type'' select (Market Order / Limit Order / Stop Loss), ''Time in Force'' radios (Day / Good till canceled), ''Shares'' number input (min 1), a ''Price'' field that appears for limit/stop orders, then the submit button labelled ''Buy <SYMBOL>''. Outcome: creates an order — a Market Order fills immediately (updates holdings + buying power), limit/stop orders stay Open. Example: Buy 5 shares of AAPL (Apple Inc.) as a Market Order.'
  filter_by_date_range:
  - '''History'' page (/sites/brokerage/orders) -> the ''From:'' and ''To:'' date pickers in the filter bar above the orders table, then the green ''Apply'' button. Outcome: reloads the table showing only orders whose created date falls in the range (inclusive). Example: From 2025-09-01 To 2025-09-30 shows alex_rivera''s Sept orders such as the SPY and VTI buys dated 2025-09-08.'
  filter_by_dropdown:
  - '''All Securities'' card on the home page -> the ''All Sectors'' dropdown in the table''s filter bar. Outcome: reloads showing only tickers in the chosen sector. 34 real options including Technology, Healthcare, Financial Services, Semiconductor, Cryptocurrency, Energy, Real Estate. Example: pick ''Technology'' to narrow to MSFT, NVDA, AAPL, etc.'
  - '''All Securities'' card on the home page -> the ''All Types'' dropdown next to the sector dropdown. Outcome: reloads showing only that asset type. Options: stock, crypto, index_fund, futures. Example: pick ''crypto'' to see BTC (Bitcoin), ETH (Ethereum), SOL (Solana).'
  - 'Options page (/sites/brokerage/options) -> the ''All Underlyings'' dropdown (underlying ticker, e.g. AAPL, AMZN, COR) and the ''All Types'' dropdown (Calls / Puts); both auto-submit on change. Outcome: filters the options-chain table to that underlying and/or call vs put. Example: underlying AAPL + Calls.'
  - '''History'' page (/sites/brokerage/orders) -> the status dropdown (''All Orders'' default). Outcome: filters the orders table by status. Options: Open, Filled, Cancelled. Example: select ''Filled'' to see only alex_rivera''s 9 filled orders.'
  filter_by_slider:
  - '''All Securities'' card on the home page -> the ''Max Price'' range slider in the filter bar (min 0, max 5000, step 50; 5000 shows as ''Any''), applied with the ''Apply'' button. Outcome: reloads showing only tickers whose current price is at or below the chosen ceiling. Example: drag to $200 to hide pricier names like MSFT (~$442) while keeping AAPL (~$189).'
  navigate_by_route:
  - '''All Securities'' table on the home page -> click any ticker row (the whole row is clickable). Outcome: navigates to that security''s detail page (/sites/brokerage/ticker/<SYMBOL>) with its chart, Key Statistics and trade panel. Example: click the AAPL row to open the Apple Inc. detail page.'
  - '''Portfolio'' page (/sites/brokerage/portfolio) -> click a row in the ''Stocks'' holdings table. Outcome: navigates to that holding''s ticker detail page. Example: alex_rivera''s holdings include SPY, VTI, QQQ, AAPL, MSFT, NVDA — click NVDA to open its detail page.'
  pay_by_form:
  - '''Trade'' page order form (and the ticker-detail Buy/Sell panel) -> the ''Pay With'' dropdown, shown only when logged in. Outcome: sets the funding source recorded on the order (account_type). Options: ''Checking Account'' / ''Credit Card'' (labelled ''Checking'' / ''Credit'' in the ticker-detail panel). The ''Available'' / ''Buying Power'' line below shows the account balance (e.g. $48,720.00 for alex_rivera). Example: buy AAPL paying with Checking Account.'
  report_information:
  - '''All Securities'' table on the home page -> read the tickers grid. Columns: Name (symbol + company name), Type tag, Price (current, live-updating), Today (change in $ and %), Market Cap ($B), Trend sparkline. 506 securities, 50 per page. Example: read NVDA''s price and today''s % change from its row.'
  - '''Portfolio'' page -> read the ''Stocks'' holdings table. Columns: Name (symbol + name), Shares, Price, Avg Cost, Total Return ($ and % gain/loss), Equity (market value), Allocation (%). Example: read alex_rivera''s AAPL row — 15 shares with its Total Return.'
  - '''Lists'' page (/sites/brokerage/watchlist, nav ''Lists'') -> read the ''My List'' watchlist rows (symbol, name, sparkline, live price, day change) and, if any are set, the ''Price Alerts'' table (Symbol, Condition, Target Price). Example: alex_rivera''s list holds AMZN, TSLA, JNJ, ETH, GC.'
  - '''History'' page (/sites/brokerage/orders) -> read the orders table. Columns: Symbol, Side (buy/sell), Type (Market/Limit/Stop Loss), Qty, Price, Filled (fill price), Status tag, Date. Example: read the status and fill price of alex_rivera''s AAPL limit order.'
  - 'Options page (/sites/brokerage/options) -> read the options-chain table. Columns: Underlying, Spot (underlying price), Type (call/put), Strike, Expiry, Premium, IV (%), Delta, Volume, OI (open interest). Example: read the premium of the AAPL $142 call expiring 2026-07-18.'
  - 'Compare page (/sites/brokerage/compare) -> read the ''Side-by-Side'' table after entering symbols. Metric rows: Name, Type, Sector, Price, Change, Change %, Market Cap, Exchange; a bar chart above ranks each symbol''s % change. Example: compare AAPL,MSFT and read their Change % rows.'
  - 'Ticker detail page (/sites/brokerage/ticker/<SYMBOL>) -> read the interactive price chart (hover for date/price tooltip) plus the ''Key Statistics'' card (Market Cap, Day''s Range, Volume, 52W High/Low, Open, Exchange, Sector, Type) and the ''About'' blurb. Example: read AAPL''s 52W High and Day''s Range.'
  - '''Portfolio'' page -> read the account summary: the hero total value with All-Time gain ($ and %), the ''Daily P&L'' card (Today''s Change, Total Return, Cash Balance), and the sidebar ''Account'' box (Buying Power, Account Type). Example: read alex_rivera''s total portfolio value and Today''s Change.'
  - 'Ticker detail page -> the price chart''s period buttons (1D, 1W, 1M, 3M, 1Y) below the chart re-draw it over that window (1D uses intraday data). Outcome: read the price trend for the selected period. Example: click 1M on the AAPL chart to read its last-month trend.'
  - '''All Securities'' filter bar on the home page -> read the available categories from the ''All Sectors'' and ''All Types'' dropdowns (34 sectors such as Technology/Healthcare/Semiconductor; types stock/crypto/index_fund/futures). Outcome: report which sectors or asset types the market offers.'
  search:
  - 'Top nav bar (present on every ''TradeVista'' page) -> the ''Search'' text box; submitting reloads the home page filtered to matches. Outcome: substring match across symbol, name, sector and type. Example: search ''apple'' to surface AAPL (Apple Inc.), or ''bank'' to surface financial names.'
  - 'Same top-bar Search -> keyword matching runs across each ticker''s symbol, name, sector and type text (case-insensitive substring). Outcome: the All Securities table lists only matching securities. Example: search ''semiconductor'' to list Semiconductor-sector tickers.'
  sort_by_form:
  - '''All Securities'' card on the home page -> the sort dropdown in the filter bar (auto-submits). Options: ''Market Cap'' (default, high-low), ''Price: High-Low'', ''Price: Low-High'', ''Top Gainers'' (change % desc), ''Top Losers'' (change % asc), ''Name A-Z''. Outcome: reorders the securities table. Example: pick ''Top Gainers'' to rank by biggest % gain, or ''Market Cap'' to put MSFT/NVDA/AAPL on top.'
  toggle_relationship:
  - 'Ticker detail page (/sites/brokerage/ticker/<SYMBOL>) -> the full-width outline button under the Buy/Sell panel labelled ''Add to List'' (or ''Remove from List'' if already watched), shown when logged in. Outcome: toggles the symbol in the user''s watchlist. Example: on the TSLA page it reads ''Remove from List'' for alex_rivera since TSLA is already on their list.'
  - '''Lists'' page (/sites/brokerage/watchlist) -> the small minus (remove) button at the right of each ''My List'' row. Outcome: removes that symbol from the watchlist. Example: click the minus on the JNJ row to drop it from alex_rivera''s list.'
