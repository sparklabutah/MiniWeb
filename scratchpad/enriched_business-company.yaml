business-company:
  create_by_form:
    - "'Contact' page (/contact) -> contact form: Name (text, required), Email (email, required), Subject (select with 5 fixed options: General Inquiry, Product Demo, Partnership, Support, Careers), Message (textarea, required); 'Send Message' button submits POST /contact -> appends to contacts table, sends confirmation email to inbox, shows success banner. Example: submit Name='Jane Doe', Email='jane@acme.com', Subject='Product Demo', Message='Interested in MeridianFlow.'"
  navigate_by_route:
    - "Header search box (top of every page) or 'Search' page (/search) -> full-text keyword search across all Apex Dynamics content (products, blog posts, team, services, jobs); results grouped by type. Example: query 'Meridian' returns MeridianFlow, MeridianVault, MeridianLens plus matching posts."
    - "Home page (/) 'Featured Products' section -> click a product card title to open its detail page (/product/<id>). Options are the 3 featured products: MeridianFlow (#1), MeridianVault (#2), MeridianLens (#3). Example: click 'MeridianVault' -> /product/2 detail page."
    - "Home page (/) 'Latest Insights' section or 'Blog' page (/blog) -> click a post title to open its detail page (/blog/<id>). Example: click 'Introducing MeridianLens 2.0: Natural-Language Analytics for Everyone' -> /blog/1."
    - "Home page (/) 'Meet Our Team' section or 'Team' page (/about) -> click a member card title to open their profile (/team/<id>). Example: click 'Alex Rivera' -> /team/1."
    - "'Careers' page (/careers) -> click a job title to open its detail page (/careers/<id>). Example: click 'Senior Backend Engineer' -> /careers/1."
  report_information:
    - "'Products' page (/products) -> 'All Categories' category dropdown (filters?category=) with 3 real options: Workflow Automation, Cybersecurity, Data Analytics; plus a 'Search products...' text box (?q=). Outcome: product grid narrows to the chosen category. Example: select 'Cybersecurity' -> shows MeridianVault."
    - "'Careers' page (/careers) -> two dropdowns: 'All Departments' (options: Customer Success, Engineering, Marketing, Sales) and 'All Locations' (options: 'Lakeport, WA (Hybrid)', 'Lakeport, WA or Remote', 'Seattle, WA or Lakeport, WA (Hybrid)'). Selecting reloads with ?department=&location= and filters the job list. Example: department='Engineering' -> shows Senior Backend Engineer, Frontend Engineer, Site Reliability Engineer."
    - "Home page (/) 'Meet Our Team' grid (first 6 of 12 members) and 'Featured Products' grid (3 featured products); also the full 'Team' page (/about) with a 'Filter by Department' dropdown (8 depts incl. Engineering, Sales, Marketing, Product Management, Finance). Example: read that Priya Sharma (#2) is Engineering Manager in Engineering."
    - "Product detail page (/product/<id>) -> reports product name, category badge, description, price (e.g. '$X/month' when set), and a 'Features' checklist. Example: /product/1 (MeridianFlow) shows category 'Workflow Automation' and its feature list."
    - "Job detail page (/careers/<id>) -> reports title, department/location/type badges, salary range ('$min - $max'), full description, and a 'Requirements' bullet list. Example: /careers/1 'Senior Backend Engineer' — Engineering, Lakeport, WA (Hybrid), Full-time."
    - "Team member page (/team/<id>) -> reports name, title, department, bio, Email, Phone, Joined year, LinkedIn link, and 'Colleagues in <department>' list. Example: /team/1 Alex Rivera — Software Engineer, Engineering."
  search:
    - "Header 'Search...' field (name=q) in the navbar at the top of every page -> submits GET /search. Example: type 'MeridianVault' and press Go."
    - "'Search' page (/search) -> main 'Search products, blog posts, team, services, jobs...' field (name=q); results are grouped counts per type (Products, Blog Posts, Team Members, Services, Job Openings). Example: query 'analytics' surfaces MeridianLens and Data Science content."
  toggle_relationship:
    - "Home page (/) 'Subscribe to Our Newsletter' section (email input + 'Subscribe' button, POST /newsletter/subscribe) OR the full 'Newsletter' page (/newsletter) with Name, Email, and 5 Topic checkboxes (Product Updates, Blog & Insights, Company News, Events & Webinars, Career Opportunities). Submitting subscribes the email to the selected topics and shows a success banner. Example: subscribe 'jane@acme.com' with topics Product Updates + Company News."
