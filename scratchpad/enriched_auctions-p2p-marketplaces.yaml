auctions-p2p-marketplaces:
  authenticate_by_form:
  - "Sign In page (/login, linked as 'Sign In' in the top bar) -> Username and Password text fields, then the 'Sign In' button. Outcome: matches credentials against the users table and sets the session, redirecting to the Dashboard (or the ?next= target, e.g. Checkout). Fields: both required; login is by username (not email). Example: sign in as username 'alex_r_photo' (Alex Rivera) to reach that account's dashboard."
  checkout_by_form:
  - "Checkout page (/listing/<id>/checkout), reached via the green 'Buy It Now - $X' button on an active listing detail -> Shipping-address fields (Full name, Street address, City, ZIP code, all required) + Payment radios (Credit Card [default], PayPal, Bank Transfer) + Card number / Expiry / CVC, then the green 'Place order - $X' button. Outcome: charges the card, marks the listing status 'ended' with the buyer as winner_id, and shows an 'Order Confirmed!' receipt with an ORD-<id>-<user> order number. Example: buying listing #28 'Wood TV Stand for 65 Inch TV' charges its Buy It Now price of $287.00."
  configure_by_form:
  - "Index/'BidMarket' page (/) filter bar -> the 'Max Price' range slider (input type=range, min 0, max 999), whose handle sets a live '$<value>' readout beside it. Outcome: dragging the handle configures the price ceiling used by the 'Apply' button; leaving it at 999 means no cap. Example: drag to 200 to show '$200' before applying, capping results to listings priced <= $200."
  create_by_form:
  - "Sell page (/create-listing, 'Sell'/'Sell an Item' link) -> 'Create New Listing' form: Item Name* (text), Description (textarea), Category (dropdown: beauty, electronics, fashion, garden, grocery), Condition (dropdown: New, Like New, Very Good, Good [default], Acceptable), Starting Price ($) (number, default 9.99), Brand (text), Shipping (dropdown: Free Shipping, Standard ($4.99), Expedited ($12.99), Local Pickup); submit 'List Item for Auction'. Outcome: creates an active 7-day auction and redirects to its listing detail. Example: list 'Vintage Film Camera', category electronics, condition Good, starting price 49.99."
  - "Listing detail page (/listing/<id>) -> bid box on an active auction: number input (placeholder 'Enter bid ($X or more)', min = current price + 0.01) + 'Place Bid' button. Outcome: records a bid, raises current_price to the entered amount and increments the bid count. Example: on listing #28 (current bid $194.54) enter 200.00 to become the top bidder."
  - "Listing detail page (/listing/<id>) -> blue 'Watch This Item' button. Outcome: adds the listing to the signed-in user's Watchlist (visible in the Dashboard 'Watchlist' tab); clicking again removes it. Example: watch listing #95 'QAZPL Hair Weaving Deep Curly' to track it."
  - "Register page (/register, 'Register' link) -> 'Create Account' form: Full Name, Email, Username, Password (all required); submit 'Create Account'. Outcome: creates a buyer account, logs in, and redirects to the Dashboard. Example: register Full Name 'Jamie Fox', email 'jamie@example.com', username 'jamie_fox'."
  delete_from_table:
  - "Dashboard (/dashboard) 'My Listings' tab -> red 'Delete' button in the Actions column of each listing row (POSTs to /listing/<id>/delete, removes it and reloads). Outcome: permanently removes that listing from the seller's table. Example: on Marcus Chen's dashboard, delete his listing row for item #186 'Ice Roller For Face'."
  - "Dashboard (/dashboard) 'Messages' tab -> red 'Delete' button in the Actions column of each message row (POSTs to /message/<id>/delete). Outcome: removes that message from the user's inbox/outbox list and reloads."
  edit_by_form:
  - "Edit Listing page (/edit-listing/<id>), reached via the 'Edit' link in the Dashboard 'My Listings' tab -> form with Item Name (text), Description (textarea), Category (dropdown of beauty/electronics/fashion/garden/grocery), Condition (dropdown New/Like New/Very Good/Good/Acceptable), Shipping (text); submit 'Save Changes'. Outcome: updates only those fields and returns to the listing detail (price/bids are NOT editable here). Example: edit listing #28 to change its Condition from 'Like New' to 'Good'."
  filter_by_dropdown:
  - "Index/'BidMarket' page (/) filter bar -> 'Category' dropdown (All Categories, beauty, electronics, fashion, garden, grocery) and 'Status' dropdown (All, Active, Ended, Scheduled); selecting either auto-applies via applyFilters(). Outcome: narrows the grid to listings in that category and/or status. Example: pick Category 'electronics' (464 listings) with Status 'Active' to see only running electronics auctions."
  filter_by_options:
  - "Index/'BidMarket' page (/) filter bar -> 'Condition' radio buttons: All, Acceptable, Good, Like New, New, Very Good (one selectable; auto-applies on change). Outcome: restricts the grid to listings of the chosen condition. Example: select 'New' to show only brand-new items such as #186 'Ice Roller For Face'."
  filter_by_slider:
  - "Index/'BidMarket' page (/) filter bar -> 'Max Price' range slider (0 to 999) sitting after the Sort dropdown, paired with an 'Apply' button. Outcome: after clicking Apply, keeps only listings whose current price is <= the slider value (values below 999 are sent as max_price). Example: set the slider to 50 and click Apply to show only listings $50 or under."
  message_from_free_text:
  - "Listing detail page (/listing/<id>) -> 'Contact Seller' section with a free-text message textarea (placeholder 'Enter your message to the seller...') and a 'Send Message' button; the subject is auto-filled as a hidden field ('Question about: <listing name>') and the recipient is the seller. Outcome: delivers the message to the seller, viewable in the Dashboard 'Messages' tab. Example: on listing #28 message seller 'daniel_o' asking whether the TV stand ships assembled."
  navigate_by_route:
  - "Index/'BidMarket' page (/) -> click a listing card (its title link or image) to open that item's detail page (/listing/<id>). Example: click the card for #28 'Wood TV Stand for 65 Inch TV' to view its detail."
  - "Listing detail page (/listing/<id>) -> click the seller's username link in the 'Seller' box to open their profile (/seller/<seller_id>) listing their items and reviews. Example: on listing #28 click 'daniel_o' to view Daniel Okonkwo's seller page."
  - "Category page (/category/<name>) -> click a listing card's title link to open that item's detail page. Example: from the 'electronics' category page, click a card to view its listing."
  report_information:
  - "Index/'BidMarket' page (/) -> the results grid plus the '<n> listings found' count after choosing Category/Status/Condition/price filters; read counts, prices and badges off the returned cards. Example: report how many active 'fashion' listings appear (fashion has 508 total listings)."
  - "Listing detail page (/listing/<id>) -> full item panel: current bid, starting price, Buy It Now price, num bids, condition, brand, category, item ID (ASIN), shipping, location, seller name/rating, the Bid History table and Seller Reviews. Example: read that listing #28 has a $287.00 Buy It Now price and 15 bids from seller daniel_o (rating 4.5)."
  - "Compare page (/compare?ids=...) -> side-by-side comparison table with rows for ID, Category, Brand, Condition, Current Price, Start Price, Bids, Status, Seller, Shipping, Return Policy and Ends date for the entered listing IDs. Example: compare ids 1,2,3 to read their Current Price and Bids rows together."
  search:
  - "Index/'BidMarket' page (/) -> the 'Search for anything...' text field in the red header bar with its 'Search' button. Outcome: full-text search over listing name, description, category and brand (?q=), reloading the grid. Example: search 'TV stand' to surface #28 'Wood TV Stand for 65 Inch TV'."
  - "Index/'BidMarket' page (/) -> submit the header 'Search for anything...' field, then combine the query with the Category / Status / Condition dropdowns/radios and the Sort dropdown to refine. Outcome: keyword-matched listings restricted by the active filters. Example: search 'hair' then set Category 'beauty' to narrow to items like #95 'QAZPL Hair Weaving'."
  - "Index/'BidMarket' page (/) -> typing a keyword in the 'Search for anything...' field filters the listing grid to matches on name/description/brand/category. Example: search 'costume' to find #2 'Star Wars ... Chewbacca Womens Costume ... Jacket'."
  sort_by_form:
  - "Index/'BidMarket' page (/) filter bar (and Category page sort bar) -> 'Sort' dropdown: Ending Soon (default), Newest, Price: Low to High, Price: High to Low, Most Bids. Outcome: reorders the listing grid accordingly. Example: choose 'Price: High to Low' to put the most expensive listings first, or 'Most Bids' to surface the hottest auctions."
  toggle_relationship:
  - "Listing detail page (/listing/<id>) -> 'Follow Seller' button in the 'Seller' box. Outcome: adds/removes the seller from the signed-in user's followed_sellers (toggles on repeat click). Example: on listing #28 click 'Follow Seller' to follow daniel_o."
  - "Listing detail page (/listing/<id>) -> grey 'Save' button in the actions row (next to 'Watch This Item'). Outcome: toggles the listing in the user's saved_listings (saves it, or unsaves it if already saved). Example: on listing #95 click 'Save' to bookmark it, click again to unsave."
  upload_file:
  - "Sell page (/create-listing) -> 'Upload Photos' dashed drop area ('Click or drag photos here', JPG/PNG up to 5MB) wrapping a hidden file input (accept=image/*). Outcome: attaches a listing image file (the API acknowledges the upload). Example: on the Create New Listing form, click the upload area and choose a product photo before listing the item."
