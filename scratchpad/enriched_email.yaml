email:
  authenticate_by_form:
  - "Login page (/sites/email/login) -> 'Sign In' card with 'Username' and 'Password' text inputs + 'Sign In' submit button. OUTCOME: authenticates the WebMail account and sets session user_id, redirecting to the inbox; wrong creds re-render the card with a red 'Invalid username or password' error. Fields: username (text), password (password). Real accounts: alex_rivera / priya_sharma / marcus_chen / jessica_okafor / david_petrov. EXAMPLE: log in as username 'alex_rivera' with password 'mR!v2025secure' (Alex Rivera, alex.rivera@meridiansystems.com)."
  configure_by_form:
  - "Message detail page (/sites/email/message/<id>) -> bottom action bar 'Move' form (folder <select> + 'Move' button) and 'Add Label' form (free-text 'Label name' input + 'Add Label' button). OUTCOME: reorganizes a message by relocating it to another folder and/or tagging it with a label chip shown under the subject; persists to the per-session email_state overlay. Move options: Inbox/Sent/Drafts/Trash/Spam. Label is free text (suggested set on this account: important, work, personal, urgent, follow-up). EXAMPLE: on 'Invoice #46443 for the roadmap deck' from kira.kowalski@meridiansystems.com (id 2), add label 'work' and move it to Trash."
  create_by_form:
  - "'Compose' page (/sites/email/compose, opened via sidebar 'Compose' button) -> 'To', 'Cc', 'Subject' text inputs and a 'Write your message...' body textarea, then 'Send'. OUTCOME: sends a new email from the logged-in user's address, stores it in the Sent folder (id >= 10000) and, if a recipient is a known app user, drops an inbox copy for them; redirects to Sent. Fields: to (required, comma-separated), cc, subject (defaults to '(no subject)' if blank), body. EXAMPLE: as Alex Rivera compose To 'priya.sharma@meridiansystems.com', Subject 'Roadmap review', body text, and Send."
  - "'Compose' page -> 'To' field (id=to) with placeholder 'Recipients (e.g. user@example.com)'. OUTCOME: this required recipient field determines delivery; addresses are comma-split and only tokens containing '@' are kept. Accepts one or more @meridiansystems.com app users or any external address. EXAMPLE: enter 'marcus.chen@meridiansystems.com, d.solis@summitconstruction.com' to send to two recipients at once."
  delete_from_table:
  - "'WebMail' index list (/sites/email/?folder=inbox) -> trash/bin icon button at the right end of each email row (fires a POST to /message/<id>/delete via fetch, then reloads). OUTCOME: moves that email's folder to 'trash' in the session overlay and removes it from the current list. EXAMPLE: click the trash icon on the 'Your expense report receipt' row from ben.brooks@meridiansystems.com (id 19) to move it to Trash."
  - "Message detail page -> red 'Delete' button in the top toolbar (POSTs to /message/<id>/delete, then returns to the inbox). OUTCOME: sets the open message's folder to 'trash' and navigates back to the inbox list. EXAMPLE: open 'contract renewal — action needed' from rae.rocha@meridiansystems.com (id 7) and click 'Delete' to send it to Trash."
  edit_by_form:
  - "Message detail page -> bottom 'Add Label' form (text 'Label name' input + 'Add Label' button, action=add) and 'Move' form (folder <select> + 'Move' button). OUTCOME: edits the message's metadata in place -- adds a label chip beneath the subject and/or changes its folder, persisted to email_state. Suggested labels on this account: important, work, personal, urgent, follow-up; folders: Inbox/Sent/Drafts/Trash/Spam. EXAMPLE: on 'Reminder: contract renewal on Nov 12' from quinn.quist@meridiansystems.com (id 9), add label 'urgent'."
  filter_by_date_range:
  - "'WebMail' index page -> filter bar above the email list with 'From:' and 'To:' HTML date inputs (name=date_from / date_to, YYYY-MM-DD) plus a blue 'Filter' button; scoped to the current folder and sort. OUTCOME: keeps only emails whose date falls inclusively within the chosen range (lexicographic compare on the ISO date's first 10 chars). EXAMPLE: in Inbox set From 2026-06-24 and To 2026-06-25 to show that day's messages (e.g. the Jun 25 'Invoice #46443' and Jun 24 'contract renewal' emails)."
  filter_by_dropdown:
  - "Message detail page -> 'Move' form folder <select> (Inbox/Sent/Drafts/Trash/Spam) beside its 'Move' button. OUTCOME: choosing a folder and clicking 'Move' relocates the open message into that folder (email_state folder override). EXAMPLE: on the phishing-style 'MeridianFlow API Rate Limits - Quick Question' from m.kessler@columbiariverlogistics.com (id 20070), pick 'Spam' and Move."
  - "'Search' page (/sites/email/search) -> folder <select> in the top search bar with options All folders / Inbox / Sent / Drafts / Trash / Spam (name=folder), submitted alongside the query. OUTCOME: restricts search matches to the chosen folder (empty value = all folders). EXAMPLE: search 'invoice' scoped to 'Inbox' to match 'Invoice #46443 for the roadmap deck' without hitting Sent items."
  filter_by_options:
  - "Message detail page -> 'Mark read' / 'Mark unread' toggle button in the bottom action bar (label flips with the message's current state; POSTs to /message/<id>/read with mark=read|unread). OUTCOME: toggles the email's is_read flag, which drives the bold-unread styling and the per-folder unread badge in the sidebar. EXAMPLE: open the unread 'Reminder: security training on Apr 15' from team@knowledgehub.dev (id 17); the button reads 'Mark unread' (it was auto-marked read on open) -- click it to flip back to unread."
  navigate_by_route:
  - "'WebMail' index page -> 'Search mail...' text input + 'Search' button in the top bar (GET to /sites/email/search). OUTCOME: navigates to the search results page for the typed query across the user's mail. EXAMPLE: type 'contract renewal' and Search to reach the results page listing the rae.rocha and quinn.quist renewal threads."
  - "'WebMail' index page -> click any email row (the row is an anchor to /message/<id>) to open it. OUTCOME: loads that message's detail page (full body, headers, actions) and auto-marks it read. EXAMPLE: click the 'Cascade Timber Onboarding Kickoff - July 1' Sent row (id 20069) to read it."
  - "Left sidebar (all WebMail pages) -> folder links 'Inbox', 'Sent', 'Drafts', 'Trash', 'Spam', each showing an unread badge and a total count in parentheses. OUTCOME: navigates to /sites/email/?folder=<name> listing that folder's messages. EXAMPLE: click 'Sent' to view Alex Rivera's 47 sent messages (e.g. the Summit Construction demo email)."
  - "Top nav / sidebar -> 'Compose' button (sidebar, blue pill) linking to /compose and 'Contacts' link (below the folder list) linking to /contacts. OUTCOME: 'Compose' opens the new-message form; 'Contacts' opens the address book. EXAMPLE: click 'Contacts' to browse the 584 harvested addresses (e.g. albert.hernandez@enron.com)."
  report_information:
  - "Search page (/sites/email/search) -> results list under the 'Search results for \"<q>\" ... N messages found' header, each row showing star, sender, subject, preview, date. OUTCOME: the agent reads/reports matching emails for a query. EXAMPLE: searching 'invoice' surfaces 'Invoice #46443 for the roadmap deck' from kira.kowalski@meridiansystems.com dated Jun 25, 2026."
  - "Sidebar folder links -> selecting a folder returns exactly that folder's emails, with the folder header and a 'N messages' toolbar count on the index. OUTCOME: the agent reports the emails (and total count) contained in the chosen folder. EXAMPLE: opening 'Sent' shows 47 messages; opening 'Inbox' shows 1827 for Alex Rivera."
  - "'WebMail' index page -> email list rows, each rendering sender (from_addr), subject + body preview, date (e.g. 'Jun 25, 2026 11:27 AM') and a star icon; unread rows are bold. OUTCOME: the agent reads sender/subject/date/read-state per message. EXAMPLE: top inbox row 'Invoice #46443 for the roadmap deck' from kira.kowalski@meridiansystems.com, Jun 25 2026 11:27 AM, unread."
  - "Message detail page (/sites/email/message/<id>) -> full email body, headers (From, To:, Cc:), subject, date, and any label chips / attachment references. OUTCOME: the agent reads the complete message content and metadata. EXAMPLE: message id 20071 'Re: MeridianFlow API Rate Limits - Quick Question' from alex.rivera@meridiansystems.com to m.kessler@columbiariverlogistics.com."
  - "'WebMail' index page -> per-row checkbox (name=selected) in the left 'email-check' column plus the 'Select all' checkbox in the toolbar. OUTCOME: selecting rows reveals the bulk Delete / Mark read / Mark unread buttons and reports which messages are chosen for a bulk action. EXAMPLE: tick the checkboxes on the two Jun 24 renewal emails (ids 7 and 9) to bulk-mark them read."
  search:
  - "'WebMail' index page -> 'Search mail...' text field at the top (name=q, GET to /search). OUTCOME: full-text substring search over subject, sender, body and recipient addresses (case-insensitive) for the current user. EXAMPLE: query 'roadmap' matches 'Invoice #46443 for the roadmap deck' from kira.kowalski@meridiansystems.com."
  - "Search page (/sites/email/search) -> search form ('Search mail...' input + folder <select> + 'Search' button). OUTCOME: runs the query (optionally folder-scoped) and lists matching emails with a 'N messages found' count. EXAMPLE: query 'onboarding' returns the 'Cascade Timber Onboarding Kickoff - July 1' Sent message."
  sort_by_form:
  - "'WebMail' index page -> sort <select> in the toolbar with options 'Sort: Date' (default, most-recent first), 'Sort: Subject' (A->Z by subject), 'Sort: From' (A->Z by sender); onchange reloads with ?sort=. OUTCOME: reorders the current folder's list by the chosen key. EXAMPLE: in Inbox pick 'Sort: From' to group emails by sender starting with ben.brooks@meridiansystems.com; default 'Sort: Date' puts the Jun 25 'Invoice #46443' email on top."
  toggle_relationship:
  - "'WebMail' index page -> star button (★) at the start of each email row (POSTs to /message/<id>/star). OUTCOME: toggles is_starred; a set star turns gold (#f4b400) and the message counts toward the account's starred set. EXAMPLE: click the star on 'Reminder: contract renewal on Nov 12' from quinn.quist@meridiansystems.com (id 9) to add it to the 20 starred messages."
  - "Message detail page -> 'Star' / 'Unstar' button in the top toolbar (label reflects current state; POSTs to /message/<id>/star). OUTCOME: toggles the open message's starred flag. EXAMPLE: open 'contract renewal — action needed' from rae.rocha@meridiansystems.com (id 7) and click 'Star'."
  - "Message detail page -> 'More ▾' dropdown in the toolbar -> 'Block sender' button (POSTs to /message/<id>/block). OUTCOME: adds the sender's address to the user's blocked_senders list and moves the message to Spam. EXAMPLE: on the external 'MeridianFlow API Rate Limits - Quick Question' from m.kessler@columbiariverlogistics.com (id 20070), 'Block sender' blocks m.kessler@columbiariverlogistics.com and files the message under Spam."
  upload_file:
  - "'Compose' page (/sites/email/compose) -> 'Attach' file input (name=file, id=attachment) in the compose form, which posts multipart/form-data on 'Send'. OUTCOME: attaches a chosen file to the outgoing message. EXAMPLE: as Alex Rivera, on a new message to priya.sharma@meridiansystems.com click 'Attach', pick a local file, and Send."
