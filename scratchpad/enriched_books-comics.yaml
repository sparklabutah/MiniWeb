books-comics:
  checkout_by_form:
  - "Checkout page (/checkout, requires login) -> order form with Full Name (text), Email (email), Card Number (text, placeholder '4242 4242 4242 4242'), CVV (text, placeholder '123'), and a 'Pay with:' dropdown (options: 'Checking Account' [value checking], 'Credit Card' [value credit]), then the 'Complete Purchase' button. Outcome: charges the card (any card accepted unless a recognized SecureBank card has a wrong CVV), moves cart books into the reading list, clears the cart, and redirects to the 2FA /verify-payment step. Note: every book on the site is free (price 0.0), so the Order Summary Total is always $0.00. Example: with book #3 'TheatreAppreciation' in the cart, fill Full Name 'Alex Rivera', Email, any card number, pick 'Credit Card', and Complete Purchase."
  create_by_form:
  - "Book detail page (/book/<id>, login required) -> Reviews section 'Write your review...' textarea (name=text, id=review-text) + 'Post Review' button. Outcome: appends a new review row (empty rating) attached to that book and re-renders the detail page with the review shown under 'Reviews (N)'. Example: on book #255 'Biology Part II' type a review and click Post Review."
  - "Book detail page (/book/<id>, login required) -> 'Add to Cart' button (id=cart-button) in the actions row. Outcome: toggles the book into the logged-in user's cart (POST /book/<id>/cart) and redirects back to the detail page; the book then appears in the Cart page for checkout. Example: on book #3 'TheatreAppreciation' click Add to Cart."
  feedback_by_star:
  - "Book detail page (/book/<id>, login required) -> 'Rate This Book' section: a range slider (id=rate-slider, name=rating, min=1 max=5 step=0.5, default 4) with a live value label, plus 'Submit Rating' button. Outcome: records a rating review (1-5, clamped) for the book via POST /book/<id>/rate and redirects back to the detail page. Example: on book #3 'TheatreAppreciation' drag the slider to 4.5 and Submit Rating."
  filter_by_dropdown:
  - "Home/'BookVerse' index page (/) -> filter bar dropdowns that reload the grid on change: 'Category' (options: All, plus the 12 real categories Arts & Design, Business & Economics, Education, Engineering, General, Health Sciences, Humanities, Law & Justice, Mathematics, Science, Social Sciences, Technology), 'Min Rating' (Any, 3+, 3.5+, 4+, 4.5+), and 'Price' (All, Free, Paid). Outcome: Category and Min Rating rebuild the results via SQL WHERE (category=slug, rating>=value); Price is offered but every book is free so it is effectively cosmetic. Example: pick Category 'Science' + Min Rating '4.5+' to list only science books rated 4.5 and up (e.g. #255 'Biology Part II', rating 5.0)."
  filter_by_slider:
  - "Reader page (/book/<id>/read) -> 'Reading progress:' range slider (id=progress-slider, min=0 max=100) in the playback controls above the chapter text. Outcome: dragging it updates the on-page progress percentage label and the progress-fill bar client-side (visual only, not persisted). Example: while reading book #3 'TheatreAppreciation' (15 chapters) move the slider to 60%."
  navigate_by_route:
  - "Home/'BookVerse' index page (/) -> click a book card (grid of covers, each titled with author, rating and '(#id)'). Outcome: navigates to that book's detail page /book/<id>. Example: click the '#3 TheatreAppreciation' card to open /book/3. (The index also has a 'Go to Book ID' number box that jumps straight to /book/<id>.)"
  - "Category page (/category/<slug>) -> click a book title in the listed items. Outcome: opens that book's detail page /book/<id>. Example: on /category/science click 'Biology Part II' to open /book/255."
  - "Reader page (/book/<id>/read) -> chapter navigation: 'Previous Chapter'/'Next Chapter' links, 'Previous'/'Next' buttons, and the chapter dropdown; the book detail 'Chapters' list also links each chapter. Outcome: loads a different chapter via ?chapter=N. Example: in book #3 'TheatreAppreciation' (15 chapters) click 'Next Chapter' to go from chapter 1 to 2."
  report_information:
  - "Book detail page (/book/<id>) -> reads on-page book facts: title, author(s), year, category, rating with rating_count, price, chapter count and word count, the 'About This Book' description, the info-table (Category/Subject/Year/Authors/Chapters/Word Count/Price, plus Institution/License when present), the Chapters list, and Reviews. Outcome: agent reports the requested value to the user. Example: read that book #3 'TheatreAppreciation' by Kiara Pipino is a 2023 Arts & Design title with 15 chapters and a 3.6 rating."
  search:
  - "Home/'BookVerse' index page (/) -> top search form input placeholder 'Search books by title, author, or genre...' (name=q) + 'Search' button. Outcome: runs an FTS5/BM25 full-text search over the 1,892 books and reloads the grid with matches. Example: search 'biology' to surface titles like #255 'Biology Part II'."
  - "Home/'BookVerse' index page (/) -> same 'q' search field, used to look up by author name (author links on book detail pages also point back here as ?q=<author>). Outcome: FTS-ranked results; there is no client-side autosuggest (autocomplete is off), results appear only after submitting. Example: search 'Kiara Pipino' to find that author's book #3 'TheatreAppreciation'."
  sort_by_form:
  - "Home/'BookVerse' index page (/) -> 'Sort' dropdown that reloads the grid on change. Real options: 'Newest' (year DESC, default), 'Title A-Z', 'Top Rated' (rating DESC), 'Price: Low-High', 'Price: High-Low', and 'Relevance' (used with a text search). Outcome: reorders results via SQL ORDER BY. Example: choose 'Top Rated' to bring 5.0-rated books like #255 'Biology Part II' to the top."
  toggle_relationship:
  - "Book detail page (/book/<id>, login required) -> 'Follow Author' button (id=follow-button), submits the book's first author. Outcome: toggles that author in the user's followed_authors (POST /book/<id>/follow) and redirects back; the author then shows under 'Followed Authors' in My Library. Example: on book #3 'TheatreAppreciation' click Follow Author to follow 'Kiara Pipino'."
  - "Book detail page (/book/<id>, login required) -> 'Subscribe to <Category>' button (id=subscribe-button), labeled with the book's category. Outcome: toggles that category in the user's subscriptions (POST /book/<id>/subscribe) and redirects back; it appears under 'Subscriptions' in My Library. Example: on book #3 'TheatreAppreciation' click 'Subscribe to arts'."
  - "Book detail page (/book/<id>, login required) -> 'Save to Library' button (id=save-button). Outcome: toggles the book in the user's saved_books (POST /book/<id>/save) and redirects back; saved books appear under 'Saved Books' in My Library. Example: on book #255 'Biology Part II' click Save to Library."
  - "My Library / dashboard page (/dashboard) -> 'Remove' button on each Saved Books row (POST /dashboard/unsave with hidden book_id); the Followed Authors tags also have an 'x' unfollow button. Outcome: removes the book from saved_books (or the author from followed_authors) and reloads the dashboard. Example: click 'Remove' next to a saved '#255 Biology Part II' to unsave it."
