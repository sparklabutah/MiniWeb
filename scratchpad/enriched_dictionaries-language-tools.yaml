dictionaries-language-tools:
  navigate_by_route:
  - Home / Search-results / Browse-A-Z page -> click any blue word link (a '.word-card-word' link in search results, a '.word-link' in Browse, the 'Word of the Day' headword, or a Synonyms/Related-Words tag) OPENS that term's /word/<word> detail page showing definitions, pronunciation, etymology. E.g. clicking 'ephemeral' in results goes to /sites/dictionaries-language-tools/word/ephemeral.
  - Top nav bar (present on every page) -> text links 'Home', 'Search' (both go to the '/' WordRef Dictionary home), 'Browse A-Z' (opens /browse/A letter-index), plus 'Login' when logged out OR the user's name (e.g. 'Alex Rivera' -> /dashboard) and 'Logout' when logged in. Below the search box the A-Z 'alphabet-bar' links each letter to /browse/<letter> (e.g. 'B' -> browse words starting with B).
  play_by_playback:
  - 'Word detail page (/word/<word>) -> pronunciation is shown as read-only IPA TEXT in the ''.word-pronunciation'' line under the headword (there is NO audio player / play button on this site). Multiple IPA variants are separated by a middot. OUTCOME: agent reads the phonetic spelling. E.g. /word/ephemeral shows the IPA ''/ɛˈfɛ.mə.ɹəl/''.'
  report_information:
  - 'Home page search (''Search for a word...'' box) -> submitting a query renders a ''Search Results'' section of ''.word-card''s; agent reports each word''s part-of-speech tag, IPA, definition count and first-gloss shown. OUTCOME: summarize matches. E.g. q=''happy'' -> header ''22 results for "happy" (page 1 of 2)'' listing ''happy'', ''happy as a lark'', ''happy camper'', ''Happy Christmas''...'
  - 'Word detail page (/word/<word>) sections -> agent reports the numbered Definitions (each with optional grammar tags, italic quoted usage examples, and per-sense Synonyms), plus the standalone ''Synonyms'', ''Antonyms'' and ''Related Words'' tag lists. E.g. /word/ephemeral def 1: ''Something which lasts for a short period of time.'', Synonyms: ''ephemeron''.'
  - 'Word detail page (/word/<word>) -> agent reports the headword''s IPA pronunciation, part-of-speech badge, inflected ''Forms'', the ''Etymology'' paragraph, ''Hyphenation'' and ''Categories''. OUTCOME: read facts off the entry. E.g. /word/ephemeral shows pos ''adjective'', an Etymology section and a Categories section.'
  search:
  - 'Home page (''/'') -> the centered ''.search-bar'' text input with placeholder ''Search for a word...'' plus a red ''Search'' button (GET ?q=). OUTCOME: case-insensitive substring match on headwords, relevance-ranked exact>prefix>contains, 20 results/page with Previous/Next pagination. E.g. q=''ephemeral'' returns the ''ephemeral'' entry.'
  - The 'Search for a word...' box on the home page is autofocused on load (input has 'autofocus'); on the word-detail and browse pages the same search box appears in the top '.search-strip' with placeholder 'Search for another word...' / 'Search for a word...'. Submitting reloads '/' with results. E.g. type 'happy' -> 22 matching entries.
  toggle_relationship:
  - 'Word detail page (/word/<word>) -> the ''.save-btn'' next to the headword (only shown when logged in) toggles saving the word to the user''s saved list. Label reads ''Save Word'' when not saved and ''Saved'' (filled) when saved; it POSTs to /word/<word>/save. OUTCOME: word added to / removed from the account''s saved words. E.g. on /word/firebrand as Alex Rivera the button shows ''Saved''.'
  - 'Dashboard (/dashboard) ''Saved Words'' section -> each saved entry has a ''Remove'' button (POST to /word/<word>/save) that un-saves it. OUTCOME: word dropped from the saved list. E.g. Alex Rivera''s saved words are ''firebrand'', ''bespoke'', ''prescience'', each removable here.'
  translate_by_query:
  - 'Home page ''Search for a word...'' box -> this is a monolingual dictionary lookup (no dedicated translation panel); foreign-language headwords are looked up the same way because they exist as entries in the dictionary. OUTCOME: the matching entry''s definition/part-of-speech is shown. E.g. searching ''chien'' or ''livre'' returns those non-English entries; ''gratis'' resolves to an adjective entry.'
