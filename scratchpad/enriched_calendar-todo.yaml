calendar-todo:
  create_by_form:
    - "Sidebar 'Create' button (round + button, top of left sidebar) opens the 'New Event' modal; filling it and pressing 'Save' POSTs to /create and adds a new event to the calendar (owner set by the 'User' dropdown, status defaults to 'confirmed'). Fields: 'Add title' (required), 'Start'/'End' datetime-local (required), 'Category', 'Calendar', 'Priority', 'Location', 'Invite people', 'User', description. Example: create 'Team Retro' on 2026-06-22T15:00 in the Work calendar for Alex Rivera."
    - "'New Event' modal -> three <select> dropdowns that set the event's classification: 'Category' (Work / Personal / Health), 'Calendar' (options built from existing calendars: Work, Personal, Health), 'Priority' (High / Medium / Low, defaults to Medium). Outcome: the saved event carries these tags (e.g. category=health, calendar=Health, priority=high, like the existing 'Gym - Strength Training')."
    - "'New Event' modal -> 'Add title' text input at the top of the form (name=title, required); its value becomes the new event's title shown across the grid and detail page. Example value: 'Daily Standup'."
    - "'New Event' modal -> 'Start' and 'End' datetime-local inputs (both required) that set the event's date and time window; clicking an empty hour slot or a day-header number pre-fills them (e.g. Start 2026-06-22T09:00, End 2026-06-22T10:00)."
    - "Event detail page -> 'Invite by email...' form at the bottom (email input + 'Invite' button, POSTs to /api/events/<id>/invite); on submit the address is appended to that event's Attendees list. Example: invite priya.sharma@meridiansystems.com to event 1 'Daily Standup'."
  delete_from_table:
    - "Event detail page -> red 'Delete' button in the Actions row; clicking it POSTs to /event/<id>/delete and permanently removes the event, then redirects to the main calendar. Example: on event 2 'Sprint Planning', 'Delete' removes it from Alex Rivera's calendar."
  edit_by_form:
    - "Edit event page (/event/<id>/edit, reached via the 'Edit' button on the detail page) -> full edit form; 'Save Changes' POSTs to /event/<id>/edit and updates the event in place. Fields: Title, Description, Category (Work/Personal/Health), Calendar (Work/Personal/Health), Start, End, Location, Priority (High/Medium/Low), Status (Confirmed/Cancelled/Tentative). Example: change event 3 '1:1 with Priya' Status to Cancelled."
    - "Edit event page -> 'Start' and 'End' datetime-local inputs for rescheduling; editing them and saving moves the event to a new date/time. Example: reschedule event 1 'Daily Standup' from 2025-09-15T09:30 to 2025-09-16T09:30."
  export:
    - "Left sidebar 'Export' section (below the filters) -> 'CSV', 'ICS', and 'JSON' links hitting /api/export?format=...; each downloads all events in that format (CSV columns: id,user_id,title,category,calendar,start,end,priority,status,location,recurring). The same endpoint accepts category= and user_id= to scope the export, e.g. only Alex Rivera's Work events."
  filter_by_date_range:
    - "Left sidebar 'Date Range' section -> 'From:' and 'To:' date inputs plus the 'Apply Date Range' button; applying reloads the calendar with date_from/date_to query params so only events whose start date falls in the window are shown. Example: From 2025-09-15 To 2025-09-19 shows that week's standups and reviews."
  filter_by_dropdown:
    - "Left sidebar 'Category' dropdown (options: All, Work, Personal, Health) -> reloads with category= and shows only events in that category. Example: 'Health' surfaces events like 'Gym - Strength Training'."
    - "Left sidebar 'Priority' dropdown (options: All, High, Medium, Low) -> reloads with priority= and keeps only events at that priority. Example: 'High' surfaces 'Sprint Planning' and 'Deployment Window - MeridianFlow v3.4'."
    - "Left sidebar 'User' dropdown (options: All + every user by name, e.g. Alex Rivera, Priya Sharma, Marcus Chen, Natalie Kim) -> reloads with user_id= and shows only that owner's events. Example: 'Priya Sharma' (id 2) shows only her events."
    - "Left sidebar 'Sort' dropdown (options: Date, Title, Priority) -> reloads with sort= and re-orders the visible events; not a filter but a same-panel <select>. Example: 'Title' orders events alphabetically."
  navigate_by_route:
    - "Week grid -> clicking an event block (or an all-day event) navigates to /event/<id>, the event detail page. Example: clicking 'Daily Standup' opens event 1's details."
    - "Top header bar -> 'Day' and 'Week' links; 'Day' goes to /day/<simulated_today> (2026-06-21) and 'Week' returns to the main week view (week_offset=0). Outcome: switches the calendar viewing window."
    - "Top header bar -> the logged-in user's name link (e.g. 'Alex Rivera') navigates to /dashboard, that user's personal event dashboard listing their events and upcoming items."
  report_information:
    - "Search results -> after submitting the top search bar, the calendar shows only events whose text matches the query (FTS over title/description/location). Example: searching 'Standup' returns 'Daily Standup'."
    - "Sidebar Category/Priority/User filters -> the week grid and 'Upcoming Events' list are narrowed to the matching events, letting the agent read/count what remains (e.g. how many High-priority Work events this week)."
    - "Event detail page -> full event info to read off: Date, Time, Calendar, Location, Description, Owner (name + email), Reminder (minutes before), Status, and the Attendees list. Example: event 1 shows owner 'Alex Rivera (alex.rivera@meridiansystems.com)'."
    - "Day/Week views (/day/<date> and /week/<date>) -> events restricted to the selected date window, sorted by start time, so the agent can read the schedule for a given day or week. Example: /day/2026-06-21 lists that day's events."
  search:
    - "Top header bar -> magnifier icon toggles a search bar with a 'Search events...' text input (name=q) and 'Search' button; submitting runs a full-text search across event title/description/location. Example: 'Gym' matches 'Gym - Strength Training' and other gym sessions."
  share_by_form:
    - "Event detail page -> 'Share' button in the Actions row; clicking copies the current event URL to the clipboard and briefly shows 'Link Copied!'. Example: share event 5 'Engineering All-Hands' to copy its link."
  sort_by_form:
    - "Left sidebar 'Sort' dropdown (options: Date, Title, Priority) -> reloads the calendar with sort= and reorders the visible events (Date = by start time, Title = alphabetical, Priority = High->Low). Example: 'Priority' floats 'Sprint Planning' (high) above medium/low events."
