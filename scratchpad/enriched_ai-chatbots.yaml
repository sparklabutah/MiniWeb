ai-chatbots:
  authenticate_by_form:
  - 'Login page (/login) "Sign In" form -> Username + Password text/password fields,
    then "Sign In" button. Outcome: authenticates and sets the session, landing on
    the AI Chatbots Hub home with the user''s conversations. Credentials are matched
    against the users table. Example: sign in as username "alex_rivera" (Alex Rivera,
    id 1, pro plan).'
  configure_by_form:
  - 'Settings page (/settings) "Preferences" form -> three dropdowns: Default Bot
    (Assistant / Creative / Analyst), Theme (Dark / Light), Font Size (Small / Medium
    / Large), plus "Enable Notifications" and "Save Chat History" toggle switches;
    "Save Settings" button persists them. Outcome: updates the logged-in user''s preferences.
    Example: set Default Bot to "Analyst" and Theme to "Light" for Alex Rivera.'
  create_by_form:
  - '"+ New Chat" button at the top of the left sidebar (posts to /form/new-conversation).
    Outcome: creates a new empty conversation titled "New Chat #N" for the current
    user and opens it in the chat view. A bot (default "Assistant") is attached.'
  - 'Chat page (/chat) bottom "Send a message..." textarea + "Send" button (posts
    to /form/chat). Outcome: appends the user message, generates a deterministic bot
    reply, and creates the conversation on first send (title = first 50 chars of the
    message). Example: type "Explain machine learning" to the Assistant bot.'
  - 'Register page (/register) "Create Account" form -> Username (required), Password
    (required), Email (optional), and Display Name (optional) fields, then "Create
    Account" button. Outcome: creates a new user (defaults: free plan, dark theme,
    medium font, Assistant bot) and logs them in. Note: there is no "confirm password"
    field.'
  delete_from_table:
  - 'Chat page (/chat/<id>) top bar "Delete" button (red, next to Edit Title / Share;
    posts to /form/conversation/<id>/delete). Outcome: permanently deletes the open
    conversation and redirects to a fresh chat. Example: delete conv_001 "MeridianFlow
    API rate limits".'
  - 'Left sidebar conversation list -> hover a conversation row and click its "x"
    (times) button (posts to /form/conversation/<id>/delete). Also available as a
    "Delete" button per row in the Home page "Recent Conversations" table. Outcome:
    removes that conversation and reloads. Example: delete "Hiking trails near Lakeport"
    (conv_003).'
  edit_by_form:
  - 'Chat page (/chat/<id>) top bar "Edit Title" form -> a text input prefilled with
    the current title plus an "Edit Title" submit button (posts to /form/conversation/<id>/edit-title).
    Outcome: renames the open conversation. Example: rename conv_001 from "MeridianFlow
    API rate limits" to "MeridianFlow rate-limit help".'
  - 'Same chat top-bar title form: overwrite the "New title" text field value and
    click the submit button to save. Outcome: updates conv.title and updated_at; a
    blank title is ignored. Example: retitle conv_005 "Setting up webhooks in MeridianFlow".'
  export:
  - 'Settings page (/settings) "Export Data" section -> "Export Type" dropdown (My
    Conversations / Knowledge Base / Prompts Library) + "Format" dropdown (JSON /
    CSV), then the "Export" button opens /api/export as a download. Outcome: downloads
    the chosen dataset (conversations are scoped to the current user). Example: export
    My Conversations as CSV for Alex Rivera.'
  navigate_by_route:
  - 'Left sidebar conversation list -> click a conversation title to open it at /chat/<id>.
    Outcome: loads that conversation''s messages in the chat view. Example: click "MeridianFlow
    API rate limits" (conv_001) to open it.'
  - 'Left sidebar bottom navigation links -> "Home", "Chat", "FAQ", "Settings", and
    "Login"/"Logout". Outcome: routes to the corresponding page (there is no top nav
    bar; Prompts Library and Knowledge Base are reached by URL, not from this nav).
    Example: click "Settings" to reach the preferences page.'
  report_information:
  - 'Home page (AI Chatbots Hub, "/") "Recent Conversations" table -> columns Title,
    Bot, Messages, Last Updated, Actions for the current user''s non-archived conversations.
    Outcome: read/report a value from a row. Example: conv_001 "MeridianFlow API rate
    limits" shows bot "Assistant" and its message count.'
  - 'Knowledge Base page (/knowledge) entries table -> columns ID, Topic, Category,
    Keywords. Outcome: read/report an entry''s fields. Example: entry #1 "MeridianFlow
    Workflow Automation" is in category "meridian_products".'
  - 'Chat page (/chat/<id>) message thread -> alternating "You" and bot (Assistant/Creative/Analyst)
    message bubbles rendered in order. Outcome: read/report the conversation content
    (e.g., the assistant''s answer). Example: read the reply in conv_001.'
  search:
  - 'FAQ page (/faq) top "Search FAQ..." text box + "Search" button (GET ?q=). Outcome:
    filters FAQ cards whose question or answer contains the query (no category dropdown
    here). Example: search "MeridianFlow" to surface "What is MeridianFlow?".'
  - 'Knowledge Base page (/knowledge) top "Search knowledge base..." text box + "Search"
    button (GET ?q=). Outcome: filters the entries table by topic/content/keyword
    match. Example: search "webhook" to find "MeridianFlow API and Integrations".'
  - 'Prompts Library page (/prompts) top "Search prompts..." text box + "Search" button
    (GET ?q=), alongside a category dropdown. Outcome: filters prompt cards by title/prompt/category/tag.
    Example: search "code review" to find "Code Review Checklist".'
  - 'Knowledge Base page (/knowledge) search bar "All Categories" dropdown combined
    with the text box -> category options are lakeport_services, local_attractions,
    local_business, local_restaurants, meridian_products. Outcome: narrows entries
    to the selected category (and query). Example: pick "meridian_products".'
  share_by_form:
  - 'Chat page (/chat/<id>) top bar "Share" button (posts to /form/conversation/<id>/share
    with share_with="public"). Outcome: marks the open conversation shared=true and
    adds it to the user''s shared_conversations list. Example: share conv_001 "MeridianFlow
    API rate limits".'
  toggle_relationship:
  - 'Prompts Library page (/prompts) "Save" button on each prompt card (posts prompt_id
    to /form/save-prompt; shown only when logged in). Outcome: toggles the prompt
    in the user''s saved_prompts (save if absent, unsave if present). Example: Save
    prompt #1 "Code Review Checklist" (category coding, popularity 95%).'
  - 'Settings page (/settings) "Subscription Plan" radio buttons -> Free Plan / Pro
    Plan / Enterprise Plan (values free/pro/enterprise); saved via "Save Settings".
    Outcome: sets the user''s subscription. Example: switch Alex Rivera from "pro"
    to "enterprise".'
  upload_file:
  - 'Settings page (/settings) "Import File to Knowledge Base" section -> file input
    accepting .txt/.md/.csv/.json plus optional Topic (defaults to filename) and Category
    (defaults to "uploaded") fields, then "Upload File" button (async POST to /api/upload).
    Outcome: reads the file contents and adds a new knowledge_base entry. A parallel
    "Upload Document to Knowledge Base" form on the same page accepts Topic/Category/Content/Keywords
    typed directly.'
