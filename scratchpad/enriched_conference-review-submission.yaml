conference-review-submission:
  authenticate_by_form:
  - "Login page (/login, header 'PeerPortal') -> the 'Username' text field
    (name=username, placeholder 'Enter your username') and 'Password' field
    (name=password, placeholder 'Enter your password'), then the 'Sign In' button.
    OUTCOME: sets the conf_review_uid session and redirects to /console; wrong
    credentials re-render the form with 'Invalid username or password'. Real
    accounts (username / password): author_arivera / pass123 (Alex Rivera,
    reviewer), reviewer_psharma / pass456, chair_knguyen / pass321 (chair).
    EXAMPLE: sign in as author_arivera / pass123 to reach the reviewer console."
  create_by_form:
  - "Review form (/paper/<id>/review, 'Submit Review', reached via the 'Submit
    Review'/'Write Review' button) -> 'Review Title' text input (name=title),
    'Recommendation' dropdown (name=recommendation, options 1-10, e.g. '10: Top 5%
    of accepted papers, seminal', '6: Marginally above threshold', '3: Clear
    reject'), 'Confidence' dropdown (name=confidence, options 1-5, e.g. '5:
    Absolutely certain (expert)', '3: Fairly confident'), and a 'Review' comments
    textarea. OUTCOME: POST stores the review under the user's bids[paper_id] and
    fires a 'Review submitted' email, then redirects to the paper page. EXAMPLE:
    on paper 304 'Making Neural Programming Architectures Generalize...' pick
    recommendation '8: Top 50%, clear accept', confidence '4: Quite confident'."
  - "Paper detail page (/paper/<id>) -> the bid button in the action bar, labelled
    'Bid to Review' when you have not bid and 'Withdraw Bid' when you have (POST
    /paper/<id>/bid). OUTCOME: toggles an entry in your bids map declaring review
    interest and redirects back to the paper. EXAMPLE: click 'Bid to Review' on
    paper 305 'End-to-end Optimized Image Compression' (ICLR 2017)."
  - "Review form (/paper/<id>/review) -> the single 'Review' comments textarea
    (name=comments, required). Its placeholder is a Markdown template with
    '## Summary', '## Strengths', '## Weaknesses', '## Questions' and
    '## Minor Comments' section headers (these are NOT separate form fields), and
    the hint reads 'Provide detailed comments on strengths, weaknesses, clarity,
    novelty, significance...'. OUTCOME: the free-text is saved as the review's
    comments. EXAMPLE: type a strengths/weaknesses write-up for paper 306
    'Optimization as a Model for Few-Shot Learning'."
  - "Login page (/login) -> the username + password sign-in form (POST /login).
    OUTCOME: authenticates and creates the reviewer/author session, landing on
    /console. EXAMPLE: submit chair_knguyen / pass321 to sign in as chair Karen
    Nguyen."
  delete_from_table:
  - "Paper detail page (/paper/<id>) -> in the 'Submission Details' metadata grid,
    the 'Withdraw' row's 'Withdraw Submission' button (id=withdraw-btn, red text,
    POST /paper/<id>/withdraw with a JS confirm 'Withdraw this submission? It will
    be removed from the venue.'). OUTCOME: calls db.delete_item on the paper,
    removing it from its venue, then redirects to /console. EXAMPLE: withdraw
    paper 307 'Learning End-to-End Goal-Oriented Dialog' from ICLR 2017."
  edit_by_form:
  - "Paper detail page (/paper/<id>) -> the toggle bid button, which reads 'Bid to
    Review' before you bid and flips to 'Withdraw Bid' after (POST /paper/<id>/bid,
    the same button re-labels on reload). OUTCOME: adds or removes your interest
    entry in the bids map and redirects back to the paper. EXAMPLE: on paper 308
    'Towards Principled Methods for Training Generative Adversarial...' the button
    toggles between 'Bid to Review' and 'Withdraw Bid'."
  navigate_by_route:
  - "PeerPortal landing / Venues page (/ or /venues, heading 'PeerPortal') ->
    click a venue-card name link to open that venue's paper list
    (/venue/<venue_id>); the link is only active when the venue has papers
    (paper_count > 0). OUTCOME: loads the venue submissions page. EXAMPLE: click
    'ICLR 2017' (349 papers) to open /venue/iclr-2017, or 'NeurIPS 2016'."
  - "Venue page (/venue/<venue_id>) -> click a paper title link in the submissions
    list to open its detail page (/paper/<paper_id>). OUTCOME: shows the paper's
    abstract, reviews and scores. EXAMPLE: in ICLR 2017, click 'End-to-end
    Optimized Image Compression' to reach /paper/305."
  report_information:
  - "Venue page (/venue/<venue_id>) search results -> the filtered submissions list
    renders each matching paper's title, author string, decision badge
    (Accept/Reject) and average score (when review_visibility is public or the
    viewer is a chair/admin). OUTCOME: the agent reads/reports the matching papers
    and their scores. EXAMPLE: searching 'compression' in ICLR 2017 surfaces
    'End-to-end Optimized Image Compression' with its avg score."
  - "Stats page (/venue/<venue_id>/stats, 'Statistics') -> stat cards (Total
    Reviews, Avg Score), a 'Score Comparison' row ('Avg Score (Accepted)', 'Avg
    Score (Rejected)', 'Median Score'), and a 'Score Distribution' table (Score /
    Count / Distribution bar). OUTCOME: the agent reports acceptance rate, average
    and score-bucket counts. EXAMPLE: ICLR 2017 shows 349 papers, 139 accepted,
    acceptance rate 39.8%."
  - "Paper detail page (/paper/<id>) -> the paper header (title, authors, decision
    badge, average score) plus the reviews section listing each reviewer's
    recommendation (1-10) and confidence (1-5), gated by the venue's
    review_visibility. OUTCOME: the agent reads/reports the paper's info, reviews
    and scores. EXAMPLE: paper 304 'Making Neural Programming Architectures
    Generalize...' shows decision Accept, avg score 8.33 across 12 reviews."
  search:
  - "Venue page (/venue/<venue_id>) -> the 'Search by title or keyword...' text
    field (name=q) at the top of the filter panel, submitted with the 'Apply
    Filters' button. OUTCOME: runs an FTS5/BM25 full-text search over the venue's
    papers and re-renders the list with matches (combinable with the
    Accepted/Rejected status radios and score_min/score_max 1-10 range).
    EXAMPLE: search 'dialog' within ICLR 2017 to find 'Learning End-to-End
    Goal-Oriented Dialog'."
  - "Venue page (/venue/<venue_id>) search (name=q, also exposed at
    /api/papers/search) -> BM25-ranked keyword matching over paper titles and
    abstracts, scoped to the current venue_id. OUTCOME: returns ranked matching
    papers that can then be sorted via the 'Sort' radios (Title, Score high/low
    first, Most reviewed). EXAMPLE: searching 'generative adversarial' in ICLR
    2017 ranks 'Towards Principled Methods for Training Generative Adversarial...'
    first."
  upload_file:
  - "Console page (/console, 'Submit a Paper' section) -> the file input
    (name=file, accept='.pdf,.doc,.docx,.tex') plus the 'Upload Paper' button
    (POST /upload-paper, multipart form). OUTCOME: accepts the chosen manuscript
    file and redirects back to the console. EXAMPLE: while signed in as Alex
    Rivera, choose a .pdf and click 'Upload Paper'."
