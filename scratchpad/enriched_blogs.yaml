blogs:
  create_by_form:
  - "'Compose' page (/sites/blogs/compose, reached via top-nav 'Compose' button) -> 'Compose New Post' form. Fields: Title (text, required), Body (textarea, required), Category (<select> with 10 fixed options: Technology, Travel, Food, Art, Books, Fitness, Music, Lifestyle, Photography, Gaming), Tags (comma-separated text, e.g. 'python, tutorial, webdev'), Image URL (optional text), Author Username (text, prefilled with logged-in username). 'Publish Post' submit creates a new post (notes_count=0, date=today) and redirects to its detail page. Example: publishing Title='My First Post', Category='Technology', Author Username='alex_codes' creates a post authored by Alex Codes."
  - "Post detail page (/sites/blogs/post/<id>) -> 'Comments' section, 'Write a comment...' textarea (visible only when logged in) + 'Post Comment' button. Submitting adds a dated comment attributed to the current user under the article. Example: on post #6 'Elden Ring DLC: 40 Hours In...' by marcus_builds, a comment posts as the auto-logged-in user alex_codes."
  filter_by_date_range:
  - "'TumblrVibe' home page (/sites/blogs/) -> left sidebar 'Filters' section -> 'From:' and 'To:' <input type=date> fields, applied via 'Apply Filters' button. Filters the feed to posts whose date falls within the range (SQL date >= from AND date <= to). Post dates run through 2026-06-18 (newest is post #13). Example: From=2026-06-01 To=2026-06-18 returns only June 2026 posts such as #13 'How We're Using AI at SyncWave'."
  filter_by_dropdown:
  - "'TumblrVibe' home page (/sites/blogs/) -> left sidebar 'Categories' section -> clickable category link list (rendered as tags, NOT an HTML <select>): 'All' plus the 15 categories present in data: Art, Books, Design, Fitness, Food, Gaming, History, Lifestyle, Marketing, Music, Outdoors, Photography, Startups, Technology, Travel. Clicking one (adds ?category=) filters the feed to that category. Example: clicking 'Gaming' shows posts like #6 'Elden Ring DLC: 40 Hours In...' by marcus_builds."
  - "'TumblrVibe' home page (/sites/blogs/) -> left sidebar 'Filters' section -> 'Sort:' <select> with 3 options: Newest (date DESC, default), Oldest (date ASC), Popular (notes_count DESC). Applied via 'Apply Filters' button; re-orders the feed. Example: 'Popular' surfaces post #6 'Elden Ring DLC...' (412 notes) at the top."
  navigate_by_route:
  - "'TumblrVibe' home page (/sites/blogs/) -> click a post-card title link (e.g. \"Elden Ring DLC: 40 Hours In... (Post #6)\") to open its detail page at /sites/blogs/post/<id>, showing the full article, tags, comments, and action bar. Example: clicking post #6's title navigates to /sites/blogs/post/6."
  - "Top navigation bar (present on every blogs page) -> 'Compose' button (-> /sites/blogs/compose new-post form) and 'Dashboard' link (-> /sites/blogs/dashboard; shows the logged-in user's own posts and saved posts). Dashboard/Compose appear when logged in (auto-login sets user_id=1 = alex_codes)."
  report_information:
  - "'TumblrVibe' home page (/sites/blogs/) -> left sidebar 'Search' box submits ?q= and the feed re-renders as matching post cards; the 'result-info' line reads e.g. 'N posts matching \"query\"'. Read the returned card count/titles to answer. Example: searching 'Elden Ring' returns post #6 by marcus_builds and shows the match count."
  - "'TumblrVibe' home page (/sites/blogs/) -> left sidebar 'Categories' link list filters the feed by category and the 'result-info' line reads 'N posts in <Category>'. Read the count or the listed titles/authors. Example: selecting 'Gaming' shows the Gaming post count and cards such as #6 'Elden Ring DLC...'."
  - "Post detail page (/sites/blogs/post/<id>) -> full post content: title, body, author (display name + @username), date, category badge, tags, notes count and shares, plus the Comments list. Read these to answer. Example: post #6 shows author marcus_builds, category Gaming, 412 notes, tags #gaming #review #elden-ring."
  search:
  - "'TumblrVibe' home page (/sites/blogs/) -> left sidebar 'Search' section -> 'Search posts...' text input (name=q) + 'Search' button. Full-text search over title/body/author (FTS5 with LIKE fallback); reloads the feed with matching post cards. Example: 'AI' matches post #13 'How We're Using AI at SyncWave' by jake_builds_things."
  share_by_form:
  - "Post detail page (/sites/blogs/post/<id>) -> 'Share' button in the post-meta row (data-miniweb-share, opens the platform's share widget). Backend POST /api/posts/<id>/share increments the post's shared_count and returns a share_url like /sites/blogs/post/6. Example: sharing post #6 'Elden Ring DLC...' bumps its shares count."
  sort_by_form:
  - "'TumblrVibe' home page (/sites/blogs/) -> left sidebar 'Filters' section -> 'Sort:' <select> (name=sort), applied via 'Apply Filters'. Options: Newest (date DESC, default), Oldest (date ASC), Popular (notes_count DESC). Example: choosing 'Oldest' orders the feed by ascending date; 'Popular' puts post #6 (412 notes) first."
  toggle_relationship:
  - "Post detail page (/sites/blogs/post/<id>) -> action bar 'Follow @<username>' button (blue btn-follow; toggles to 'Unfollow @<username>' once followed). Adds/removes the post's author to the current user's followed_blogs. Visible only when logged in. Example: on post #6, the button reads 'Follow @marcus_builds'."
  - "Post detail page (/sites/blogs/post/<id>) -> action bar 'Subscribe #<tag>' button(s) (green btn-subscribe, one per post tag; toggles to 'Unsubscribe #<tag>'). Adds/removes the tag from the user's subscribed_tags. Example: post #6 shows 'Subscribe #gaming', 'Subscribe #review', 'Subscribe #elden-ring'."
  - "Post detail page (/sites/blogs/post/<id>) -> action bar 'Save Post' button (red btn-save; toggles to 'Unsave Post' once saved). Adds/removes the post id in the user's saved_posts (also shown on the Dashboard 'saved' list). Example: saving post #6 'Elden Ring DLC...' adds it to alex_codes's saved posts."
