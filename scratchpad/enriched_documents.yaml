documents:
  create_by_form:
  - 'New Document page (/sites/documents/new, opened via the blue ''+ New Document'' button top of left sidebar) -> form posting to /document/create. Fields: ''Title'' text input (required), ''Content'' textarea, ''Owner'' <select> listing all 5 users as ''Name (ID n)'' (Alex Rivera ID 1, Priya Sharma ID 2, Marcus Chen ID 3, Jessica Okafor ID 4, David Petrov ID 5; defaults to logged-in user), and ''Folder (optional)'' <select> with ''No folder'' plus 14 folders as ''Name (ID n)'' (Engineering ID 1, Product ID 2, Meeting Notes ID 3, Personal ID 4, Shared ID 5, DevOps ID 6, ...). OUTCOME: creates a new document (word_count computed, adds a ''Created document'' revision) and redirects to its editor. EXAMPLE: Title ''Sprint 25 Planning'', Owner ''Priya Sharma (ID 2)'', Folder ''Meeting Notes (ID 3)''.'
  - 'New Document page (/sites/documents/new) -> same ''New Document'' card with Title input, Content textarea, Owner dropdown and Folder dropdown, submitted via the ''Create Document'' button. OUTCOME: POST /document/create inserts the doc and redirects to /editor/<new_id>. EXAMPLE: create ''DevOps On-Call Rotation'' owned by ''David Petrov (ID 5)'' in folder ''DevOps (ID 6)''.'
  - 'Editor page (/sites/documents/editor/<id>) -> ''Share / Details'' side panel (opened by the blue ''Share / Details'' toolbar button) ''Add Collaborator'' form posting to /document/<id>/share. Controls: ''User'' <select> (all users except the doc owner, as ''Name (ID n)'') and ''Permission'' <select> with options View / Comment / Edit; ''Share'' button adds the collaborator. A separate ''Share via Email'' form takes an email + permission. OUTCOME: appends/updates a collaborator entry and reloads the editor. EXAMPLE: on ''RFC: MeridianFlow API Redesign'' (doc 1) add ''Jessica Okafor (ID 4)'' with Permission ''Comment''.'
  delete_from_table:
  - 'Trash page (/sites/documents/trash) -> ''Delete forever'' button on each trashed document row (shown only when logged in as that doc''s owner). OUTCOME: POST /document/<id>/delete permanently removes the document and its revisions (JS fetch, then the list reloads). EXAMPLE: permanently delete ''Deleted Draft - Old Webhook Spec'' (doc 18, owner Marcus Chen ID 3).'
  - 'Editor toolbar and read-only View page (/sites/documents/editor/<id> or /view/<id>) -> red ''Trash'' / ''Delete'' button (owner only, with a ''Move to trash?'' confirm). OUTCOME: POST /document/<id>/trash sets is_trashed=1 and moves the document to Trash (recoverable), redirecting to the dashboard. EXAMPLE: from the editor of ''Alex''s Reading List'' (doc 12, owner Alex Rivera ID 1) click Trash to move it to the Trash page.'
  edit_by_form:
  - 'Editor page (/sites/documents/editor/<id>) -> inline edit form (shown to owner/edit collaborators) posting to /document/<id>/update: ''Document Title'' text input and ''Content'' textarea, saved with the ''Save Changes'' button. OUTCOME: updates title/content, recomputes word_count, sets updated_at, and appends an ''Updated via form'' revision. EXAMPLE: open ''PRD: MeridianLens 2.0'' (doc 5, owner Jessica Okafor ID 4), edit the title to ''PRD: MeridianLens 2.1'' and Save Changes.'
  filter_by_date_range:
  - 'Dashboard / DocEdit index (/sites/documents/) -> toolbar filter row beside the ''Sort:'' dropdown: a ''From:'' <input type=date> (name=date_from) and ''To:'' <input type=date> (name=date_to) with a blue ''Filter'' button. NOTE: the index() route does not read date_from/date_to, so submitting reloads the list UNCHANGED (verified: 158 documents shown with and without From=2030-01-01/To=2030-12-31) -- the control is present but currently has no filtering effect. EXAMPLE: setting From 2026-01-01 / To 2026-02-28 and clicking Filter re-renders the same document set.'
  navigate_by_route:
  - 'Dashboard / DocEdit index (/sites/documents/) -> click any document card (its title or content preview tile) in the grid. OUTCOME: navigates to that document''s editor (/editor/<id>). EXAMPLE: click the ''RFC: MeridianFlow API Redesign'' card to open /sites/documents/editor/1.'
  - 'Left sidebar (dashboard) -> navigation links: ''All Documents'', ''Starred'', ''Trash'', a ''Folders'' section listing every folder (Engineering, Product, Meeting Notes, Personal, Shared, DevOps, Archive 2024, Design, Hiring, Security, Customer Research, Data & Analytics, Compliance, Marketing), and a ''Filter by Owner'' section with one link per user (e.g. ''Alex Rivera (ID 1)''). OUTCOME: folder links go to /folder/<id> (docs in that folder); owner links reload the dashboard filtered by owner_id. EXAMPLE: click ''DevOps'' to open /sites/documents/folder/6.'
  search:
  - 'Dashboard / DocEdit index (/sites/documents/) -> ''Search documents...'' text field (name=q) in the top header bar; submitting reloads the grid. OUTCOME: case-insensitive substring match on document title OR content (owner/shared docs only), showing the match count. EXAMPLE: search ''MeridianFlow'' surfaces ''RFC: MeridianFlow API Redesign'' (doc 1) and ''MeridianFlow Deployment Runbook'' (doc 2).'
  - 'Dashboard / DocEdit index (/sites/documents/) -> the same header ''Search documents...'' (q) field working together with the ''Sort:'' dropdown (the active sort is preserved as a hidden field across a search). OUTCOME: filtered-and-sorted result grid. EXAMPLE: search ''Roadmap'' then Sort ''Title A-Z'' to list matching docs like ''Q4 2025 Product Roadmap'' (doc 7) alphabetically.'
  sort_by_form:
  - 'Dashboard / DocEdit index (/sites/documents/) -> ''Sort:'' <select> in the toolbar with three options: ''Last modified'' (sort=updated, default, updated_at DESC), ''Date created'' (sort=created, created_at DESC), and ''Title A-Z'' (sort=title, title ASC). OUTCOME: reloads the grid re-ordered by the chosen key. EXAMPLE: choose ''Title A-Z'' to order the list starting with docs like ''1:1 Notes - Priya & Alex'' (doc 9).'
  toggle_relationship:
  - 'Editor page toolbar (/sites/documents/editor/<id>) -> star toggle button reading ''☆ Star'' when unstarred and ''★ Unstar'' when starred (posts to /document/<id>/star). OUTCOME: flips the document''s is_starred flag and reloads the editor. EXAMPLE: on ''Incident Postmortem: MeridianFlow Webhook Outage'' (doc 3, currently unstarred) click ''☆ Star'' to star it.'
  - 'Starred page (/sites/documents/starred) -> ''★ Unstar'' button on each starred document row (shown when logged in). OUTCOME: POST /document/<id>/star clears is_starred, removing the document from the Starred list. EXAMPLE: unstar ''PRD: MeridianLens 2.0'' (doc 5) to drop it off the Starred page.'
  translate_by_query:
  - 'Editor page (/sites/documents/editor/<id>) -> ''Content'' textarea in the edit form (owner/edit access). Replace or rewrite the body text (e.g. a translated or reworded version) and click ''Save Changes'' (POST /document/<id>/update). OUTCOME: overwrites the document content, recomputes word_count, and logs a revision. EXAMPLE: open ''Engineering Onboarding Guide for New Hires'' (doc 4) and rewrite/translate its content in the textarea, then Save Changes.'
  upload_file:
  - 'Left sidebar (dashboard, /sites/documents/) -> ''Upload File'' control: a file <input type=file> above the ''Upload File'' button (form posts multipart to /upload). OUTCOME: creates a new document titled with the uploaded file''s name and body ''[Uploaded file: <name>]'', owned by the current user, then redirects to its editor. EXAMPLE: choosing ''meeting-notes.txt'' creates a new doc titled ''meeting-notes.txt'' owned by Alex Rivera (ID 1).'
