converters-calculators:
  create_by_form:
  - "Any converter page (/converter/<tool_id>) or calculator page (/calculator/<tool_id>) -> green 'Save to Dashboard' button inside the result box (POST /save-conversion). OUTCOME: appends the just-computed result to the logged-in user's saved_conversions AND history, then redirects back; the row then shows on /dashboard. The button only renders when signed in (default auto-login = user 1 'Alex Rivera'). Fields are hidden inputs auto-filled by JS after Convert/Calculate: tool (the tool id, e.g. length/currency/bmi/mortgage/tip), from_value, from_unit, to_unit, result, redirect_to. EXAMPLE: on the Length Converter, convert 1 Mile -> Kilometer (result 1.609344), click 'Save to Dashboard' -> dashboard gains the saved row 'length: 1 mile = 1.609344 kilometer'."
  navigate_by_route:
  - "Home page '/' ('CalcTools') -> click a tool card title link. OUTCOME: loads that tool's dedicated page. Two labeled grids: 'Unit Converters' (8 cards -> Length Converter /converter/length, Weight Converter /converter/weight, Temperature Converter /converter/temperature, Currency Converter /converter/currency, Volume Converter /converter/volume, Area Converter /converter/area, Speed Converter /converter/speed, Number Base Converter /converter/base) and 'Calculators' (3 cards -> BMI Calculator /calculator/bmi, Mortgage Calculator /calculator/mortgage, Tip Calculator /calculator/tip). Header nav also routes: Home, Dashboard, Logout/Sign In, MiniWeb. EXAMPLE: click the 'Currency Converter' card to open /sites/converters-calculators/converter/currency."
  report_information:
  - "Converter page (e.g. /converter/length) -> result box shown after clicking the blue 'Convert' button. OUTCOME: reads back the computed number (rounded to 6 dp; currency to 2 dp) plus the sentence label 'VALUE FROM_UNIT = RESULT TO_UNIT'. EXAMPLE: on Length Converter, 1 Mile -> Kilometer displays result '1.609344' with label '1 Mile (mi) = 1.609344 Kilometer (km)'."
  - "Dashboard page (/dashboard, requires login) -> two stat cards ('Saved Conversions' count, 'History Items' count) plus a 'Saved Conversions (N)' list and a 'Conversion History (N)' list; each row reads 'tool: from_value from_unit = result to_unit'. OUTCOME: read/compare saved rows across the list. Content is per-user (default auto-login user 1 'Alex Rivera' has 0 saved/0 history). EXAMPLE: user 4 'Priya Sharma' (priya_convert, 13 saved / 83 history) shows rows like 'currency: 19129 EUR = 3104362.24 JPY' and 'temperature: 263 kelvin = -10.15 celsius'."
  - "Calculator page (/calculator/<bmi|mortgage|tip>) -> result box shown after the red 'Calculate' button. OUTCOME: reads back the computed figures (there is NO free-form expression input; each calculator has fixed labeled fields). BMI: weight (kg) + height (m) -> BMI value + category (Underweight / Normal weight / Overweight / Obese). Mortgage: loan amount ($) + annual rate (%) + term (years) -> monthly payment, total payment, total interest. Tip: bill ($) + tip (%) + split people -> tip amount, total, per person. EXAMPLE: BMI with weight 70 kg, height 1.75 m -> '22.86' with 'Category: Normal weight'; Mortgage $300000 at 6.5% for 30 yrs -> '$1,896.2/mo' (total interest $382,633.47)."
  - "Converter page -> the two <select> dropdowns 'From' (id=from-unit) and 'To' (id=to-unit), each option labeled 'Name (symbol)'; 'To' defaults to the 2nd option. OUTCOME: read/choose the available units for the category. REAL option sets: Length = Meter (m), Kilometer (km), Centimeter (cm), Millimeter (mm), Mile (mi), Yard (yd), Foot (ft), Inch (in); Weight = Kilogram (kg), Gram (g), Milligram (mg), Pound (lb), Ounce (oz), Stone (st), Metric Ton (t), US Ton (ton); Temperature = Celsius (C), Fahrenheit (F), Kelvin (K); Currency = USD, EUR, GBP, JPY, CAD, AUD, CHF, CNY (each option shows 'USD (USD)' style); Volume = Liter (L), Milliliter (mL), US Gallon (gal), US Quart (qt), US Cup (cup), US Fluid Ounce (fl oz), US Tablespoon (tbsp), US Teaspoon (tsp); Area = Square Meter (m2), Square Kilometer (km2), Square Foot (ft2), Square Yard (yd2), Acre (ac), Hectare (ha), Square Mile (mi2); Speed = Meters per Second (m/s), Kilometers per Hour (km/h), Miles per Hour (mph), Knots (kn), Feet per Second (ft/s). EXAMPLE: on the Currency Converter pick From=EUR, To=JPY to read the conversion of euros into yen."
  - "Number Base Converter page (/converter/base) -> a text 'Number' input (default 255) plus two dropdowns 'From Base' (default Decimal) and 'To Base' (default Binary). OUTCOME: read/choose the numeral base. Each dropdown has exactly 4 options: Decimal (10), Binary (2), Octal (8), Hexadecimal (16) -- ONLY bases 2, 8, 10, 16 are supported (not an arbitrary 2-36 range). Result box shows the converted string and its decimal value. EXAMPLE: 255 from Decimal (10) to Binary (2) displays '11111111' with label '255 (base 10) = 11111111 (base 2) [decimal: 255]'."
  search:
  - "Home page '/' ('CalcTools'), 'Unit Converters' section -> locate a converter by scanning its 8 tool cards (Length, Weight, Temperature, Currency, Volume, Area, Speed, Number Base). NOTE: the site has NO free-text search input anywhere; tool discovery is done by browsing this labeled card grid, and each card title is a direct link to that tool's page. OUTCOME: find and open the intended converter. EXAMPLE: scan the grid to find the 'Speed Converter' card and click it to reach /converter/speed."
  - "Home page '/' ('CalcTools'), 'Calculators' section -> locate a calculator by scanning its 3 tool cards (BMI Calculator, Mortgage Calculator, Tip Calculator). NOTE: there is no search box and no separate category pages -- these are anchor links within the single index page, so 'searching' means browsing the two labeled sections. OUTCOME: find and open the intended calculator. EXAMPLE: scan the 'Calculators' section to find the 'Mortgage Calculator' card and click it to reach /calculator/mortgage."
