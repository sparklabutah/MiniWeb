<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniWeb Annotator — Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); width: 100%; max-width: 380px; }
        .card h1 { font-size: 1.4rem; font-weight: 700; color: #1e293b; text-align: center; margin-bottom: .3rem; }
        .card .sub { text-align: center; font-size: .85rem; color: #94a3b8; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .8rem; font-weight: 600; color: #475569; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: .95rem; outline: none; transition: border-color .15s; }
        .form-group input:focus { border-color: #3b82f6; }
        .btn { width: 100%; padding: .75rem; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; margin-top: .5rem; }
        .btn:hover { background: #2563eb; }
        .error { color: #ef4444; font-size: .85rem; text-align: center; margin-bottom: 1rem; background: #fef2f2; padding: .5rem; border-radius: 6px; }
        .back { text-align: center; margin-top: 1rem; font-size: .85rem; }
        .back a { color: #3b82f6; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>MiniWeb Annotator</h1>
        <p class="sub">Sign in to access the annotation interface</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="back"><a href="/">Back to MiniWeb</a></div>
    </div>
</body>
</html>
