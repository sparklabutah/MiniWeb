<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DesignFlow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e4e4e7; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.08); padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.4rem; color: #7c3aed; font-weight: 800; letter-spacing: -.5px; }
        .header h1 a { color: inherit; text-decoration: none; }
        .header-nav { display: flex; align-items: center; gap: 1rem; }
        .header-nav a { font-size: .9rem; color: #a1a1aa; text-decoration: none; padding: .3rem .6rem; border-radius: .3rem; transition: background .15s; }
        .header-nav a:hover { background: rgba(124,58,237,.15); color: #c4b5fd; }

        .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .login-card { background: #27272a; border: 1px solid #3f3f46; border-radius: .8rem; padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }

        .login-card .logo-area { text-align: center; margin-bottom: 1.8rem; }
        .login-card .logo-area .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #7c3aed, #ec4899); border-radius: .8rem; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #fff; font-weight: 800; margin-bottom: .8rem; }
        .login-card .logo-area h2 { font-size: 1.3rem; color: #f4f4f5; margin-bottom: .3rem; }
        .login-card .logo-area p { font-size: .85rem; color: #71717a; }

        .error-msg { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; padding: .6rem .8rem; border-radius: .4rem; font-size: .85rem; margin-bottom: 1rem; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .82rem; color: #a1a1aa; margin-bottom: .4rem; font-weight: 500; }
        .form-group input { width: 100%; padding: .65rem .8rem; background: #1e1e1e; border: 1px solid #3f3f46; border-radius: .4rem; color: #f4f4f5; font-size: .9rem; transition: border-color .15s; }
        .form-group input:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.15); }
        .form-group input::placeholder { color: #52525b; }

        .submit-btn { width: 100%; padding: .7rem; background: #7c3aed; color: #fff; border: none; border-radius: .4rem; font-size: .95rem; font-weight: 600; cursor: pointer; transition: background .15s; }
        .submit-btn:hover { background: #6d28d9; }

        .login-footer { text-align: center; margin-top: 1.2rem; font-size: .82rem; color: #71717a; }
        .login-footer a { color: #7c3aed; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }

        .bg-decor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: hidden; }
        .bg-decor .circle { position: absolute; border-radius: 50%; opacity: .06; }
        .bg-decor .c1 { width: 500px; height: 500px; background: #7c3aed; top: -150px; right: -100px; }
        .bg-decor .c2 { width: 400px; height: 400px; background: #ec4899; bottom: -100px; left: -80px; }
        .bg-decor .c3 { width: 200px; height: 200px; background: #6366f1; top: 40%; left: 15%; }
    </style>
</head>
<body>
    <div class="bg-decor">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
    </div>

    <div class="header">
        <h1><a href="{{ url_for('design-creative.index') }}">DesignFlow</a></h1>
        <div class="header-nav">
            <a href="{{ url_for('design-creative.index') }}">Templates</a>
            <a href="{{ url_for('design-creative.assets_page') }}">Assets</a>
            <a href="/">MiniWeb</a>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-icon">D</div>
                <h2>Welcome back</h2>
                <p>Sign in to your DesignFlow account</p>
            </div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('design-creative.login_submit') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <div class="login-footer">
                <a href="{{ url_for('design-creative.index') }}">Browse templates without signing in</a>
            </div>
        </div>
    </div>
</body>
</html>
