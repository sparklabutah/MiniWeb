<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixShare - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #262626; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #fff; border: 1px solid #dbdbdb; border-radius: 4px; padding: 40px; width: 350px; text-align: center; }
        .login-card .logo { font-size: 36px; font-weight: 700; font-style: italic; margin-bottom: 24px; }
        .form-group { margin-bottom: 12px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #dbdbdb; border-radius: 4px; font-size: 14px; background: #fafafa; }
        .form-group input:focus { outline: none; border-color: #a8a8a8; }
        .btn-login { width: 100%; padding: 10px; background: #0095f6; color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn-login:hover { background: #0081d6; }
        .error { color: #ed4956; font-size: 13px; margin-bottom: 12px; }
        .signup-link { margin-top: 20px; font-size: 13px; color: #8e8e8e; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">PixShare</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('multimedia-posting.login_submit') }}">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>
        <div class="signup-link">
            <p>Share your moments with the world.</p>
        </div>
    </div>
</body>
</html>
