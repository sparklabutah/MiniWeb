<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - HeartLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #f093fb 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .top-nav { position: fixed; top: 0; left: 0; right: 0; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .top-nav a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .top-nav a:hover { color: #fff; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { font-size: 2.5rem; color: #fff; font-weight: 800; letter-spacing: -1px; }
        .logo p { color: rgba(255,255,255,0.85); font-size: 1.1rem; margin-top: 0.3rem; }
        .login-card { background: #fff; border-radius: 1.2rem; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .login-card h2 { font-size: 1.4rem; color: #1a1a2e; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 0.4rem; font-weight: 500; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border: 2px solid #e8e8e8; border-radius: 0.6rem; font-size: 1rem; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #667eea; outline: none; }
        .btn-login { width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #667eea, #f093fb); color: #fff; border: none; border-radius: 0.6rem; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-login:hover { opacity: 0.9; }
        .error { background: #fff0f0; color: #dc3545; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.9rem; margin-bottom: 1rem; text-align: center; }
        .browse-link { display: block; text-align: center; margin-top: 1.5rem; }
        .browse-link a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 0.95rem; padding: 0.5rem 1.5rem; border: 2px solid rgba(255,255,255,0.5); border-radius: 2rem; transition: all 0.2s; }
        .browse-link a:hover { background: rgba(255,255,255,0.15); border-color: #fff; color: #fff; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="{{ url_for('dating.profiles_list') }}">Browse Profiles</a>
    </div>
    <div class="logo">
        <h1>HeartLink</h1>
        <p>Find your connection</p>
    </div>
    <form class="login-card" method="post" action="{{ url_for('dating.login_submit') }}">
        <h2>Sign In</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <div style="text-align:center;margin-top:1rem;font-size:.9rem;color:#888;">
            New to HeartLink? <a href="{{ url_for('dating.register_page') }}" style="color:#667eea;font-weight:600;">Create an account</a>
        </div>
    </form>
    <div class="browse-link">
        <a href="{{ url_for('dating.profiles_list') }}">Browse profiles without signing in</a>
    </div>
</body>
</html>
