<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Document - DocEdit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #202124; }
        .header { background: #fff; border-bottom: 1px solid #dadce0; padding: 0.6rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 0.8rem; }
        .header-left a.back { color: #5f6368; text-decoration: none; font-size: 1.2rem; }
        .header-left h1 { font-size: 1.2rem; font-weight: 500; color: #202124; }
        .header-nav a { font-size: 0.85rem; color: #5f6368; text-decoration: none; padding: 0.4rem 0.7rem; }

        .main { max-width: 700px; margin: 2rem auto; padding: 0 1.5rem; }
        .card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 2rem; }
        .card h2 { font-size: 1.2rem; font-weight: 500; margin-bottom: 1.5rem; color: #202124; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; color: #5f6368; margin-bottom: 0.3rem; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #dadce0; border-radius: 4px; font-size: 0.95rem; color: #202124; font-family: inherit; }
        .form-group textarea { min-height: 200px; resize: vertical; line-height: 1.6; }
        .btn-create { padding: 0.7rem 1.5rem; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: 500; }
        .btn-create:hover { background: #1557b0; }
        .info { font-size: 0.82rem; color: #80868b; margin-top: 1rem; }
        .info code { background: #f1f3f4; padding: 0.1rem 0.3rem; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="{{ url_for('documents.index') }}" class="back">&larr;</a>
            <h1>Create New Document</h1>
        </div>
        <div class="header-nav">
            <a href="{{ url_for('documents.index') }}">All Documents</a>
            <a href="{{ url_for('documents.starred') }}">Starred</a>
            <a href="{{ url_for('documents.trash') }}">Trash</a>
            <a href="/">MiniWeb</a>
        </div>
    </div>

    <div class="main">
        <div class="card">
            <h2>New Document</h2>
            <form method="post" action="{{ url_for('documents.form_create_document') }}">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title" required placeholder="Enter document title">
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea name="content" id="content" placeholder="Write your document content here..."></textarea>
                </div>
                <div class="form-group">
                    <label for="owner_id">Owner</label>
                    <select name="owner_id" id="owner_id">
                        {% for u in users %}
                        <option value="{{ u.id }}" {% if user and user.id == u.id %}selected{% endif %}>{{ u.name }} (ID {{ u.id }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="folder_id">Folder (optional)</label>
                    <select name="folder_id" id="folder_id">
                        <option value="">No folder</option>
                        {% for f in folders %}
                        <option value="{{ f.id }}">{{ f.name }} (ID {{ f.id }})</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn-create">Create Document</button>
            </form>
            <p class="info">
                You can also create documents via the API: <code>POST /sites/documents/api/documents</code> with JSON body <code>{"title": "...", "content": "...", "owner_id": N, "folder_id": N}</code>
            </p>
        </div>
    </div>
</body>
</html>
