<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AppVault</title>
    <style>
        :root {
            --gp-green: #01875f; --gp-green-light: #e6f4ea;
            --gp-blue: #1a73e8; --gp-blue-light: #e8f0fe;
            --gp-bg: #f8f9fa; --gp-surface: #fff;
            --gp-text: #202124; --gp-text-secondary: #5f6368;
            --gp-border: #dadce0; --gp-star: #e8710a;
            --gp-shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gp-bg); color: var(--gp-text); }
        .topbar { background: var(--gp-surface); border-bottom: 1px solid var(--gp-border); position: sticky; top: 0; z-index: 100; }
        .topbar-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 1.5rem; padding: .6rem 1.5rem; }
        .logo { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--gp-text); font-size: 1.25rem; font-weight: 500; white-space: nowrap; }
        .logo-icon { width: 32px; height: 32px; border-radius: 4px; background: linear-gradient(135deg, #4285f4, #34a853, #fbbc04, #ea4335); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: .9rem; }
        .nav-links { display: flex; gap: .25rem; align-items: center; margin-left: auto; }
        .nav-links a { padding: .45rem .85rem; border-radius: 20px; text-decoration: none; font-size: .85rem; font-weight: 500; color: var(--gp-text-secondary); transition: background .15s; white-space: nowrap; }
        .nav-links a:hover { background: var(--gp-bg); color: var(--gp-text); }
        .nav-links .login-btn { background: var(--gp-blue); color: #fff; }
        .nav-links .login-btn:hover { background: #1557b0; color: #fff; }
.container { max-width: 600px; margin: 0 auto; padding: 2rem 1.5rem; }
        .page-title { font-size: 1.4rem; margin-bottom: .5rem; }
        .subtitle { color: #64748b; font-size: .95rem; margin-bottom: 1.5rem; }
        .settings-form { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: .88rem; font-weight: 600; color: #475569; margin-bottom: .4rem; }
        .form-group select, .form-group input[type="range"] { width: 100%; padding: .6rem .75rem; border: 1px solid #cbd5e1; border-radius: .4rem; font-size: .9rem; outline: none; }
        .form-group select:focus { border-color: #3b82f6; }
        .form-group input[type="range"] { padding: .4rem 0; border: none; }
        .slider-value { display: inline-block; font-size: .88rem; color: #64748b; margin-left: .5rem; }
        .checkbox-group { display: flex; align-items: center; gap: .5rem; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-group label { font-size: .95rem; font-weight: 400; color: #1e293b; cursor: pointer; }
        .divider { border: none; border-top: 1px solid #e2e8f0; margin: 1.5rem 0; }
        .section-label { font-size: 1rem; font-weight: 700; color: #1e293b; margin-bottom: 1rem; }
        .btn { padding: .7rem 1.5rem; background: #2563eb; color: #fff; border: none; border-radius: .5rem; font-size: .95rem; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="topbar">
    <div class="topbar-inner">
        <a class="logo" href="{{ url_for('software-marketplace.index') }}">
            <div class="logo-icon">A</div>
            AppVault
        </a>
        <div class="nav-links">
            <a href="{{ url_for('software-marketplace.apps_list') }}">Browse</a>
            <a href="{{ url_for('software-marketplace.compare_page') }}">Compare</a>
            {% if user %}
                <a href="{{ url_for('software-marketplace.my_apps') }}">My Apps</a>
                <a href="{{ url_for('software-marketplace.purchases_page') }}">Purchases</a>
                <a href="{{ url_for('software-marketplace.wishlist_page') }}">Wishlist</a>
                <a href="{{ url_for('software-marketplace.cart_page') }}">Cart</a>
                <a href="{{ url_for('software-marketplace.settings_page') }}">Settings</a>
                <a href="{{ url_for('software-marketplace.logout') }}">{{ user.display_name }}</a>
            {% else %}
                <a href="{{ url_for('software-marketplace.login_page') }}" class="login-btn">Sign in</a>
            {% endif %}
            <a href="/">MiniWeb</a>
        </div>
    </div>
</div>
    <div class="container">
        <h2 class="page-title">Settings</h2>
        <p class="subtitle">Manage your AppVault preferences</p>

        <form method="post" action="{{ url_for('software-marketplace.settings_update') }}" class="settings-form">
            <div class="section-label">Appearance</div>

            <div class="form-group">
                <label for="theme">Theme</label>
                <select id="theme" name="theme">
                    <option value="light" {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
                    <option value="dark" {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
                    <option value="auto" {% if settings.theme == 'auto' %}selected{% endif %}>Auto (System)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="language">Language</label>
                <select id="language" name="language">
                    <option value="English" {% if settings.language == 'English' %}selected{% endif %}>English</option>
                    <option value="Spanish" {% if settings.language == 'Spanish' %}selected{% endif %}>Spanish</option>
                    <option value="French" {% if settings.language == 'French' %}selected{% endif %}>French</option>
                    <option value="German" {% if settings.language == 'German' %}selected{% endif %}>German</option>
                    <option value="Japanese" {% if settings.language == 'Japanese' %}selected{% endif %}>Japanese</option>
                    <option value="Chinese" {% if settings.language == 'Chinese' %}selected{% endif %}>Chinese</option>
                </select>
            </div>

            <hr class="divider">
            <div class="section-label">Downloads & Updates</div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="auto_update" name="auto_update" {% if settings.auto_update %}checked{% endif %}>
                    <label for="auto_update">Auto-update apps</label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="download_wifi_only" name="download_wifi_only" {% if settings.download_wifi_only %}checked{% endif %}>
                    <label for="download_wifi_only">Download over Wi-Fi only</label>
                </div>
            </div>

            <hr class="divider">
            <div class="section-label">Notifications</div>

            <div class="form-group">
                <label for="notification_frequency">Notification Frequency: <span class="slider-value" id="freq_display">{{ settings.notification_frequency }}</span></label>
                <input type="range" id="notification_frequency" name="notification_frequency" min="0" max="10" value="{{ settings.notification_frequency }}" oninput="document.getElementById('freq_display').textContent = this.value">
                <div style="display: flex; justify-content: space-between; font-size: .78rem; color: #94a3b8; margin-top: .2rem;">
                    <span>Off</span>
                    <span>Maximum</span>
                </div>
            </div>

            <hr class="divider">
            <div class="section-label">Content</div>

            <div class="form-group">
                <label for="content_filter">Content Filter</label>
                <select id="content_filter" name="content_filter">
                    <option value="Everyone" {% if settings.content_filter == 'Everyone' %}selected{% endif %}>Everyone</option>
                    <option value="Teen" {% if settings.content_filter == 'Teen' %}selected{% endif %}>Teen</option>
                    <option value="Mature" {% if settings.content_filter == 'Mature' %}selected{% endif %}>Mature 17+</option>
                </select>
            </div>

            <button type="submit" class="btn">Save Settings</button>
        </form>
    </div>
</body>
</html>
