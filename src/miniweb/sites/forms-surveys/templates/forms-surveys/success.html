<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ form.title }} - FormFlow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', 'Google Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: #f0ebf8; color: #202124; -webkit-font-smoothing: antialiased; }
        .gf-wrap { max-width: 640px; margin: 0 auto; padding: 1.5rem .75rem 0; }
        .gf-card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; border-top: 10px solid #673ab7; padding: 1.75rem 1.5rem; }
        .gf-card h1 { font-size: 1.75rem; font-weight: 400; line-height: 1.3; margin-bottom: 1rem; }
        .gf-card p { font-size: .875rem; color: #202124; line-height: 1.6; }
        .gf-card .again { display: inline-block; margin-top: 1.1rem; color: #673ab7; font-size: .875rem; font-weight: 500; text-decoration: none; }
        .gf-card .again:hover { text-decoration: underline; }
        .gf-footer { max-width: 640px; margin: 1.2rem auto 0; padding: 0 .85rem; font-size: .7rem; color: #5f6368; line-height: 1.6; }
        .gf-footer a { color: #5f6368; }
    </style>
</head>
<body>
    <div class="gf-wrap">
        <div class="gf-card">
            <h1>{{ form.title }}</h1>
            <p>Your response has been recorded.</p>
            <a class="again" href="{{ url_for('forms-surveys.respond_form', form_id=form.id) }}">Submit another response</a>
        </div>
    </div>

    <div class="gf-footer">
        This content is created by the form owner. The data you submit will be sent to
        <a href="{{ url_for('forms-surveys.index') }}">FormFlow</a>. &nbsp;Never submit passwords through FormFlow.
    </div>
</body>
</html>
