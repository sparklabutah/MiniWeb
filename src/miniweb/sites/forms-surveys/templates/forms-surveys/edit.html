<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormFlow - Edit {{ form.title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #202124; }
        .header { background: #673ab7; color: #fff; padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 700; }
        .header-nav { display: flex; gap: 1.2rem; align-items: center; }
        .header-nav a { color: #e1bee7; text-decoration: none; font-size: .9rem; }
        .header-nav a:hover { color: #fff; }
        .header-nav .user-info { color: #ce93d8; font-size: .85rem; }
        .container { max-width: 750px; margin: 0 auto; padding: 1.5rem; }
        .form-section { background: #fff; border-radius: 8px; border: 1px solid #dadce0; padding: 1.5rem; margin-bottom: 1rem; }
        .form-section.title-section { border-top: 4px solid #673ab7; }
        .form-section h2 { font-size: 1.2rem; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #5f6368; margin-bottom: .3rem; }
        .form-group input[type="text"], .form-group textarea, .form-group select {
            width: 100%; padding: .65rem .8rem; border: 1.5px solid #dadce0; border-radius: 6px;
            font-size: .95rem; font-family: inherit; outline: none; transition: border-color .15s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #673ab7; }
        .form-group textarea { min-height: 60px; resize: vertical; }
        .field-builder { border: 1px solid #e8eaed; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; background: #fafafa; position: relative; }
        .field-builder .field-row { display: flex; gap: .5rem; margin-bottom: .5rem; }
        .field-builder .field-row input, .field-builder .field-row select {
            padding: .5rem .6rem; border: 1.5px solid #dadce0; border-radius: 4px; font-size: .88rem; outline: none;
        }
        .field-builder .field-row input:focus, .field-builder .field-row select:focus { border-color: #673ab7; }
        .field-builder .field-row input[type="text"] { flex: 1; }
        .field-builder .field-row select { width: 130px; }
        .field-builder .options-input { margin-top: .3rem; }
        .field-builder .options-input input { width: 100%; }
        .field-builder .options-hint { font-size: .75rem; color: #80868b; margin-top: .2rem; }
        .field-builder .required-check { font-size: .85rem; display: flex; align-items: center; gap: .3rem; }
        .field-builder .required-check input { accent-color: #673ab7; }
        .btn-remove-field { position: absolute; top: .5rem; right: .5rem; background: none; border: none; color: #80868b; font-size: 1.2rem; cursor: pointer; line-height: 1; padding: .2rem; }
        .btn-remove-field:hover { color: #d32f2f; }
        .btn-add-field { background: #fff; border: 2px dashed #dadce0; padding: .6rem 1rem; border-radius: 6px; font-size: .88rem; color: #673ab7; cursor: pointer; width: 100%; text-align: center; font-weight: 500; }
        .btn-add-field:hover { border-color: #673ab7; background: #f3e5f5; }
        .submit-section { display: flex; gap: .5rem; margin-top: 1rem; align-items: center; }
        .btn-submit { background: #673ab7; color: #fff; border: none; padding: .7rem 2rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #5e35b1; }
        .btn-cancel { background: #fff; color: #5f6368; border: 1px solid #dadce0; padding: .7rem 1.5rem; border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none; }
        .btn-cancel:hover { background: #f1f3f4; }
        .edit-hint { background: #f3e5f5; border-radius: 6px; padding: .8rem 1rem; margin-bottom: 1rem; font-size: .88rem; }
        #save-status { font-size: .85rem; color: #5f6368; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FormFlow</h1>
        <div class="header-nav">
            <a href="{{ url_for('forms-surveys.index') }}">My Forms</a>
            <a href="{{ url_for('forms-surveys.templates_page') }}">Templates</a>
            <a href="{{ url_for('forms-surveys.create_form_page') }}">Create</a>
            {% if user %}
            <span class="user-info">{{ user.name }}</span>
            <a href="{{ url_for('forms-surveys.logout') }}">Logout</a>
            {% else %}
            <a href="{{ url_for('forms-surveys.login_page') }}">Login</a>
            {% endif %}
        </div>
    </div>
    <div class="container">
        <div class="edit-hint">
            Editing <strong>{{ form.title }}</strong> — change the title, description, status, or any field below, then save. Existing responses are kept.
        </div>

        <form id="edit-form">
            <div class="form-section title-section">
                <div class="form-group">
                    <label for="title">Form Title</label>
                    <input type="text" id="title" name="title" placeholder="Untitled Form" value="{{ form.title }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Form description (optional)">{{ form.description }}</textarea>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="draft" {{ 'selected' if form.status == 'draft' else '' }}>Draft</option>
                        <option value="active" {{ 'selected' if form.status == 'active' else '' }}>Active (accepting responses)</option>
                        <option value="closed" {{ 'selected' if form.status == 'closed' else '' }}>Closed (not accepting responses)</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <h2>Fields</h2>
                <div id="fields-container"></div>
                <button type="button" class="btn-add-field" onclick="addField()">+ Add Field</button>
            </div>

            <div class="submit-section">
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{{ url_for('forms-surveys.view_form', form_id=form.id) }}" class="btn-cancel">Cancel</a>
                <span id="save-status"></span>
            </div>
        </form>
    </div>

    <script>
    const FORM_ID = {{ form.id }};
    const EXISTING = {{ form | tojson }};
    let fieldIndex = 0;
    const needsOptions = ['radio', 'checkbox', 'dropdown', 'ranking'];

    function toggleOptions(select) {
        const parent = select.closest('.field-builder');
        const optionsDiv = parent.querySelector('.options-input');
        optionsDiv.style.display = needsOptions.includes(select.value) ? '' : 'none';
    }

    function addField(data) {
        const container = document.getElementById('fields-container');
        const i = fieldIndex;
        const div = document.createElement('div');
        div.className = 'field-builder';
        div.dataset.index = i;
        // Carry the existing field id (blank for new fields) so edits update in place.
        div.dataset.fieldId = (data && data.id) ? data.id : '';
        div.innerHTML = `
            <button type="button" class="btn-remove-field" onclick="removeField(this)">&times;</button>
            <div class="field-row">
                <input type="text" name="field_label_${i}" placeholder="Question" required>
                <select name="field_type_${i}" onchange="toggleOptions(this)">
                    <option value="text">Short text</option>
                    <option value="textarea">Long text</option>
                    <option value="radio">Multiple choice</option>
                    <option value="checkbox">Checkboxes</option>
                    <option value="dropdown">Dropdown</option>
                    <option value="rating">Rating (1-5)</option>
                    <option value="ranking">Ranking (reorder items)</option>
                </select>
            </div>
            <div class="options-input" style="display: none;">
                <input type="text" name="field_options_${i}" placeholder="Option 1, Option 2, Option 3">
                <div class="options-hint">Comma-separated options</div>
            </div>
            <label class="required-check">
                <input type="checkbox" name="field_required_${i}">
                Required
            </label>
        `;
        container.appendChild(div);

        if (data) {
            const labelEl = div.querySelector(`input[name="field_label_${i}"]`);
            const typeEl  = div.querySelector(`select[name="field_type_${i}"]`);
            const optsEl  = div.querySelector(`input[name="field_options_${i}"]`);
            const reqEl   = div.querySelector(`input[name="field_required_${i}"]`);
            if (labelEl) labelEl.value = data.label || '';
            if (typeEl && data.type) {
                if ([].slice.call(typeEl.options).some(o => o.value === data.type)) {
                    typeEl.value = data.type;
                }
                toggleOptions(typeEl);
            }
            if (optsEl && data.options) {
                optsEl.value = Array.isArray(data.options) ? data.options.join(', ') : data.options;
            }
            if (reqEl) reqEl.checked = !!data.required;
        }
        fieldIndex++;
    }

    function removeField(btn) {
        const builder = btn.closest('.field-builder');
        if (document.querySelectorAll('.field-builder').length > 1) {
            builder.remove();
        }
    }

    function collectFields() {
        const fields = [];
        document.querySelectorAll('.field-builder').forEach(function (div) {
            const i = div.dataset.index;
            const label = (div.querySelector(`input[name="field_label_${i}"]`) || {}).value || '';
            const type = (div.querySelector(`select[name="field_type_${i}"]`) || {}).value || 'text';
            const optsRaw = (div.querySelector(`input[name="field_options_${i}"]`) || {}).value || '';
            const required = !!(div.querySelector(`input[name="field_required_${i}"]`) || {}).checked;
            const options = needsOptions.includes(type)
                ? optsRaw.split(',').map(s => s.trim()).filter(Boolean)
                : [];
            const f = { type: type, label: label.trim(), required: required, options: options };
            if (div.dataset.fieldId) f.id = div.dataset.fieldId;  // preserve existing id
            fields.push(f);
        });
        return fields;
    }

    document.getElementById('edit-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const status = document.getElementById('save-status');
        const payload = {
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            status: document.getElementById('status').value,
            fields: collectFields(),
        };
        status.textContent = 'Saving…';
        fetch(`{{ url_for('forms-surveys.api_form_update', form_id=form.id) }}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        })
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
            .then(function (res) {
                if (!res.ok) { status.textContent = (res.data && res.data.error) || 'Save failed.'; return; }
                status.textContent = 'Saved.';
                window.location.href = `{{ url_for('forms-surveys.view_form', form_id=form.id) }}`;
            })
            .catch(function () { status.textContent = 'Save failed.'; });
    });

    // Prefill the builder with the form's existing fields.
    (function initFields() {
        const fields = (EXISTING && EXISTING.fields) || [];
        if (fields.length) {
            fields.forEach(function (f) { addField(f); });
        } else {
            addField();  // always show at least one blank row
        }
    })();
    </script>
</body>
</html>
