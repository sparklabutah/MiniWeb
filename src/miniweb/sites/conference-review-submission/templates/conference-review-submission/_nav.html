<div class="or-navbar">
    <a href="{{ url_for('conference-review-submission.index') }}" class="or-brand">PeerPortal<span class="or-brand-tld">.net</span></a>
    <form class="nav-search" method="get" action="{{ url_for('conference-review-submission.search_page') }}">
        <input type="text" name="q" placeholder="Search articles, authors and reviews..." value="{{ request.args.get('q', '') }}" autocomplete="off">
        <button type="submit" title="Search">&#128269;</button>
    </form>
    <div class="nav-right">
        <a href="{{ url_for('conference-review-submission.venues_page') }}" class="nav-link">All Venues</a>
        {% if user %}
        <a href="{{ url_for('conference-review-submission.console') }}" class="nav-link">Tasks</a>
        <a href="{{ url_for('conference-review-submission.console') }}" class="nav-link">{{ user.name }}</a>
        <a href="{{ url_for('conference-review-submission.logout') }}" class="nav-link">Logout</a>
        {% else %}
        <a href="{{ url_for('conference-review-submission.login_page') }}" class="nav-link">Login</a>
        {% endif %}
        <a href="/" class="nav-link">MiniWeb</a>
    </div>
</div>
<div class="or-tagline">Open Peer Review. Open Publishing. Open Access. Open Discussion. Open Recommendations. Open API. Open Source.</div>
