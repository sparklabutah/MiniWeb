<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PeerPortal</title>
    {% include 'conference-review-submission/_style.html' %}
    <style>
        .login-container { max-width: 400px; margin: 56px auto; padding: 0 20px; }
        .login-logo { text-align: center; margin-bottom: 24px; }
        .login-logo h1 { font-size: 26px; font-weight: 500; margin-bottom: 4px; }
        .login-logo p { font-size: 13px; color: #777; }
        .form-group { margin-bottom: 14px; }
    </style>
</head>
<body>
    {% include 'conference-review-submission/_nav.html' %}

    <form class="login-container" method="post" action="{{ url_for('conference-review-submission.login_submit') }}">
        <div class="login-logo">
            <h1>PeerPortal</h1>
            <p>Open Peer Review. Open Publishing. Open Access.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <div class="form-group">
            <label class="control-label" for="username">Email or Username</label>
            <input type="text" class="form-control" name="username" id="username" required autocomplete="off" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label class="control-label" for="password">Password</label>
            <input type="password" class="form-control" name="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        <div style="text-align:center;margin-top:14px;">
            <a href="{{ url_for('conference-review-submission.index') }}" style="font-size:13px;">Back to venues</a>
        </div>
    </form>
</body>
</html>
