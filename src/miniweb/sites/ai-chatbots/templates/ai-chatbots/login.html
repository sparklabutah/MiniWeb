{% extends "ai-chatbots/base.html" %}
{% block title %}Login - AI Chatbots Hub{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Sign In</h2>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('ai-chatbots.login_submit') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="form-btn">Sign In</button>
    </form>
    <div class="form-link">
        <p>Don't have an account? <a href="{{ url_for('ai-chatbots.register_page') }}">Register</a></p>
    </div>
</div>
{% endblock %}
