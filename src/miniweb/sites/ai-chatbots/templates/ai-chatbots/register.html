{% extends "ai-chatbots/base.html" %}
{% block title %}Register - AI Chatbots Hub{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Create Account</h2>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('ai-chatbots.register_submit') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Choose a password">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email address">
        </div>
        <div class="form-group">
            <label for="display_name">Display Name</label>
            <input type="text" id="display_name" name="display_name" placeholder="Your display name">
        </div>
        <button type="submit" class="form-btn">Create Account</button>
    </form>
    <div class="form-link">
        <p>Already have an account? <a href="{{ url_for('ai-chatbots.login_page') }}">Sign In</a></p>
    </div>
</div>
{% endblock %}
