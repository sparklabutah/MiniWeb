<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StepVista</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f5f5f5; color: #333; }
        a { text-decoration: none; color: #4CAF50; }
        a:hover { text-decoration: underline; }

        .navbar { background: #fff; border-bottom: 3px solid #4CAF50; padding: 0 24px; display: flex; align-items: center; height: 60px; }
        .navbar .logo { font-size: 24px; font-weight: 700; color: #4CAF50; margin-right: 32px; }
        .navbar nav a { margin-right: 20px; color: #555; font-size: 15px; font-weight: 500; }
        .navbar nav a:hover { color: #4CAF50; text-decoration: none; }
        .navbar .spacer { flex: 1; }

        .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 60px); padding: 40px 24px; }
        .login-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 420px; }
        .login-card h1 { font-size: 26px; color: #333; text-align: center; margin-bottom: 8px; }
        .login-card .subtitle { font-size: 14px; color: #999; text-align: center; margin-bottom: 28px; }
        .login-card .brand { text-align: center; margin-bottom: 24px; }
        .login-card .brand span { font-size: 32px; font-weight: 700; color: #4CAF50; }

        .error-msg { background: #ffebee; border: 1px solid #ef9a9a; color: #c62828; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; text-align: center; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #4CAF50; box-shadow: 0 0 0 2px rgba(76,175,80,0.1); }

        .login-btn { width: 100%; padding: 14px; background: #4CAF50; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .login-btn:hover { background: #45a049; }

        .login-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #999; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('visual-how-to-guides.index') }}" class="logo">StepVista</a>
        <nav>
            <a href="{{ url_for('visual-how-to-guides.guides_list') }}">Browse</a>
            <a href="{{ url_for('visual-how-to-guides.authors_directory') }}">Authors</a>
            <a href="{{ url_for('visual-how-to-guides.compare_page') }}">Compare</a>
        </nav>
        <div class="spacer"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand"><span>StepVista</span></div>
            <h1>Sign In</h1>
            <p class="subtitle">Access your bookmarks, ratings, and more.</p>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('visual-how-to-guides.login_submit') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="login-footer">
                <a href="{{ url_for('visual-how-to-guides.index') }}">Back to home</a>
            </div>
        </div>
    </div>
</body>
</html>
