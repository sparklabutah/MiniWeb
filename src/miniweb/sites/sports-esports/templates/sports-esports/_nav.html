{# Shared SportsHub dark header. Pages may set active_nav ('scores'|'standings'
   |'players'|'compare') and active_league_id to highlight a tab. #}
<div class="sc-top">
    <div class="sc-top-inner">
        <a href="{{ url_for('sports-esports.index') }}" class="sc-logo">Sports<b>Hub</b></a>
        <div class="sc-nav">
            <a href="{{ url_for('sports-esports.index') }}" class="{{ 'active' if active_nav == 'scores' }}">Scores</a>
            {% for lg in nav_leagues %}
            <a href="{{ url_for('sports-esports.league_detail', league_id=lg.id) }}" class="{{ 'active' if active_league_id == lg.id }}">{{ lg.abbreviation }}</a>
            {% endfor %}
        </div>
        <div class="sc-right">
            <a href="{{ url_for('sports-esports.standings_page') }}" class="{{ 'active' if active_nav == 'standings' }}">Standings</a>
            <a href="{{ url_for('sports-esports.players_page') }}" class="{{ 'active' if active_nav == 'players' }}">Players</a>
            <a href="{{ url_for('sports-esports.compare_page') }}" class="{{ 'active' if active_nav == 'compare' }}">Compare</a>
            <a href="{{ url_for('sports-esports.favorites_page') }}" class="ic" title="Favorites">&#9733;</a>
            <a href="{{ url_for('sports-esports.login_page') }}" class="ic" title="Account">&#128100;</a>
        </div>
    </div>
</div>
