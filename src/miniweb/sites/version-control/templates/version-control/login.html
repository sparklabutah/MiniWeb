<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to MeridianGit</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; background: #0d1117; color: #e6edf3; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .login-container { width: 100%; max-width: 340px; }

        /* Logo */
        .login-logo { text-align: center; margin-bottom: 20px; }
        .login-logo svg { fill: #f0f6fc; }

        /* Card */
        .login-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-bottom: 16px; }
        .login-card h1 { font-size: 24px; font-weight: 300; color: #e6edf3; text-align: center; margin-bottom: 20px; }

        /* Error */
        .login-error { background: #da363322; border: 1px solid #da363366; border-radius: 6px; padding: 10px 16px; margin-bottom: 16px; font-size: 14px; color: #f85149; text-align: center; }

        /* Form */
        .login-form .form-group { margin-bottom: 16px; }
        .login-form label { display: block; font-size: 14px; font-weight: 600; color: #e6edf3; margin-bottom: 6px; }
        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            padding: 5px 12px;
            font-size: 14px;
        }
        .login-form input:focus {
            outline: none;
            border-color: #1f6feb;
            box-shadow: 0 0 0 3px rgba(31,111,235,0.3);
        }
        .login-form input::placeholder { color: #484f58; }

        .btn-signin {
            width: 100%;
            background: #238636;
            color: #fff;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-signin:hover { background: #2ea043; }

        .forgot-link { text-align: right; margin-top: -8px; margin-bottom: 16px; }
        .forgot-link a { font-size: 12px; color: #58a6ff; }

        /* Bottom card */
        .login-footer { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px 20px; text-align: center; font-size: 14px; color: #8b949e; }
        .login-footer a { color: #58a6ff; }

        /* Footer links */
        .page-footer { margin-top: 40px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .page-footer a { font-size: 12px; color: #484f58; }
        .page-footer a:hover { color: #58a6ff; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-logo">
        <svg height="48" width="48" viewBox="0 0 16 16"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
    </div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <div class="login-card">
        <h1>Sign in to MeridianGit</h1>
        <form method="post" action="{{ url_for('version-control.login_submit') }}" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="forgot-link">
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn-signin">Sign in</button>
        </form>
    </div>

    <div class="login-footer">
        New to MeridianGit? <a href="{{ url_for('version-control.index') }}">Browse as guest</a>
    </div>

    <div class="page-footer">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Security</a>
        <a href="{{ url_for('version-control.index') }}">Home</a>
    </div>
</div>
</body>
</html>
