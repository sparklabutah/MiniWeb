<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Lakeport Civic Hub</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #1a1a2e; }
        .header { background: linear-gradient(135deg, #1b4332, #2d6a4f); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { color: #fff; font-size: 1.4rem; font-weight: 700; }
        .header h1 span { color: #95d5b2; }
        .header-nav a { color: #b7e4c7; text-decoration: none; margin-left: 1.2rem; font-size: .9rem; }
        .header-nav a:hover { color: #fff; }
        .login-wrapper { max-width: 400px; margin: 4rem auto; padding: 0 1.5rem; }
        .login-card { background: #fff; border-radius: .5rem; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .login-card h2 { font-size: 1.4rem; color: #1b4332; margin-bottom: .4rem; text-align: center; }
        .login-card .subtitle { text-align: center; color: #64748b; font-size: .9rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #334155; margin-bottom: .3rem; }
        .form-group input {
            width: 100%; padding: .65rem .8rem; border: 1px solid #d1d5db; border-radius: .3rem;
            font-family: inherit; font-size: .9rem;
        }
        .form-group input:focus { outline: none; border-color: #40916c; box-shadow: 0 0 0 3px rgba(64,145,108,.15); }
        .btn-login { width: 100%; background: #40916c; color: #fff; border: none; padding: .7rem; border-radius: .4rem; cursor: pointer; font-size: 1rem; font-weight: 600; }
        .btn-login:hover { background: #2d6a4f; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: .6rem .8rem; border-radius: .3rem; font-size: .85rem; margin-bottom: 1rem; }
        .users-hint { margin-top: 1.5rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: .4rem; padding: 1rem; }
        .users-hint h4 { font-size: .85rem; color: #475569; margin-bottom: .4rem; }
        .users-hint code { display: block; font-size: .8rem; color: #334155; padding: .15rem 0; }
        .footer { text-align: center; padding: 2rem; color: #94a3b8; font-size: .8rem; border-top: 1px solid #e2e8f0; margin-top: 3rem; background: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('petitions-voting-info.index') }}" style="color:#fff;text-decoration:none;">Lakeport <span>Civic Hub</span></a></h1>
        <div class="header-nav">
            <a href="{{ url_for('petitions-voting-info.petitions_list') }}">Petitions</a>
            <a href="{{ url_for('petitions-voting-info.elections_list') }}">Elections</a>
            <a href="{{ url_for('petitions-voting-info.voter_info_page') }}">Voter Info</a>
            <a href="/">MiniWeb</a>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <h2>Sign In</h2>
            <p class="subtitle">Access your civic engagement dashboard</p>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('petitions-voting-info.login_submit') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="e.g., alex_rivera">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter any password">
                </div>
                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="users-hint">
                <h4>Demo accounts:</h4>
                <code>alex_rivera</code>
                <code>elena_vasquez</code>
                <code>daniel_okonkwo</code>
                <code>sophie_lin</code>
                <code>rachel_kim</code>
                <code>nathan_brooks</code>
                <code>carlos_mendez</code>
            </div>
        </div>
    </div>

    <div class="footer">Lakeport Civic Hub</div>
</body>
</html>
