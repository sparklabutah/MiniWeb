<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SoundShelf</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f1a; color: #e0e0e0; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: #1a1a2e; padding: 2.5rem; border-radius: .6rem; width: 360px; text-align: center; }
        .login-box h1 { font-size: 1.6rem; color: #8b5cf6; margin-bottom: .3rem; font-weight: 800; }
        .login-box p { font-size: .85rem; color: #888; margin-bottom: 1.5rem; }
        .login-box input { width: 100%; padding: .7rem 1rem; margin-bottom: .8rem; border: 1px solid #2d2d44; border-radius: .4rem; background: #0f0f1a; color: #e0e0e0; font-size: .95rem; }
        .login-box input:focus { border-color: #8b5cf6; outline: none; }
        .login-box button { width: 100%; padding: .7rem; background: #8b5cf6; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .login-box button:hover { background: #7c3aed; }
        .error { color: #ef4444; font-size: .85rem; margin-bottom: .8rem; }
        .login-box .back { display: inline-block; margin-top: 1rem; font-size: .9rem; color: #8b5cf6; font-weight: 600; padding: .4rem 1rem; border: 1px solid #8b5cf6; border-radius: .4rem; text-decoration: none; }
        .login-box .back:hover { background: #8b5cf6; color: #fff; }
        .users-hint { margin-top: 1.5rem; text-align: left; font-size: .75rem; color: #555; }
        .users-hint table { width: 100%; border-collapse: collapse; margin-top: .3rem; }
        .users-hint td { padding: .2rem .4rem; border-bottom: 1px solid #2d2d44; }
        .users-hint td:first-child { color: #8b5cf6; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>SoundShelf</h1>
        <p>Sign in to your account</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('podcasts-audiobooks.login_submit') }}">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <a href="{{ url_for('podcasts-audiobooks.index') }}" class="back">Back to SoundShelf</a>
        <div class="users-hint">
            <strong>Demo accounts:</strong>
            <table>
                <tr><td>listener_alice</td><td>pass123</td></tr>
                <tr><td>bookworm_bob</td><td>pass456</td></tr>
                <tr><td>podcast_carol</td><td>pass789</td></tr>
                <tr><td>audio_dave</td><td>pass321</td></tr>
                <tr><td>story_eve</td><td>pass654</td></tr>
            </table>
        </div>
    </div>
</body>
</html>
