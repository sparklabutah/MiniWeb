{% extends "music/base.html" %}
{% set active = '' %}
{% block title %}Create Playlist — SoundWave{% endblock %}
{% block content %}
<div class="form-card" style="max-width:500px;">
    <h1 style="font-size:1.8rem;color:#fff;margin-bottom:6px;">Create Playlist</h1>
    <p style="color:#888;margin-bottom:22px;font-size:.9rem;">Give your playlist a name and description</p>
    {% if error %}
    <div style="color:#e74c3c;font-size:.85rem;text-align:center;margin-bottom:16px;">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('music.create_playlist_submit') }}">
        <div class="fg">
            <label for="name">Playlist Name</label>
            <input type="text" id="name" name="name" placeholder="My Awesome Playlist" required>
        </div>
        <div class="fg">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Add an optional description"></textarea>
        </div>
        <div class="fg" style="flex-direction:row;align-items:center;gap:8px;">
            <input type="checkbox" id="is_public" name="is_public" checked style="width:auto;accent-color:#1db954;">
            <label for="is_public" style="margin-bottom:0;">Make playlist public</label>
        </div>
        <button type="submit" class="btn-green" style="width:100%;">Create Playlist</button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:.9rem;"><a href="{{ url_for('music.playlists_page') }}" style="color:#1db954;">Back to Playlists</a></div>
</div>
{% endblock %}
