<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MeridianFlow Docs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a2540; color: #3c4257; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #fff; border-radius: 12px; padding: 2.5rem; width: 400px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
        .login-card h1 { font-size: 1.5rem; color: #0a2540; margin-bottom: .3rem; }
        .login-card .subtitle { font-size: .9rem; color: #697386; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: #3c4257; margin-bottom: .3rem; font-weight: 500; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1px solid #e3e8ee; border-radius: 6px; font-size: .95rem; }
        .form-group input:focus { outline: none; border-color: #635bff; box-shadow: 0 0 0 3px rgba(99,91,255,.15); }
        .error-msg { background: #fdd; color: #c0392b; padding: .6rem .8rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem; }
        .btn-primary { display: block; width: 100%; padding: .75rem; background: #635bff; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 500; transition: background .15s; }
        .btn-primary:hover { background: #5148c8; }
        .back-link { display: block; text-align: center; margin-top: 1rem; font-size: .85rem; color: #697386; }
        .back-link a { color: #635bff; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Sign In</h1>
        <p class="subtitle">Access your MeridianFlow developer dashboard</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('documentation-api-docs.login_submit') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('documentation-api-docs.index') }}">&larr; Back to documentation</a>
        </div>
    </div>
</body>
</html>
