<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebMail -- Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f6f8fc; color: #202124; }
        .top-bar { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 8px 16px; display: flex; align-items: center; }
        .top-bar h1 { font-size: 1.3rem; color: #1a73e8; }
        .top-bar .sign-in-link { margin-left: auto; padding: 10px 28px; background: #1a73e8; color: #fff; text-decoration: none; border-radius: 24px; font-size: 1rem; font-weight: 600; }
        .top-bar .sign-in-link:hover { background: #1557b0; }
        .login-card { max-width: 420px; margin: 60px auto; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08); padding: 40px 36px; }
        .login-card h2 { font-size: 1.6rem; font-weight: 600; margin-bottom: 8px; color: #202124; text-align: center; }
        .login-card p { text-align: center; font-size: 0.95rem; color: #5f6368; margin-bottom: 28px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; color: #5f6368; margin-bottom: 6px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #dadce0; border-radius: 8px; font-size: 1rem; outline: none; }
        .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.15); }
        .btn-login { width: 100%; padding: 14px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: 600; }
        .btn-login:hover { background: #1557b0; }
        .error { color: #d93025; font-size: 0.85rem; margin-bottom: 16px; text-align: center; background: #fce8e6; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>WebMail</h1>
        <a href="#login-form" class="sign-in-link">Sign In</a>
    </div>
    <form id="login-form" class="login-card" method="post" action="{{ url_for('email.login_submit') }}">
        <h2>Sign In</h2>
        <p>Use your WebMail account</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
</body>
</html>
