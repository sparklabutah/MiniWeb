<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NoteCanvas</title>
    <style>
        :root {
            --amber: #f59e0b;
            --amber-dark: #d97706;
            --amber-light: #fef3c7;
            --text-primary: #1c1917;
            --text-muted: #a8a29e;
            --bg-page: #fafaf9;
            --border: #e7e5e4;
            --radius: .5rem;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-page); color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .login-card {
            background: #fff; padding: 2.5rem 2rem; border-radius: .75rem;
            width: 380px; text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,.06); border: 1px solid var(--border);
        }
        .login-card .logo {
            display: inline-flex; align-items: center; gap: .5rem;
            font-size: 1.4rem; font-weight: 800; color: var(--text-primary);
            margin-bottom: .3rem; letter-spacing: -.02em;
        }
        .login-card .logo .logo-icon {
            width: 30px; height: 30px; background: var(--amber);
            border-radius: 7px; display: flex; align-items: center; justify-content: center;
        }
        .login-card .logo .logo-icon svg { width: 18px; height: 18px; fill: #fff; }
        .login-card .subtitle { font-size: .85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .login-card input {
            width: 100%; padding: .7rem 1rem; margin-bottom: .6rem;
            border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--bg-page); color: var(--text-primary);
            font-size: .9rem; font-family: inherit;
        }
        .login-card input:focus { border-color: var(--amber); outline: none; background: #fff; }
        .login-card button {
            width: 100%; padding: .7rem; margin-top: .4rem;
            background: var(--amber); color: #fff; border: none;
            border-radius: var(--radius); font-size: .95rem;
            cursor: pointer; font-weight: 600; font-family: inherit;
            transition: background .15s;
        }
        .login-card button:hover { background: var(--amber-dark); }
        .error { color: var(--danger); font-size: .85rem; margin-bottom: .6rem; }
        .login-card .back-link {
            display: inline-block; margin-top: 1rem;
            font-size: .85rem; color: var(--amber-dark); font-weight: 500;
        }
        .login-card .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <span class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </span>
            NoteCanvas
        </div>
        <p class="subtitle">Sign in to your notes</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('handwritten-notes-whiteboards.login_submit') }}">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <a href="{{ url_for('handwritten-notes-whiteboards.index') }}" class="back-link">Browse notes without signing in</a>
    </div>
</body>
</html>
