<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In -- CalcTools</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .header { background: #1a73e8; color: #fff; padding: .9rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.4rem; }
        .header h1 a { color: #fff; text-decoration: none; }
        .header-nav a { color: rgba(255,255,255,.85); text-decoration: none; margin-left: 1.2rem; font-size: .9rem; }
        .login-form { max-width: 400px; margin: 4rem auto; padding: 2rem; background: #fff; border: 1px solid #e0e0e0; border-radius: .5rem; }
        .login-form h2 { margin: 0 0 1.5rem; font-size: 1.3rem; color: #333; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: #555; margin-bottom: .3rem; }
        .form-group input { width: 100%; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: .3rem; font-size: .95rem; }
        .form-group input:focus { border-color: #1a73e8; outline: none; }
        .btn-login { width: 100%; padding: .7rem; background: #1a73e8; color: #fff; border: none; border-radius: .3rem; cursor: pointer; font-size: 1rem; }
        .btn-login:hover { background: #1557b0; }
        .error { color: #d93025; font-size: .85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('converters-calculators.index') }}">CalcTools</a></h1>
        <div class="header-nav">
            <a href="{{ url_for('converters-calculators.index') }}">Home</a>
            <a href="/">MiniWeb</a>
        </div>
    </div>

    <form class="login-form" method="post" action="{{ url_for('converters-calculators.login_submit') }}">
        <h2>Sign In</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
</body>
</html>
