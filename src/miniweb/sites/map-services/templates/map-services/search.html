<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search History - CascadiaMaps</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #202124; font-size: 14px; }

        .app { display: flex; height: 100vh; flex-direction: column; }
        .top-bar { background:#fff;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e8eaed;flex-shrink:0; }
        .top-bar .brand { font-size:16px;font-weight:500;color:#5f6368;text-decoration:none; }
        .top-bar .brand b { color:#4285f4; }
        .top-bar .nav-link { font-size:12px;color:#5f6368;text-decoration:none;padding:4px 8px;border-radius:16px; }
        .top-bar .nav-link:hover { background:#f1f3f4; }
        .top-bar .spacer { flex:1; }

        .content { flex: 1; overflow-y: auto; background: #f8f9fa; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }

        h2 { font-size: 16px; margin-bottom: 12px; font-weight: 500; }
        .history-list { list-style: none; display: grid; gap: 6px; }
        .history-item { background: #fff; border: 1px solid #e8eaed; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; transition: box-shadow .15s; }
        .history-item:hover { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .history-icon { width: 36px; height: 36px; border-radius: 50%; background: #f1f3f4; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .history-icon svg { width: 18px; height: 18px; color: #5f6368; }
        .history-info { flex: 1; }
        .history-info .query { font-size: 14px; font-weight: 500; }
        .history-info .result { font-size: 12px; color: #5f6368; margin-top: 1px; }
        .history-info .timestamp { font-size: 11px; color: #9aa0a6; margin-top: 1px; }
        .empty { text-align: center; padding: 40px 16px; color: #5f6368; font-size: 13px; }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <a href="{{ url_for('map-services.index') }}" class="brand"><b>Cascadia</b>Maps</a>
        <a href="{{ url_for('map-services.directions') }}" class="nav-link">Directions</a>
        <a href="{{ url_for('map-services.saved_places') }}" class="nav-link">Saved</a>
        <span class="spacer"></span>
        <a href="/" class="nav-link">MiniWeb</a>
    </div>
    <div class="content">
        <div class="container">
            <h2>Search History</h2>
            {% if history %}
            <ul class="history-list" id="search-history-list">
                {% for h in history %}
                <li class="history-item">
                    <div class="history-icon">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    </div>
                    <div class="history-info">
                        <div class="query">{{ h.query }}</div>
                        <div class="result">{{ h.result_selected }} - {{ h.result_address }}</div>
                        <div class="timestamp">{{ h.timestamp }}</div>
                    </div>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <div class="empty">
                <p>No search history yet.</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
