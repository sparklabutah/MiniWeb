<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - LinguaBridge</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: 'Google Sans', Roboto, -apple-system, sans-serif; background: #f8f9fa; color: #202124; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .container > a:first-child { display: inline-block; font-size: 14px; color: #1a73e8; text-decoration: none; padding: 8px 16px; border-radius: 8px; background: #e8f0fe; margin: 4px 0 20px; }
        .container > a:first-child:hover { background: #d2e3fc; text-decoration: none; }
        h1 { font-size: 24px; font-weight: 500; color: #202124; margin: 0 0 20px; }
        form { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 24px; max-width: 380px; }
        form div { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #5f6368; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; font-family: inherit; font-size: 14px; color: #202124; background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 10px 12px; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #1a73e8; }
        button { font-family: inherit; font-size: 14px; font-weight: 500; color: #fff; background: #1a73e8; border: none; border-radius: 8px; padding: 10px 24px; cursor: pointer; }
        button:hover { background: #1765cc; }
        .container > p { max-width: 380px; background: #fce8e6; border: 1px solid #d93025; border-radius: 8px; padding: 10px 16px; font-size: 14px; margin: 0 0 16px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('translation.index') }}">&larr; Back to Translate</a>
        <h1>Login</h1>

        {% if error %}
        <p style="color:red">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('translation.login_submit') }}">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
