<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Alex Rivera Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: .8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 a { color: #fff; text-decoration: none; font-size: 1.2rem; font-weight: 700; }
        .header h1 a span { color: #e94560; }
        nav { max-width: 1000px; margin: 0 auto; padding: .6rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
        nav a { color: #1a1a2e; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .3rem .5rem; border-radius: .3rem; }
        nav a:hover { background: #f0f4ff; }
        nav a.active { font-weight: 700; background: #fce4ec; color: #e94560; }
        .login-container { max-width: 420px; margin: 4rem auto; padding: 2.5rem; background: #fff; border-radius: .6rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .login-container h2 { color: #1a1a2e; margin-bottom: .5rem; font-size: 1.5rem; }
        .login-container .subtitle { color: #64748b; font-size: .9rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: .85rem; color: #334155; font-weight: 600; margin-bottom: .4rem; }
        .form-group input { width: 100%; padding: .7rem .9rem; border: 1.5px solid #d1d5db; border-radius: .4rem; font-size: .95rem; }
        .form-group input:focus { border-color: #e94560; outline: none; box-shadow: 0 0 0 3px rgba(233,69,96,.15); }
        .btn-login { width: 100%; padding: .8rem; background: #e94560; color: #fff; border: none; border-radius: .4rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #d63851; }
        .error { background: #fef2f2; color: #dc2626; padding: .7rem 1rem; border-radius: .3rem; font-size: .85rem; margin-bottom: 1rem; border: 1px solid #fee2e2; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; font-size: .85rem; color: #94a3b8; }
        .back-link a { color: #e94560; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{{ url_for('personal-portfolio.index') }}">Alex<span>Dev</span></a></h1>
    </div>

    <nav>
        <a href="{{ url_for('personal-portfolio.index') }}">Home</a>
        <a href="{{ url_for('personal-portfolio.projects_page') }}">Projects</a>
        <a href="{{ url_for('personal-portfolio.resume_page') }}">Resume</a>
        <a href="{{ url_for('personal-portfolio.blog_page') }}">Blog</a>
        <a href="{{ url_for('personal-portfolio.login_page') }}" class="active">Sign In</a>
    </nav>

    <form class="login-container" method="post" action="{{ url_for('personal-portfolio.login_submit') }}">
        <h2>Sign In</h2>
        <p class="subtitle">Sign in to manage your portfolio</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <div class="back-link">
            <a href="{{ url_for('personal-portfolio.index') }}">&larr; Back to portfolio</a>
        </div>
    </form>
</body>
</html>
