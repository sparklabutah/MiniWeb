<aside class="tw-sidebar">
    <div class="tw-side-head">
        <span>{% if logged_in %}Followed Channels{% else %}Recommended Channels{% endif %}</span>
        <span class="chev">&#171;</span>
    </div>
    {% for ch in sidebar_channels %}
    <a class="tw-side-ch" href="{{ url_for('live.channel_page', user_id=ch.id) }}">
        <span class="tw-side-av" style="background: {{ ch.color }};">{{ ch.initial }}</span>
        <span class="tw-side-meta">
            <span class="tw-side-name">{{ ch.name }}</span>
            <span class="tw-side-cat">{{ ch.category }}</span>
        </span>
        <span class="tw-side-live {{ '' if ch.live else 'off' }}">
            {% if ch.live %}<span class="tw-dot"></span>{{ ch.viewers }}{% else %}Offline{% endif %}
        </span>
    </a>
    {% endfor %}
</aside>
