{% extends "agency-portals/base.html" %}
{% block title %}Pay Online - City of Lakeport{% endblock %}
{% block content %}
<div class="main-content" style="max-width:700px;">
    <h2 class="section-title">Make a Payment</h2>

    {% if success %}
    <div class="alert alert-success">
        Payment of <strong>${{ paid_amount }}</strong> for <strong>{{ paid_type }}</strong> has been processed successfully.
    </div>
    {% endif %}

    {% if not success %}
    <div class="detail-body">
        <form method="post" action="{{ url_for('agency-portals.pay_submit') }}">
            <div class="form-group">
                <label for="payment_type">Payment Type *</label>
                <select id="payment_type" name="payment_type" required>
                    <option value="">Select payment type</option>
                    {% for pt in payment_types %}
                    <option value="{{ pt.name }}">{{ pt.name }} ({{ pt.category }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="account_number">Account / Reference Number *</label>
                <input type="text" id="account_number" name="account_number" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount ($) *</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Payment</button>
        </form>
    </div>
    {% endif %}
</div>
{% endblock %}
