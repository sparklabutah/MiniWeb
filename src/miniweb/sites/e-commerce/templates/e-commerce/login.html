<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ShopHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #111; }
        .top-bar { background: #131921; padding: 10px 20px; display: flex; align-items: center; }
        .top-bar h1 { color: #fff; font-size: 1.4rem; }
        .top-bar h1 a { color: #fff; text-decoration: none; }
        .login-card { max-width: 380px; margin: 40px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 30px 26px; }
        .login-card h2 { font-size: 1.6rem; font-weight: 600; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 0.95rem; }
        .form-group input:focus { border-color: #e77600; box-shadow: 0 0 3px 2px rgba(228,121,17,.5); outline: none; }
        .btn-login { width: 100%; padding: 10px; background: #f0c14b; border: 1px solid #a88734; border-radius: 4px; cursor: pointer; font-size: 0.95rem; font-weight: 600; color: #111; }
        .btn-login:hover { background: #ddb347; }
        .error { color: #c40000; font-size: 0.85rem; margin-bottom: 14px; padding: 10px; border: 1px solid #c40000; border-radius: 4px; background: #fff0f0; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1><a href="{{ url_for('e-commerce.index') }}">ShopHub</a></h1>
    </div>
    <form class="login-card" method="post" action="{{ url_for('e-commerce.login_submit') }}">
        <h2>Sign In</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
</body>
</html>
