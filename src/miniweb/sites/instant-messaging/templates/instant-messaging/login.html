<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - QuickChat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111b21; color: #e9edef; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { max-width: 400px; width: 100%; padding: 2rem; background: #202c33; border-radius: .8rem; box-shadow: 0 4px 20px rgba(0,0,0,.3); text-align: center; }
        .login-icon { font-size: 3rem; margin-bottom: .8rem; }
        h2 { color: #e9edef; margin-bottom: .3rem; font-size: 1.4rem; }
        .subtitle { color: #8696a0; font-size: .85rem; margin-bottom: 1.5rem; }
        .error { background: rgba(220,38,38,.15); color: #f87171; padding: .6rem .8rem; border-radius: .4rem; font-size: .83rem; margin-bottom: 1rem; border: 1px solid rgba(220,38,38,.3); }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; font-size: .82rem; color: #8696a0; font-weight: 600; margin-bottom: .4rem; }
        .form-group input { width: 100%; padding: .65rem .8rem; background: #2a3942; border: 1.5px solid #3b4a54; border-radius: .4rem; color: #e9edef; font-size: .9rem; outline: none; }
        .form-group input:focus { border-color: #00a884; box-shadow: 0 0 0 3px rgba(0,168,132,.15); }
        .form-group input::placeholder { color: #8696a0; }
        .btn-login { width: 100%; padding: .7rem; background: #00a884; color: #fff; border: none; border-radius: .4rem; font-size: .95rem; font-weight: 600; cursor: pointer; margin-top: .5rem; }
        .btn-login:hover { background: #00c897; }
        .secure-note { margin-top: 1.2rem; font-size: .75rem; color: #8696a0; }
    </style>
</head>
<body>
    <form class="login-container" method="post" action="{{ url_for('instant-messaging.login_submit') }}">
        <div class="login-icon">&#128172;</div>
        <h2>Quick<span style="color:#00a884">Chat</span></h2>
        <p class="subtitle">Sign in to your account</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <div class="secure-note">End-to-end encrypted messaging</div>
    </form>
</body>
</html>
