<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Scholar Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f8f9fa; color: #222; }
        a { color: #1a0dab; text-decoration: none; }
        .login-card { max-width: 400px; margin: 80px auto; background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 40px; }
        .logo { text-align: center; font-size: 28px; margin-bottom: 8px; }
        .logo span.blue { color: #4285f4; }
        .logo span.red { color: #ea4335; }
        .logo span.yellow { color: #fbbc04; }
        .logo span.green { color: #34a853; }
        .subtitle { text-align: center; font-size: 16px; color: #222; margin-bottom: 4px; }
        .desc { text-align: center; font-size: 14px; color: #70757a; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #70757a; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #4285f4; box-shadow: 0 0 0 2px rgba(66,133,244,.2); }
        .error { color: #ea4335; font-size: 13px; margin-bottom: 12px; text-align: center; }
        .btn { width: 100%; padding: 10px; background: #4285f4; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .btn:hover { background: #3367d6; }
        .footer-link { text-align: center; margin-top: 16px; font-size: 13px; color: #70757a; }
    </style>
</head>
<body>
    <form class="login-card" method="post" action="{{ url_for('academic-paper-db.login_submit') }}">
        <div class="logo">
            <span class="blue">S</span><span class="red">c</span><span class="yellow">h</span><span class="blue">o</span><span class="green">l</span><span class="red">a</span><span class="blue">r</span>
        </div>
        <div class="subtitle">Sign in</div>
        <div class="desc">to continue to Scholar Search</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="off" autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        <button type="submit" class="btn">Sign in</button>
        <div class="footer-link">
            <a href="{{ url_for('academic-paper-db.index') }}">Back to search</a> · <a href="/">MiniWeb</a>
        </div>
    </form>
</body>
</html>
