# MiniWeb with current versions: the 65 sites, the graders, the agent harness (browser-use), MiniWebGen, and the
# scripts that download the release.
#
#   conda env create -f environment.yml
#   conda activate miniweb && python -m playwright install chromium
#
# Tested on Ubuntu 22.04.5 LTS, x86_64. The sites need no GPU. The exact environments behind the paper's numbers, with
# the systems they ran on, are scripts/envs/*.yml (REPRODUCE.md).
name: miniweb
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
      - -e .
